# Managed by ansible/kiosk.yaml — do not edit on the node.
# Loaded via `sway -c`, so /etc/sway/config is never read: this is the entire
# configuration and the kiosk has no default keybindings.

# `shell` rather than app_id, so this survives a change of browser.
for_window [shell="xdg_shell"] fullscreen enable

# Shows in the gap before the browser maps.
output * bg #000000 solid_color

default_border none
default_floating_border none

xwayland disable

# The touchscreen's mouse-emulation node otherwise parks a pointer on screen.
seat * hide_cursor 3000

exec /usr/local/bin/kiosk-session
