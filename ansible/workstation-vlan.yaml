---
# Tagged VLAN 50 sub-interface on the workstation.
# A tagged presence on VLAN 50 keeps NAS and cluster traffic inside the UDB.
#
# VLAN 10 stays the primary network. No gateway4 is set and never_default4
# pins that: the default route has to stay on the untagged interface, or all
# egress silently moves onto the Servers VLAN.
# VLAN 50 has no IPv6 by design, hence method6=disabled.
#
# To revert and rollback:
#   sudo nmcli con down vlan50 && sudo nmcli con delete vlan50
- name: Tagged VLAN sub-interface on the workstation
  hosts: workstation
  become: true

  # group_vars/all sets ansible_become_password to the m8hl credential used for
  # the SSH-managed hosts. It applies to this host too, and because it is a
  # variable it would win over --ask-become-pass — so prompt for the
  # workstation's own sudo password and shadow it.
  vars_prompt:
    - name: workstation_become_password
      prompt: sudo password for the workstation
      private: true

  vars:
    ansible_become_password: "{{ workstation_become_password }}"
    vlan_conn: "vlan{{ workstation_vlan_id }}"
    vlan_ifname: "{{ workstation_nic }}.{{ workstation_vlan_id }}"

  tasks:
    - name: Create the VLAN sub-interface
      community.general.nmcli:
        type: vlan
        conn_name: "{{ vlan_conn }}"
        ifname: "{{ vlan_ifname }}"
        vlandev: "{{ workstation_nic }}"
        vlanid: "{{ workstation_vlan_id }}"
        method4: manual
        ip4: "{{ workstation_vlan_ip }}"
        never_default4: true
        method6: disabled
        autoconnect: true
        state: present
      register: vlan_profile

    - name: Check whether the sub-interface is active
      command: nmcli -g GENERAL.STATE connection show {{ vlan_conn }}
      register: vlan_state
      changed_when: false

    # Editing a live connection only writes the profile — the running interface
    # keeps the old addressing until it is brought back up.
    - name: Activate the sub-interface
      command: nmcli connection up {{ vlan_conn }}
      when: vlan_profile is changed or vlan_state.stdout | trim != "activated"

    - name: Read the default route
      command: ip -4 route show default
      register: default_route
      changed_when: false

    - name: Fail if the default route moved onto the sub-interface
      assert:
        that: vlan_ifname not in default_route.stdout
        fail_msg: >-
          Default route is on {{ vlan_ifname }} ({{ default_route.stdout | trim }}).
          Egress would leave over the Servers VLAN — check never_default4.
        success_msg: "Default route still on {{ workstation_nic }}"
