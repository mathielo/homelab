---
- name: Install Tailscale
  hosts: all
  become: true

  tasks:
    - name: Install Tailscale using official install script
      shell:
        cmd: curl -fsSL https://tailscale.com/install.sh | sh
        creates: /usr/bin/tailscale

    - name: Enable and start tailscaled
      systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Check Tailscale status
      command: tailscale status --json
      register: tailscale_status
      changed_when: false
      failed_when: false

    - name: Connect to Tailscale
      command: tailscale up --auth-key={{ tailscale_auth_key }}
      no_log: true
      when: >
        tailscale_status.rc != 0 or
        (tailscale_status.stdout | from_json).BackendState != 'Running'

    - name: Get Tailscale IP
      command: tailscale ip --4
      register: tailscale_ip
      changed_when: false

    - name: Show Tailscale IP
      debug:
        msg:
          - "Tailscale is up! Node IP: {{ tailscale_ip.stdout }}"

    - name: Show Pi-hole DNS setup
      debug:
        msg:
          - "Pi-hole DNS setup — SSH into Pi-hole and run:"
          - "  echo 'address=/.hl/{{ tailscale_ip.stdout }}' | sudo tee /etc/dnsmasq.d/20-k3s.conf && sudo systemctl restart pihole-FTL"
          - "See ansible/k3s.md for full instructions."
      when: "'k3s_servers' in group_names"
