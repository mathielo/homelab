---
- name: Install Tailscale
  hosts: all
  become: true
  tasks:
    - name: Load Tailscale secrets
      community.sops.load_vars:
        file: tailscale.sops.yaml
      no_log: true

    - name: Install Tailscale using official install script
      shell:
        cmd: curl -fsSL https://tailscale.com/install.sh | sh
        creates: /usr/bin/tailscale

    - name: Enable and start tailscaled
      systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Check Tailscale status
      command: tailscale status --json
      register: tailscale_status
      changed_when: false
      failed_when: false

    - name: Enable IP forwarding (required for Tailscale subnet routing)
      sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_set: true
        reload: true
      loop:
        - net.ipv4.ip_forward
        - net.ipv6.conf.all.forwarding
      when: "'k3s_server' in group_names"

    - name: Connect to Tailscale
      command: tailscale up --auth-key={{ tailscale_auth_key }}
      no_log: true
      when: >
        tailscale_status.rc != 0 or
        (tailscale_status.stdout | from_json).BackendState != 'Running'

    - name: Advertise Servers subnet via Tailscale (subnet routing)
      command: tailscale set --advertise-routes=10.10.50.0/24
      when: "'k3s_server' in group_names"

    - name: Get Tailscale IP
      command: tailscale ip --4
      register: tailscale_ip
      changed_when: false

    - name: Show Tailscale IP
      debug:
        msg:
          - "Tailscale is up! Node IP: {{ tailscale_ip.stdout }}"

    - name: Approve subnet route reminder
      debug:
        msg:
          - "Subnet route advertised for 10.10.50.0/24."
          - "Approve it in Tailscale admin console → Machines → {{ inventory_hostname }} → Edit route settings → enable 10.10.50.0/24"
      when: "'k3s_server' in group_names"
