---
- name: Deploy monitoring stack
  hosts: k3s_server
  become: true
  environment:
    KUBECONFIG: /etc/k3s/k3s.yaml

  tasks:
    - name: Load monitoring secrets
      community.sops.load_vars:
        file: monitoring.sops.yaml
      no_log: true

    - name: Add Helm repos
      command: helm repo add {{ item.name }} {{ item.url }}
      loop:
        - {
            name: prometheus-community,
            url: "https://prometheus-community.github.io/helm-charts",
          }
        - { name: grafana, url: "https://grafana.github.io/helm-charts" }
      register: helm_repo
      changed_when: "'has been added' in helm_repo.stdout"
      failed_when: helm_repo.rc != 0 and 'already exists' not in helm_repo.stderr

    - name: Update Helm repos
      command: helm repo update
      changed_when: false

    - name: Copy values files
      copy:
        src: "files/monitoring/{{ item }}"
        dest: "/tmp/{{ item }}"
        mode: "0644"
      loop:
        - prometheus.values.yaml
        - loki.values.yaml
        - promtail.values.yaml

    - name: Template Grafana values
      template:
        src: "files/monitoring/grafana.values.yaml.j2"
        dest: "/tmp/grafana.values.yaml"
        mode: "0644"
      no_log: true

    - name: Template Alertmanager config
      template:
        src: "files/monitoring/alertmanager.config.yaml.j2"
        dest: "/tmp/alertmanager.config.yaml"
        mode: "0644"
      no_log: true

    - name: Deploy Prometheus
      command: >
        helm upgrade --install prometheus
        prometheus-community/prometheus
        --namespace kube-extra
        --values /tmp/prometheus.values.yaml
        --values /tmp/alertmanager.config.yaml
        --version 28.14.1
        --wait --timeout 5m

    - name: Deploy Loki
      command: >
        helm upgrade --install loki
        grafana/loki
        --namespace kube-extra
        --values /tmp/loki.values.yaml
        --version 6.55.0
        --wait --timeout 5m

    - name: Deploy Promtail
      command: >
        helm upgrade --install promtail
        grafana/promtail
        --namespace kube-extra
        --values /tmp/promtail.values.yaml
        --version 6.17.1
        --wait --timeout 5m

    - name: Deploy Grafana
      command: >
        helm upgrade --install grafana
        grafana/grafana
        --namespace kube-extra
        --values /tmp/grafana.values.yaml
        --version 10.5.15
        --wait --timeout 5m

    - name: Clean up values files
      file:
        path: "/tmp/{{ item }}"
        state: absent
      loop:
        - prometheus.values.yaml
        - alertmanager.config.yaml
        - loki.values.yaml
        - promtail.values.yaml
        - grafana.values.yaml
