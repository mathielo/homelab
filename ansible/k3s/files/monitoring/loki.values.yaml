deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 30d
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    compaction_interval: 10m
    retention_delete_delay: 2h

# Disable gateway — access Loki directly at loki:3100
gateway:
  enabled: false

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 200m
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi

# Right-size memcached caches for single-node homelab.
# Chart defaults (500m CPU / 9.6Gi mem) are for production clusters.
chunksCache:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi

resultsCache:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi

# Disable microservices-mode components
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
