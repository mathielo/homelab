# cert-manager Helm values.
# CRDs are installed via --set installCRDs=true at the CLI level (not here),
# which avoids the Helm upgrade-then-delete-CRD footgun.

resources:
  requests:
    cpu: 10m
    memory: 96Mi
  limits:
    cpu: 200m
    memory: 192Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
