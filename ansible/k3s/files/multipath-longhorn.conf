# Managed by ansible/k3s/longhorn.yaml.
# Prevents multipathd from wrapping Longhorn iSCSI LUNs (IET,VIRTUAL-DISK) as
# mpath devices, which breaks CSI mkfs on /dev/longhorn/pvc-*.
# Reference: https://longhorn.io/kb/troubleshooting-volume-with-multipath/

defaults {
    user_friendly_names yes
    find_multipaths     yes
}

blacklist {
    device {
        vendor  "IET"
        product "VIRTUAL-DISK"
    }
}
