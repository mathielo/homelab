defaultSettings:
  defaultDataPath: /mnt/nvme/longhorn
  defaultDataLocality: best-effort
  defaultReplicaCount: 2
  storageOverProvisioningPercentage: 100
  storageMinimalAvailablePercentage: 10
  replicaSoftAntiAffinity: false # strict anti-affinity (a volume's 2 replicas never share a node; 3 nodes available)
  allowVolumeCreationWithDegradedAvailability: true
  guaranteedInstanceManagerCPU: 12
  # The backup target needs to specify:
  # - vers=3 (NFS version 3)
  # - nolock (disable kernel-level locking)
  # - retrans=5 (a soft mount returns EIO once timeo x retrans elapses; the largest
  #   volumes write enough blocks to hit the default under NAS write pressure)
  # The other options are the defaults from Longhorn that get overwritten by the nfsOptions query string
  # See https://oneuptime.com/blog/post/2026-03-20-configure-longhorn-backup-target-nfs/view
  backupTarget: "nfs://10.10.50.4:/var/nfs/shared/k3s?nfsOptions=vers=3,nolock,actimeo=1,soft,timeo=300,retry=2,retrans=5"

persistence:
  defaultClass: true
  defaultClassReplicaCount: 2
  reclaimPolicy: Delete

longhornManager:
  priorityClass: system-node-critical

ingress:
  enabled: true
  ingressClassName: nginx
  host: lh.m6o.dev
  tls: true
  tlsSecret: longhorn-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
