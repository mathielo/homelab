---
# Installs ArgoCD (with helm-secrets plugin) and creates bootstrap secrets.
#
# Prerequisites:
#   - Add the following to ansible/k3s/argocd.sops.yaml (sops --decrypt to edit):
#       argocd_admin_password_hash:      "<bcrypt hash — generate with: htpasswd -nbBC 10 '' 'password' | tr -d ':\n' | sed 's/$2y/$2a/'>"
#       github_ssh_private_key:          "<private key of a read-only GitHub deploy key for this repo>"
#         Generate: ssh-keygen -t ed25519 -C "argocd@k3s" -f ~/.ssh/argocd_deploy_key
#         Then add the public key at: GitHub repo → Settings → Deploy keys → Add (read-only)
#       sops_age_private_key:            "<age secret key from ~/.config/sops/age/keys.txt>"
#
#   - App-level secrets (VPN, API keys, etc.) live in per-app values.sops.yaml files
#     under k3s/apps/. ArgoCD decrypts them at sync time via the helm-secrets plugin.
#
# After running this playbook, bootstrap ArgoCD by running from your workstation:
#   kubectl apply -f k3s/argocd/root-app.yaml

- name: Deploy ArgoCD and prepare namespace secrets
  hosts: k3s_server
  become: true
  environment:
    KUBECONFIG: /etc/k3s/k3s.yaml

  tasks:
    - name: Load ArgoCD secrets
      community.sops.load_vars:
        file: argocd.sops.yaml
      no_log: true

    - name: Add argo Helm repo
      command: helm repo add argo https://argoproj.github.io/argo-helm
      register: helm_repo
      changed_when: "'has been added' in helm_repo.stdout"
      failed_when: helm_repo.rc != 0 and 'already exists' not in helm_repo.stderr

    - name: Update Helm repos
      command: helm repo update
      changed_when: false

    - name: Ensure argocd namespace exists
      shell: kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false

    - name: Create helm-secrets age key for ArgoCD repo-server
      # Must exist before helm upgrade — the repo-server pod mounts this Secret.
      shell: |
        kubectl create secret generic helm-secrets-private-keys \
          --namespace argocd \
          --from-literal=key.txt='{{ sops_age_private_key }}' \
          --dry-run=client -o yaml | kubectl apply -f -
      no_log: true
      changed_when: false

    - name: Template ArgoCD values file
      template:
        src: files/argocd.values.yaml.j2
        dest: /tmp/argocd.values.yaml
        mode: "0600"

    - name: Deploy ArgoCD
      command: >
        helm upgrade --install argocd argo/argo-cd
        --namespace argocd
        --create-namespace
        --values /tmp/argocd.values.yaml
        --version 10.0.1
        --wait --timeout 10m

    - name: Clean up ArgoCD values file
      file:
        path: /tmp/argocd.values.yaml
        state: absent

    - name: Template ArgoCD repo secret
      # no_log + mode 0600 keep the private key off disk safely.
      template:
        src: files/argocd-repo.secret.yaml.j2
        dest: /tmp/argocd-repo.secret.yaml
        mode: "0600"
      no_log: true

    - name: Register GitHub repo credentials with ArgoCD
      # ArgoCD discovers repository secrets by the argocd.argoproj.io/secret-type label.
      command: kubectl apply -f /tmp/argocd-repo.secret.yaml
      changed_when: false

    - name: Clean up ArgoCD repo secret file
      file:
        path: /tmp/argocd-repo.secret.yaml
        state: absent

    # Namespace creation is handled by ArgoCD (CreateNamespace=true in sync options).
    # App-level secrets are in per-app values.sops.yaml files, decrypted by helm-secrets.
