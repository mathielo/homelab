---
# Play 1 — Install k3s server (control plane)
- name: Install k3s server
  hosts: k3s_server
  become: true
  environment:
    KUBECONFIG: /etc/k3s/k3s.yaml

  handlers:
    - name: Apply sysctl settings
      command: sysctl --system

  tasks:
    - name: Disable IPv6 at node level (required for Gluetun VPN sidecar)
      copy:
        dest: /etc/sysctl.d/99-disable-ipv6.conf
        content: |
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
        mode: "0644"
      notify: Apply sysctl settings

    - name: Install NFS client (required for NFS PersistentVolumes)
      apt:
        name: nfs-common
        state: present

    - name: Write clean resolv.conf for CoreDNS (bypass Tailscale MagicDNS)
      copy:
        src: files/k3s-resolv.conf
        dest: /etc/k3s/resolv.conf
        mode: "0644"

    - name: Install k3s server using official install script
      shell:
        cmd: >
          curl -sfL https://get.k3s.io |
          INSTALL_K3S_EXEC="--disable=traefik
          --disable=servicelb
          --data-dir=/var/lib/k3s
          --write-kubeconfig=/etc/k3s/k3s.yaml
          --write-kubeconfig-mode=0640
          --tls-san={{ ansible_host }}
          --node-ip={{ ansible_host }}
          --resolv-conf=/etc/k3s/resolv.conf" sh -
        creates: /usr/local/bin/k3s

    - name: Wait for k3s to be ready
      command: k3s kubectl get nodes
      register: k3s_ready
      retries: 10
      delay: 5
      until: k3s_ready.rc == 0
      changed_when: false

    - name: Copy CoreDNS custom config
      copy:
        src: files/coredns-custom.yaml
        dest: /tmp/coredns-custom.yaml
        mode: "0644"

    - name: Apply CoreDNS customizations (log + autopath)
      command: k3s kubectl apply -f /tmp/coredns-custom.yaml

    - name: Clean up CoreDNS custom config file
      file:
        path: /tmp/coredns-custom.yaml
        state: absent

    - name: Read k3s join token
      slurp:
        src: /var/lib/k3s/server/node-token
      register: k3s_token_raw

    - name: Set k3s join token fact
      set_fact:
        k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"

    - name: Install Helm
      shell:
        cmd: curl -sfL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        creates: /usr/local/bin/helm

    - name: Create namespaces
      command: k3s kubectl create namespace {{ item }}
      loop:
        - kube-extra
      register: ns_create
      changed_when: ns_create.rc == 0
      failed_when: ns_create.rc != 0 and 'already exists' not in ns_create.stderr

    - name: Add ingress-nginx Helm repo
      command: helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
      register: helm_repo
      changed_when: "'has been added' in helm_repo.stdout"
      failed_when: helm_repo.rc != 0 and 'already exists' not in helm_repo.stderr

    - name: Update Helm repos
      command: helm repo update
      changed_when: false

    - name: Copy ingress-nginx values file
      copy:
        src: files/ingress.values.yaml
        dest: /tmp/ingress.values.yaml
        mode: "0644"

    - name: Deploy ingress-nginx
      command: >
        helm upgrade --install ingress-nginx
        ingress-nginx/ingress-nginx
        --namespace kube-extra
        --values /tmp/ingress.values.yaml
        --version 4.15.1
        --wait --timeout 5m

    - name: Clean up ingress values file
      file:
        path: /tmp/ingress.values.yaml
        state: absent

    - name: Read kubeconfig from server
      slurp:
        src: /etc/k3s/k3s.yaml
      register: kubeconfig_raw

    - name: Ensure local ~/.kube directory exists
      become: false
      delegate_to: localhost
      file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: "0700"

    - name: Write kubeconfig to local machine
      become: false
      delegate_to: localhost
      copy:
        content: "{{ kubeconfig_raw.content | b64decode | regex_replace('127.0.0.1', ansible_host) }}"
        dest: "{{ lookup('env', 'HOME') }}/.kube/config-k3s"
        mode: "0600"

    - name: Remind user to set KUBECONFIG
      debug:
        msg: >-
          Kubeconfig written to ~/.kube/config-k3s.
          Export it with: export KUBECONFIG=~/.kube/config-k3s

# Play 2 — Install k3s agents
- name: Install k3s agents
  hosts: k3s_agents
  become: true

  handlers:
    - name: Apply sysctl settings
      command: sysctl --system

  tasks:
    - name: Disable IPv6 at node level (required for Gluetun VPN sidecar)
      copy:
        dest: /etc/sysctl.d/99-disable-ipv6.conf
        content: |
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
        mode: "0644"
      notify: Apply sysctl settings

    - name: Install NFS client (required for NFS PersistentVolumes)
      apt:
        name: nfs-common
        state: present

    - name: Write clean resolv.conf for kubelet (bypass Tailscale MagicDNS)
      copy:
        src: files/k3s-resolv.conf
        dest: /etc/k3s/resolv.conf
        mode: "0644"

    - name: Install k3s agent using official install script
      shell:
        cmd: >
          curl -sfL https://get.k3s.io |
          K3S_URL=https://{{ hostvars[groups['k3s_server'][0]]['ansible_host'] }}:6443
          K3S_TOKEN={{ hostvars[groups['k3s_server'][0]]['k3s_token'] }}
          INSTALL_K3S_EXEC="--data-dir=/var/lib/k3s
          --node-ip={{ ansible_host }}
          --resolv-conf=/etc/k3s/resolv.conf" sh -
        creates: /usr/local/bin/k3s-agent
      no_log: true

    - name: Wait for agent to join cluster
      command: >
        k3s kubectl get node {{ inventory_hostname }}
      delegate_to: "{{ groups['k3s_server'][0] }}"
      become: true
      environment:
        KUBECONFIG: /etc/k3s/k3s.yaml
      register: agent_ready
      retries: 10
      delay: 5
      until: agent_ready.rc == 0
      changed_when: false

# Play 3 — Label all k3s nodes
- name: Label k3s nodes
  hosts: k3s_server
  become: true
  environment:
    KUBECONFIG: /etc/k3s/k3s.yaml

  vars:
    k3s_node_labels:
      - node: k3s-server
        labels:
          - workload=infra
      - node: k3s-node-01
        labels:
          - workload=media

  tasks:
    - name: Apply node labels
      command: >
        k3s kubectl label node {{ item.node }}
        {% for label in item.labels %}{{ label }} {% endfor %}
        --overwrite
      loop: "{{ k3s_node_labels }}"
      changed_when: false
