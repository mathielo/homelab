---
# Reinstalling a node with the same hostname requires clearing the stale node-password
# trust on BOTH sides before running this playbook, otherwise the agent gets
# stuck in: "Node password rejected, duplicate hostname or contents of
# /etc/rancher/node/password may not match server node-passwd entry".
#
#   # On the agent host (after a fresh OS install, this is usually already gone):
#   sudo systemctl stop k3s-agent 2>/dev/null
#   sudo rm -f /etc/rancher/node/password
#
#   # From your workstation (or the server):
#   kubectl delete node <hostname> --ignore-not-found
#   kubectl delete secret -n kube-system <hostname>.node-password.k3s --ignore-not-found
#
# `kubectl delete node` alone is unreliable — a k3s controller eventually
# cleans up the password secret, but it races with the agent's retry loop.
# Deleting the secret explicitly avoids the race.

# Play 1 — Host prep (server + agents)
# Sysctl, packages, and resolv.conf are identical on every k3s node, so we
# do them once across both groups instead of duplicating per play.
- name: Prepare k3s hosts
  hosts: k3s_server:k3s_agents
  become: true

  handlers:
    - name: Apply sysctl settings
      command: sysctl --system

  tasks:
    - name: Disable IPv6 at node level (required for Gluetun VPN sidecar)
      copy:
        dest: /etc/sysctl.d/99-disable-ipv6.conf
        content: |
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
        mode: "0644"
      notify: Apply sysctl settings

    - name: Tune inotify limits for Kubernetes workloads
      copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        content: |
          fs.inotify.max_user_instances = 512
          fs.inotify.max_user_watches = 524288
        mode: "0644"
      notify: Apply sysctl settings

    - name: Bound dirty page-cache so a slow NFS target can't stall every writer on the node
      # With default vm.dirty_ratio the kernel buffers multiple GB of un-flushed writes headed
      # for the NAS, then hard-throttles ALL writers node-wide (the global limit is not per-fs),
      # so download clients moving completed files **freeze every co-located pod**.
      #
      # dirty_background_bytes = 64MiB
      # dirty_bytes = 256MiB
      copy:
        dest: /etc/sysctl.d/99-nfs-writeback.conf
        content: |
          vm.dirty_background_bytes = 67108864
          vm.dirty_bytes = 268435456
          vm.dirty_writeback_centisecs = 500
        mode: "0644"
      notify: Apply sysctl settings

    - name: Install NFS client (required for NFS PersistentVolumes)
      apt:
        name: nfs-common
        state: present

    - name: Install open-iscsi (required for Longhorn block storage)
      apt:
        name: open-iscsi
        state: present

    - name: Ensure iscsid is enabled and running
      systemd:
        name: iscsid
        enabled: true
        state: started

    - name: Ensure /etc/k3s exists
      file:
        path: /etc/k3s
        state: directory
        mode: "0755"

    - name: Write clean resolv.conf for k3s (bypass Tailscale MagicDNS)
      copy:
        src: files/k3s-resolv.conf
        dest: /etc/k3s/resolv.conf
        mode: "0644"

# Play 2 — Install k3s server (control plane)
- name: Install k3s server
  hosts: k3s_server
  become: true
  environment:
    KUBECONFIG: /etc/k3s/k3s.yaml

  tasks:
    - name: Check installed k3s version
      command: /usr/local/bin/k3s --version
      register: k3s_installed
      failed_when: false
      changed_when: false

    - name: Install or upgrade k3s server using official install script
      shell:
        cmd: >
          curl -sfL https://get.k3s.io |
          INSTALL_K3S_VERSION="{{ k3s_version }}"
          INSTALL_K3S_EXEC="--disable=traefik
          --disable=servicelb
          --data-dir=/var/lib/k3s
          --write-kubeconfig=/etc/k3s/k3s.yaml
          --write-kubeconfig-mode=0640
          --tls-san={{ ansible_host }}
          --node-ip={{ ansible_host }}
          --resolv-conf=/etc/k3s/resolv.conf" sh -
      when: k3s_installed.rc != 0 or k3s_version not in (k3s_installed.stdout | default(''))

    - name: Wait for k3s to be ready
      command: k3s kubectl get nodes
      register: k3s_ready
      retries: 10
      delay: 5
      until: k3s_ready.rc == 0
      changed_when: false

    - name: Copy CoreDNS custom config
      copy:
        src: files/coredns-custom.yaml
        dest: /tmp/coredns-custom.yaml
        mode: "0644"

    - name: Apply CoreDNS customizations (log + autopath)
      command: k3s kubectl apply -f /tmp/coredns-custom.yaml

    - name: Clean up CoreDNS custom config file
      file:
        path: /tmp/coredns-custom.yaml
        state: absent

    - name: Read k3s join token
      slurp:
        src: /var/lib/k3s/server/node-token
      register: k3s_token_raw

    - name: Set k3s join token fact
      set_fact:
        k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"

    - name: Install Helm
      shell:
        cmd: curl -sfL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        creates: /usr/local/bin/helm

    - name: Create namespaces
      command: k3s kubectl create namespace {{ item }}
      loop:
        - kube-extra
      register: ns_create
      changed_when: ns_create.rc == 0
      failed_when: ns_create.rc != 0 and 'already exists' not in ns_create.stderr

    - name: Add ingress-nginx Helm repo
      command: helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
      register: helm_repo
      changed_when: "'has been added' in helm_repo.stdout"
      failed_when: helm_repo.rc != 0 and 'already exists' not in helm_repo.stderr

    - name: Update Helm repos
      command: helm repo update
      changed_when: false

    - name: Copy ingress-nginx values file
      copy:
        src: files/ingress.values.yaml
        dest: /tmp/ingress.values.yaml
        mode: "0644"

    - name: Deploy ingress-nginx
      command: >
        helm upgrade --install ingress-nginx
        ingress-nginx/ingress-nginx
        --namespace kube-extra
        --values /tmp/ingress.values.yaml
        --version 4.15.1
        --timeout 5m

    - name: Clean up ingress values file
      file:
        path: /tmp/ingress.values.yaml
        state: absent

    - name: Read kubeconfig from server
      slurp:
        src: /etc/k3s/k3s.yaml
      register: kubeconfig_raw

    - name: Ensure local ~/.kube directory exists
      become: false
      delegate_to: localhost
      file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: "0700"

    - name: Write kubeconfig to local machine
      become: false
      delegate_to: localhost
      copy:
        content: "{{ kubeconfig_raw.content | b64decode | regex_replace('127.0.0.1', ansible_host) }}"
        dest: "{{ lookup('env', 'HOME') }}/.kube/config-k3s"
        mode: "0600"

    - name: Remind user to set KUBECONFIG
      debug:
        msg: >-
          Kubeconfig written to ~/.kube/config-k3s.
          Export it with: export KUBECONFIG=~/.kube/config-k3s

# Play 3 — Install k3s agents
- name: Install k3s agents
  hosts: k3s_agents
  become: true

  tasks:
    - name: Check installed k3s agent version
      command: /usr/local/bin/k3s --version
      register: k3s_installed
      failed_when: false
      changed_when: false

    - name: Install or upgrade k3s agent using official install script
      shell:
        cmd: >
          curl -sfL https://get.k3s.io |
          INSTALL_K3S_VERSION="{{ k3s_version }}"
          K3S_URL=https://{{ hostvars[groups['k3s_server'][0]]['ansible_host'] }}:6443
          K3S_TOKEN={{ hostvars[groups['k3s_server'][0]]['k3s_token'] }}
          INSTALL_K3S_EXEC="--data-dir=/var/lib/k3s
          --node-ip={{ ansible_host }}
          --resolv-conf=/etc/k3s/resolv.conf" sh -
      when: k3s_installed.rc != 0 or k3s_version not in (k3s_installed.stdout | default(''))
      no_log: true

    - name: Wait for agent to join cluster
      command: >
        k3s kubectl get node {{ inventory_hostname }}
      delegate_to: "{{ groups['k3s_server'][0] }}"
      become: true
      environment:
        KUBECONFIG: /etc/k3s/k3s.yaml
      register: agent_ready
      retries: 10
      delay: 5
      until: agent_ready.rc == 0
      changed_when: false

# Play 4 — Configure kubelet (graceful node shutdown)
# Runs on every node after k3s is installed. The KubeletConfiguration drop-in
# replaces the deprecated --kubelet-arg=shutdown-grace-period* CLI flags
# (removed from kubelet in k8s 1.35). k3s reads any *.conf in this directory
# and merges it with its own defaults.
- name: Configure kubelet
  hosts: k3s_server:k3s_agents
  become: true

  handlers:
    - name: Restart k3s
      systemd:
        name: "{{ 'k3s' if inventory_hostname in groups['k3s_server'] else 'k3s-agent' }}"
        state: restarted

  tasks:
    - name: Drop graceful-shutdown KubeletConfiguration
      copy:
        dest: /var/lib/k3s/agent/etc/kubelet.conf.d/90-shutdown.conf
        mode: "0600"
        content: |
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          shutdownGracePeriod: 60s
          shutdownGracePeriodCriticalPods: 10s
      notify: Restart k3s

# Play 5 — Label all k3s nodes
- name: Label k3s nodes
  hosts: k3s_server
  become: true
  environment:
    KUBECONFIG: /etc/k3s/k3s.yaml

  vars:
    k3s_node_labels:
      - node: k3s-server
        labels:
          - workload=infra
          - amd.com/gpu=true
      - node: k3s-node-01
        labels:
          - workload=media
      - node: k3s-node-02
        labels:
          - workload=media

  tasks:
    - name: Apply node labels
      command: >
        k3s kubectl label node {{ item.node }}
        {% for label in item.labels %}{{ label }} {% endfor %}
        --overwrite
      loop: "{{ k3s_node_labels }}"
      changed_when: false
