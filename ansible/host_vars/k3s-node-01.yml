# Realtek r8169, 4 CPUs.
# Mask is 0xe (CPU1-3), deliberately excluding CPU0. IRQ 53 is bound to CPU0 and
# RPS steers a flow to a single CPU chosen by its hash — with only 4 cores, an
# all-CPU mask would leave a 1-in-4 chance of landing the tunnel's protocol
# processing right back on the core already doing NAPI, for no gain.
nic_device: enp1s0f0
nic_rps_cpus: e

# Reboot slot — 40 min behind k3s-server. A node reboot takes ~2.5 min; the rest
# of the gap is Longhorn replica rebuild headroom, so this node is whole again
# before node-02 leaves.
unattended_reboot_time: "04:40"
