---
# RAID 0 over the Cenmate 802U3-5G DAS on k3s-node-02.
# 2×24 TB HDDs → ~43.7 TiB at /mnt/r0.
#
# Drive swaps: see docs/das-drive-swap.md.
#
# Play 1 (destructive): creates the array. Idempotent — if /dev/md0 already
# exists the play short-circuits. Asks for GOAHEAD after printing the
# target disks.
# Play 2: chown + place the strict-mount marker + install das-up/das-down +
# export the array to the workstation over NFS. Safe to re-run on its own.
#
# Invoke:
#   ansible-playbook -i ansible/inventory.ini ansible/das-raid.yaml
#
# The NFS export tasks carry the "nfs" tag, so they can be applied on their own
# without entering the create play at all:
#   ansible-playbook -i ansible/inventory.ini ansible/das-raid.yaml --tags nfs

- name: Create RAID 0 on the DAS attached to k3s-node-02
  hosts: k3s-node-02
  become: true
  gather_facts: false

  vars:
    md_device: /dev/md0
    mount_point: /mnt/r0
    fs_label: r0
    # Override via -e if a disk is replaced (by-id suffix = USB-bridge serial).
    das_devices:
      - /dev/disk/by-id/usb-ASMT_2115_ACAAEBBB46E8-0:0
      - /dev/disk/by-id/usb-ASMT_2115_ACAAEBBB46E7-0:0

  pre_tasks:
    - name: Check whether the RAID array already exists
      command: mdadm --detail {{ md_device }}
      register: md_state
      changed_when: false
      failed_when: false

    - name: Report no-op if array is already assembled
      debug:
        msg: "{{ md_device }} already exists — skipping create play."
      when: md_state.rc == 0

    - name: End play early if array is already assembled
      meta: end_play
      when: md_state.rc == 0

    - name: Stat each target device
      stat:
        path: "{{ item }}"
      register: device_stats
      loop: "{{ das_devices }}"

    - name: Assert each target device exists
      assert:
        that: item.stat.exists
        fail_msg: "Target device {{ item.item }} not found"
      loop: "{{ device_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Show target devices
      command: lsblk -no NAME,SIZE,MODEL,SERIAL {{ das_devices | join(' ') }}
      register: target_lsblk
      changed_when: false

    - name: Print target devices for the operator to eyeball
      debug:
        var: target_lsblk.stdout_lines

    - name: Refuse if any target device has a mounted partition
      shell: |
        for d in {{ das_devices | join(' ') }}; do
          mounted=$(lsblk -no MOUNTPOINT "$d" | grep -v '^$' || true)
          if [ -n "$mounted" ]; then
            echo "Device $d has mounted partitions: $mounted" >&2
            exit 1
          fi
        done
      changed_when: false

    - name: Confirm wipe of the displayed devices
      pause:
        prompt: |
          Verified target devices above. This will WIPE them and create {{ md_device }}.
          Type GOAHEAD to proceed
      register: confirm

    - name: Require explicit GOAHEAD confirmation
      assert:
        that: confirm.user_input == "GOAHEAD"
        fail_msg: Confirmation not given. Aborting.

  tasks:
    - name: Install mdadm
      apt:
        name: mdadm
        state: present

    - name: Wipe existing filesystem/RAID signatures
      command: wipefs -a {{ item }}
      loop: "{{ das_devices }}"

    - name: Create the RAID 0 array
      command: >
        mdadm --create --verbose {{ md_device }}
        --level=0
        --raid-devices={{ das_devices | length }}
        --metadata=1.2
        --run
        {{ das_devices | join(' ') }}
      args:
        creates: "{{ md_device }}"

    # -m 0: no root reserve — nothing on this array is system-critical, and 5%
    # of a multi-TiB scratch is a large amount of dead space.
    # -T largefile4: 1 inode per 4 MiB. The default ratio sizes inode tables for
    # hundreds of millions of files; this array holds large media files.
    - name: Create ext4 filesystem on the array
      filesystem:
        fstype: ext4
        dev: "{{ md_device }}"
        opts: -L {{ fs_label }} -m 0 -T largefile4

    - name: Capture mdadm scan output
      command: mdadm --detail --scan
      register: mdadm_scan
      changed_when: false

    - name: Persist array definition in /etc/mdadm/mdadm.conf
      blockinfile:
        path: /etc/mdadm/mdadm.conf
        marker: "# {mark} ANSIBLE-MANAGED DAS-RAID"
        block: "{{ mdadm_scan.stdout }}"
      notify: Update initramfs

    - name: Read filesystem UUID
      command: blkid -s UUID -o value {{ md_device }}
      register: md_uuid
      changed_when: false

    - name: Create mount point
      file:
        path: "{{ mount_point }}"
        state: directory
        mode: "0755"

    # nofail: don't block boot if the DAS is unplugged.
    - name: Add fstab entry and mount
      mount:
        path: "{{ mount_point }}"
        src: "UUID={{ md_uuid.stdout }}"
        fstype: ext4
        opts: defaults,nofail,x-systemd.device-timeout=30s
        state: mounted

  handlers:
    - name: Update initramfs
      command: update-initramfs -u

# Post-mount provisioning + maintenance scripts. Safe to re-run on its own.
- name: DAS post-mount provisioning + maintenance scripts
  hosts: k3s-node-02
  become: true
  gather_facts: false

  vars:
    md_device: /dev/md0
    mount_point: /mnt/r0
    # Workstation's tagged VLAN 50 address (ansible/host_vars/spacedora.yml).
    # NFS authorises by source IP, so the export is scoped to that single host —
    # VLAN 50 also carries the other k3s nodes and the NAS.
    nfs_export_client: 10.10.50.180

  tasks:
    # Guard: skip on-DAS writes if the DAS is unmounted — otherwise the
    # marker/chown would land on the bare rootfs at /mnt/r0.
    - name: Check that /mnt/r0 is a live mountpoint
      command: mountpoint -q {{ mount_point }}
      register: r0_mountpoint
      changed_when: false
      failed_when: false

    # mkfs.ext4 leaves the FS root as root:root; qBt runs as 1000:1000.
    - name: Chown the DAS root for qbt write access
      file:
        path: "{{ mount_point }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0775"
      when: r0_mountpoint.rc == 0

    # Strict-mount marker. Consumed by the qbt chart as a hostPath File
    # (startup safety) and by its liveness probe (runtime safety).
    - name: Place DAS-mounted marker
      copy:
        dest: "{{ mount_point }}/.r0-mounted"
        content: DAS-mounted marker for hostPath consumers.
        mode: "0644"
        owner: "1000"
        group: "1000"
      when: r0_mountpoint.rc == 0

    # Both scripts are re-runnable: they are operator commands invoked during a
    # power cycle, often after a partial manual step, so each acts only on what
    # is not already in the wanted state. Without that, `mdadm --assemble` on an
    # assembled array (or `umount` on an unmounted path) exits non-zero, `set -e`
    # stops the script, and the remaining step never runs — while the failure
    # reads as "it broke" rather than "already done".
    - name: Install das-up
      copy:
        dest: /usr/local/sbin/das-up
        mode: "0755"
        content: |
          #!/bin/sh
          set -e
          if [ ! -b {{ md_device }} ]; then
            mdadm --assemble --scan
          fi
          if ! mountpoint -q {{ mount_point }}; then
            mount {{ mount_point }}
          fi
      tags: scripts

    # udevadm settle: umount triggers a udev change event whose blkid probe holds
    # the device open briefly. Without the wait, mdadm --stop races it and fails
    # with "Cannot get exclusive access".
    - name: Install das-down
      copy:
        dest: /usr/local/sbin/das-down
        mode: "0755"
        content: |
          #!/bin/sh
          set -e
          if mountpoint -q {{ mount_point }}; then
            umount {{ mount_point }}
          fi
          udevadm settle
          if [ -b {{ md_device }} ]; then
            mdadm --stop {{ md_device }}
          fi
      tags: scripts

    - name: Install nfs-kernel-server
      apt:
        name: nfs-kernel-server
        state: present
      tags: nfs

    # mp: export only while {{ mount_point }} is a live mountpoint. The fstab
    # entry is nofail and das-down takes the array away deliberately, so without
    # this the empty mount point on the rootfs would be exported in its place.
    - name: Export the array to the workstation
      lineinfile:
        path: /etc/exports
        regexp: ^{{ mount_point }}\s
        line: "{{ mount_point }} {{ nfs_export_client }}(rw,sync,mp,no_subtree_check)"
        create: true
        mode: "0644"
      notify: Reload NFS exports
      tags: nfs

  handlers:
    # Tagged to match: handlers are filtered by --tags like any other task.
    - name: Reload NFS exports
      command: exportfs -ra
      tags: nfs
