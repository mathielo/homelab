# Bootstrap new hosts with a passwordless SSH key and sudo access
#
# Troubleshooting "Timeout waiting for privilege escalation prompt"
# Ubuntu Server 26.04 ships with `sudo-rs` alternative to `sudo`. For the playbook to work,
# the alternative must be set to the default `sudo`:
#
#   ssh m8hl@<host-ip>
#   sudo update-alternatives --set sudo /usr/bin/sudo.ws
---
- name: Bootstrap host
  hosts: all
  become: true
  vars:
    ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBIY4u7RdDHfGYM/f+yjXbz4KUq3kfI4sAwC+f4JHLA8"

    # Fleet-wide constants only. Anything a host overrides in host_vars must NOT
    # be defaulted here — play vars outrank host_vars, so the default would win
    # everywhere and the override would silently do nothing.
    system_timezone: Europe/Stockholm

  tasks:
    - name: Ensure {{ ansible_user }} has passwordless sudo
      copy:
        dest: /etc/sudoers.d/{{ ansible_user }}
        content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Ensure .ssh directory exists
      file:
        path: /home/{{ ansible_user }}/.ssh
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Set authorized SSH key
      authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ ssh_public_key }}"
        state: present
        exclusive: true

    - name: Disable password authentication in sshd
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?\\s*PasswordAuthentication"
        line: "PasswordAuthentication no"
      notify: Restart sshd

    - name: Find sshd drop-in configs
      find:
        paths: /etc/ssh/sshd_config.d
        patterns: "*.conf"
      register: sshd_dropin_configs

    - name: Disable password authentication in sshd drop-in configs
      lineinfile:
        path: "{{ item.path }}"
        regexp: "^#?\\s*PasswordAuthentication"
        line: "PasswordAuthentication no"
      loop: "{{ sshd_dropin_configs.files }}"
      notify: Restart sshd

    # Ordered before the unattended-upgrades config: Automatic-Reboot-Time is
    # wall-clock local, so a reboot slot only means what it says once the zone
    # is right.
    - name: Set system timezone
      community.general.timezone:
        name: "{{ system_timezone }}"

    - name: Install unattended-upgrades
      apt:
        name:
          - unattended-upgrades
          - apt-listchanges
        state: present
        update_cache: true

    - name: Configure automatic update triggers (20auto-upgrades)
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
        mode: "0644"

    # Automatic reboots are opt-in: a host gets them only by defining
    # `unattended_reboot_time` in host_vars, and each opted-in host reboots in
    # its own slot. Two hosts sharing a slot reboot in the same second, which for
    # the Pi-holes takes DNS down network-wide.
    #
    # The k3s nodes deliberately define no slot. An unattended reboot severs
    # their Longhorn iSCSI sessions mid-write with no cordon, no scale-down and
    # no wait-for-detach, which corrupts the ext4 on the attached volumes
    # (docs/storage-longhorn.md). Security updates still install unattended
    # there; the reboot waits for `scripts/rack/shutdown`, which quiesces
    # Longhorn first. `/var/run/reboot-required` marks a node that is due, and
    # `/cluster-health` reports it.
    - name: Configure unattended-upgrades (50unattended-upgrades)
      copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        mode: "0644"
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}-security";
              "${distro_id}ESMApps:${distro_codename}-apps-security";
              "${distro_id}ESM:${distro_codename}-infra-security";
          };
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "{{ 'true' if unattended_reboot_time is defined else 'false' }}";
          Unattended-Upgrade::Automatic-Reboot-Time "{{ unattended_reboot_time | default('03:00') }}";
          Unattended-Upgrade::Automatic-Reboot-WithUsers "false";

    - name: Enable and start unattended-upgrades service
      systemd:
        name: unattended-upgrades
        enabled: true
        state: started

  handlers:
    - name: Restart sshd
      systemd:
        name: ssh
        state: restarted
