---
- name: Bootstrap host
  hosts: all
  become: true
  vars:
    ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBIY4u7RdDHfGYM/f+yjXbz4KUq3kfI4sAwC+f4JHLA8"

  tasks:
    - name: Ensure {{ ansible_user }} has passwordless sudo
      copy:
        dest: /etc/sudoers.d/{{ ansible_user }}
        content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Ensure .ssh directory exists
      file:
        path: /home/{{ ansible_user }}/.ssh
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Set authorized SSH key
      authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ ssh_public_key }}"
        state: present
        exclusive: true

    - name: Disable password authentication in sshd
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?\\s*PasswordAuthentication"
        line: "PasswordAuthentication no"
      notify: Restart sshd

    - name: Find sshd drop-in configs
      find:
        paths: /etc/ssh/sshd_config.d
        patterns: "*.conf"
      register: sshd_dropin_configs

    - name: Disable password authentication in sshd drop-in configs
      lineinfile:
        path: "{{ item.path }}"
        regexp: "^#?\\s*PasswordAuthentication"
        line: "PasswordAuthentication no"
      loop: "{{ sshd_dropin_configs.files }}"
      notify: Restart sshd

    - name: Install unattended-upgrades
      apt:
        name:
          - unattended-upgrades
          - apt-listchanges
        state: present
        update_cache: true

    - name: Configure automatic update triggers (20auto-upgrades)
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
        mode: "0644"

    - name: Configure unattended-upgrades (50unattended-upgrades)
      copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        mode: "0644"
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}-security";
              "${distro_id}ESMApps:${distro_codename}-apps-security";
              "${distro_id}ESM:${distro_codename}-infra-security";
          };
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "03:00";
          Unattended-Upgrade::Automatic-Reboot-WithUsers "false";

    - name: Enable and start unattended-upgrades service
      systemd:
        name: unattended-upgrades
        enabled: true
        state: started

  handlers:
    - name: Restart sshd
      systemd:
        name: ssh
        state: restarted
