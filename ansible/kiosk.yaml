---
# Provisions the DeskPi 7.84" rack touchscreen as an OS-level kiosk on headless
# Ubuntu Server (no DE): sway running Epiphany against the Grafana rack
# dashboard. Target host is the [kiosk] group in inventory.ini.
#
# The browser is sandboxed so a leak/crash can't disturb k3s on this node.
# Run from repo root:  ansible-playbook -i ansible/inventory.ini ansible/kiosk.yaml
- name: Rack touchscreen kiosk
  hosts: kiosk
  become: true
  vars:
    # The rack-kiosk dashboard is laid out for this panel's 1280x400; ?kiosk
    # strips Grafana's chrome so all 400px go to the panels. Anonymous Viewer
    # is enabled in the grafana chart so this loads without a login.
    kiosk_url: https://grafana.m6o.dev/d/rack-kiosk/rack-kiosk?kiosk&refresh=1m

    # Overnight blanking. kiosk_timezone is stamped on every OnCalendar so the
    # times are local wall-clock across DST regardless of the node's own zone.
    kiosk_timezone: Europe/Stockholm
    kiosk_wake_at: "06:00"
    kiosk_blank_hours: "22..23,00..05" # every hour of the off window — see the @off timer

  tasks:
    - name: Install kiosk packages
      apt:
        name:
          # Not cage: it aborts whenever an input device is present. See
          # docs/monitoring.md.
          - sway # Wayland compositor; sway.conf reduces it to a kiosk
          # A .deb, not the chromium package: that is a snap shim, which lands
          # outside systemd's PATH and can't keep a profile in /var/lib/kiosk.
          - epiphany-browser # the dashboard browser
          - seatd # seat management on a headless box
          - wlopm # wlroots output power (DPMS)
          - fonts-noto-color-emoji # tab/status icons in the UI
        state: present
        update_cache: true

    - name: Create unprivileged kiosk user
      user:
        name: kiosk
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/kiosk
        # No `seat`/`_seatd` group on Ubuntu — seatd ships its socket as
        # root:video (srwxrwx---), so `video` membership grants seat access.
        # (`seat` is the Arch/Alpine group name and doesn't exist here.)
        groups: video,render,input
        append: true

    # No autoremove: cage and sway share libwlroots-0.19 and libinput10.
    - name: Remove packages the kiosk no longer uses
      apt:
        name:
          - cage
          - swayidle
        state: absent
        purge: true

    - name: Create sway config directory
      file:
        path: /etc/kiosk
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy sway config
      copy:
        src: kiosk/files/sway.conf
        dest: /etc/kiosk/sway.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart kiosk

    - name: Create GTK config directory
      file:
        path: /var/lib/kiosk/.config/gtk-4.0
        state: directory
        owner: kiosk
        group: kiosk
        mode: "0755"

    - name: Deploy GTK stylesheet
      copy:
        src: kiosk/files/gtk.css
        dest: /var/lib/kiosk/.config/gtk-4.0/gtk.css
        owner: kiosk
        group: kiosk
        mode: "0644"
      notify: Restart kiosk

    - name: Deploy Epiphany schema override
      copy:
        src: kiosk/files/kiosk.gschema.override
        dest: /usr/share/glib-2.0/schemas/99-kiosk.gschema.override
        owner: root
        group: root
        mode: "0644"
      notify:
        - Recompile GSettings schemas
        - Restart kiosk

    - name: Enable and start seatd
      systemd:
        name: seatd
        enabled: true
        state: started

    - name: Deploy kiosk session script
      template:
        src: kiosk/files/kiosk-session.sh.j2
        dest: /usr/local/bin/kiosk-session
        owner: root
        group: root
        mode: "0755"
      notify: Restart kiosk

    - name: Deploy kiosk systemd unit
      template:
        src: kiosk/files/kiosk.service.j2
        dest: /etc/systemd/system/kiosk.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart kiosk

    - name: Enable and start kiosk
      systemd:
        name: kiosk
        enabled: true
        state: started
        daemon_reload: true

    - name: Deploy panel power script
      template:
        src: kiosk/files/kiosk-display.sh.j2
        dest: /usr/local/bin/kiosk-display
        owner: root
        group: root
        mode: "0755"

    - name: Deploy panel power unit and schedule
      template:
        src: "kiosk/files/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - kiosk-display@.service
        - kiosk-display@off.timer
        - kiosk-display@on.timer

    - name: Enable and start panel schedule
      systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - kiosk-display@off.timer
        - kiosk-display@on.timer

  handlers:
    # The override is inert until compiled into gschemas.compiled.
    - name: Recompile GSettings schemas
      command: glib-compile-schemas /usr/share/glib-2.0/schemas/

    - name: Restart kiosk
      systemd:
        name: kiosk
        state: restarted
        daemon_reload: true
