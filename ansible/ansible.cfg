[defaults]
inventory = inventory.ini
vars_plugins_enabled = host_group_vars,community.sops.sops
# Must stay True: community.sops.load_vars returns secrets through the *facts*
# channel on ansible-core < 2.21 (its `return_method: vars-only` needs 2.21+),
# and unlike include_vars those facts are not promoted to host variables. With
# False, `{{ pihole_password }}` & co. are undefined in every play that loads a
# sops file. Setting it explicitly (rather than leaving it defaulted) is also
# what silences the 2.24 deprecation warning.
inject_facts_as_vars = True
