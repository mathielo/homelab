---
# Host-level I/O tuning for k3s nodes.
#
# Applies three layers of tuning to prevent slow remote I/O (NFS to UNAS-4)
# from amplifying into system-wide stalls, and to deepen block-layer queues
# on the IOPS-limited Kingston SSD in k3s-node-01.
#
# See docs/storage-tuning.md for the full analysis and rationale.
#
# Run with:
#   ansible-playbook -i inventory.ini host-tuning.yaml

# Play 1 — All k3s nodes
- name: Apply node-wide I/O tuning
  hosts: k3s_nodes
  become: true

  handlers:
    - name: Apply sysctl settings
      command: sysctl --system

    - name: Reload udev rules
      command: udevadm control --reload-rules

    - name: Re-trigger udev for bdi subsystem
      command: udevadm trigger --subsystem-match=bdi

  tasks:
    - name: Install smartmontools (for SSD health visibility)
      apt:
        name: smartmontools
        state: present

    - name: Lower kernel dirty page thresholds
      copy:
        dest: /etc/sysctl.d/99-storage-tuning.conf
        mode: "0644"
        content: |
          # Tighten dirty-page budget so a slow backing device (e.g. NFS to
          # UNAS-4) cannot fill RAM with dirty pages and synchronously
          # throttle every other writer on the node.
          vm.dirty_background_ratio = 5
          vm.dirty_ratio = 15
      notify: Apply sysctl settings

    - name: Cap dirty-page share for virtual (NFS/FUSE) backing devices
      copy:
        dest: /etc/udev/rules.d/60-nfs-bdi-cap.rules
        mode: "0644"
        content: |
          # Major 0 = virtual BDIs (NFS, FUSE). Default max_ratio=100 lets
          # one slow remote mount monopolize the global dirty-page budget,
          # blocking unrelated local writers when its server stalls.
          SUBSYSTEM=="bdi", ACTION=="add|change", KERNEL=="0:*", ATTR{max_ratio}="30"
      notify:
        - Reload udev rules
        - Re-trigger udev for bdi subsystem

# Play 2 — k3s-node-01 only (Kingston OEM SSD)
- name: Apply k3s-node-01 storage tuning
  hosts: k3s-node-01
  become: true

  handlers:
    - name: Reload udev rules
      command: udevadm control --reload-rules

    - name: Re-trigger udev for sda
      command: udevadm trigger --action=change /sys/block/sda

    - name: Remount /mnt/ssd/longhorn
      command: mount -o remount /mnt/ssd/longhorn

    - name: Remount /mnt/ssd/local
      command: mount -o remount /mnt/ssd/local

  tasks:
    - name: Increase block-layer queue depth on Kingston SSD
      copy:
        dest: /etc/udev/rules.d/60-kingston-ssd-tuning.rules
        mode: "0644"
        content: |
          # Kingston OCP0S31 (DRAMless OEM SATA SSD) hosts both Longhorn
          # replicas (sda1) and qBt incomplete dir (sda2). Default
          # nr_requests=64 fills under multi-tenant write load — bump to
          # 256 so mq-deadline has more room to merge and reorder.
          ACTION=="add|change", SUBSYSTEM=="block", ENV{ID_MODEL}=="KINGSTON_OCP0S31", ATTR{queue/nr_requests}="256"
      notify:
        - Reload udev rules
        - Re-trigger udev for sda

    - name: Add noatime,commit=60 to /mnt/ssd/longhorn fstab entry
      lineinfile:
        path: /etc/fstab
        regexp: '^UUID=0d501a66-328f-403f-a30c-fed1fefd7e77\s'
        line: "UUID=0d501a66-328f-403f-a30c-fed1fefd7e77 /mnt/ssd/longhorn ext4 defaults,noatime,commit=60,nofail,x-systemd.device-timeout=10s 0 2"
      notify: Remount /mnt/ssd/longhorn

    - name: Add noatime,commit=60 to /mnt/ssd/local fstab entry
      lineinfile:
        path: /etc/fstab
        regexp: '^UUID=3bc6113d-3505-4af5-90f6-ea803a1e7a72\s'
        line: "UUID=3bc6113d-3505-4af5-90f6-ea803a1e7a72 /mnt/ssd/local    ext4 defaults,noatime,commit=60,nofail,x-systemd.device-timeout=10s 0 2"
      notify: Remount /mnt/ssd/local
