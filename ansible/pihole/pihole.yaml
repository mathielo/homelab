---
- name: Install Pi-hole
  hosts: pihole
  become: true
  vars:
    pihole_interface: eth0
    pihole_vip: 10.10.53.53
    nebula_sync_version: "0.11.2"
    nebula_sync_cron: "*/15 * * * *"
    # Set false to stage keepalived (package + config) on a node WITHOUT it
    # claiming the VIP — used during cutover so a not-yet-live node never
    # fights 10.10.53.53 with the box that still holds it statically.
    keepalived_start: true
    # Per-host: pihole_ipv4_address, pihole_ipv6_address (pihole-01 only),
    # keepalived_state/priority, nebula_sync_host — see host_vars/.

  tasks:
    - name: Load Pi-hole secrets
      community.sops.load_vars:
        file: pihole.sops.yaml
      no_log: true

    - name: Disable WiFi via boot firmware config
      lineinfile:
        path: /boot/firmware/config.txt
        line: "dtoverlay=disable-wifi"
        state: present
      register: wifi_disabled

    - name: Reboot to apply WiFi disable
      reboot:
      when: wifi_disabled.changed

    - name: Ensure /etc/pihole directory exists
      file:
        path: /etc/pihole
        state: directory
        mode: "0755"

    - name: Write Pi-hole setup configuration for unattended installation
      copy:
        dest: /etc/pihole/setupVars.conf
        content: |
          PIHOLE_INTERFACE={{ pihole_interface }}
          IPV4_ADDRESS={{ pihole_ipv4_address }}
          IPV6_ADDRESS={{ pihole_ipv6_address | default('') }}
          QUERY_LOGGING=true
          BLOCKING_ENABLED=true
          DNSSEC=false
          DNS_FQDN_REQUIRED=true
          DNS_BOGUS_PRIV=true
          CACHE_SIZE=10000
          DNSMASQ_LISTENING=all
        mode: "0644"

    - name: Configure static IPv6 address on {{ pihole_interface }}
      when: pihole_ipv6_address is defined
      shell: |
        CONN=$(nmcli -g NAME,DEVICE con show | grep ':{{ pihole_interface }}$' | cut -d: -f1 | head -1)
        CURRENT=$(nmcli -g ipv6.addresses con show "$CONN")
        if [ "$CURRENT" != "{{ pihole_ipv6_address }}" ]; then
          nmcli con mod "$CONN" \
            ipv6.method manual \
            ipv6.addresses "{{ pihole_ipv6_address }}" \
            ipv6.gateway "{{ pihole_ipv6_gateway }}"
          nmcli con up "$CONN"
          echo changed
        fi
      register: nmcli_ipv6
      changed_when: "'changed' in nmcli_ipv6.stdout"
      notify: Restart pihole-FTL

    - name: Install Pi-hole using official install script
      shell:
        cmd: curl -sSL https://install.pi-hole.net | bash /dev/stdin --unattended
        creates: /usr/local/bin/pihole

    - name: Set Pi-hole admin password
      command: pihole setpassword {{ pihole_password }}
      no_log: true

    # --- NTP (use router as time source to avoid DNS dependency) ---

    - name: Configure NTP to use VLAN gateway instead of external servers
      copy:
        dest: /etc/systemd/timesyncd.conf
        content: |
          [Time]
          NTP=10.10.53.1
        mode: "0644"
      notify: Restart timesyncd

    # --- Unbound (recursive resolver) ---

    - name: Install Unbound
      apt:
        name:
          - unbound
          - dns-root-data
        state: present
        update_cache: true

    - name: Write Unbound config for Pi-hole
      copy:
        dest: /etc/unbound/unbound.conf.d/zzz-pi-hole.conf
        content: |
          server:
              verbosity: 0
              interface: 127.0.0.1
              port: 5335
              do-ip4: yes
              do-udp: yes
              do-tcp: yes
              do-ip6: yes
              root-hints: /usr/share/dns/root.hints
              harden-glue: yes
              harden-dnssec-stripped: yes
              use-caps-for-id: no
              edns-buffer-size: 1232
              qname-minimisation: yes
              prefetch: yes
              num-threads: 2
              access-control: 127.0.0.1/32 allow
        mode: "0644"
      notify: Restart unbound

    - name: Enable and start Unbound
      systemd:
        name: unbound
        enabled: true
        state: started

    # --- Pi-hole upstream ---

    - name: Configure Pi-hole to use Unbound as upstream
      command: >
        pihole-FTL --config dns.upstreams '["127.0.0.1#5335"]'
      notify: Restart pihole-FTL

    - name: Configure conditional forwarding for local hostname resolution
      command: >
        pihole-FTL --config dns.revServers
        '["true,10.10.1.0/24,10.10.1.1,localdomain",
          "true,10.10.10.0/24,10.10.10.1,localdomain",
          "true,10.10.10.0/24,10.10.20.1,localdomain",
          "true,10.10.40.0/24,10.10.40.1,localdomain",
          "true,10.10.50.0/24,10.10.50.1,localdomain",
          "true,10.10.53.0/24,10.10.53.1,localdomain",
          "true,10.10.107.0/24,10.10.107.1,localdomain",
          "true,100.64.0.0/10,100.100.100.100,qilin-goby.ts.net"]'
      notify: Restart pihole-FTL

    - name: Enable loading of /etc/dnsmasq.d/ config files (required for wildcard DNS)
      command: pihole-FTL --config misc.etc_dnsmasq_d true
      notify: Restart pihole-FTL

    - name: Deploy k3s wildcard DNS record for *.m6o.dev
      copy:
        src: files/20-k3s.conf
        dest: /etc/dnsmasq.d/20-k3s.conf
        mode: "0644"
      notify: Restart pihole-FTL

    - name: Deploy Pi-hole upgrade script (handles Tailscale DNS conflict)
      copy:
        src: files/pihole-upgrade.sh
        dest: /usr/local/bin/pihole-upgrade
        mode: "0755"

    # --- keepalived (VRRP virtual IP for transparent DNS failover) ---

    - name: Install keepalived
      apt:
        name: keepalived
        state: present
        update_cache: true

    - name: Deploy Pi-hole health check for keepalived
      copy:
        src: files/chk_pihole.sh
        dest: /usr/local/bin/chk_pihole
        mode: "0755"

    - name: Write keepalived configuration
      template:
        src: templates/keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
        mode: "0644"
      register: keepalived_conf

    # When keepalived_start is false the unit is masked, so neither apt's
    # post-install start nor a config change can bring up the VIP while staging.
    # keepalived_start | bool — a CLI `-e keepalived_start=false` arrives as the
    # STRING "false", which is truthy in Jinja; | bool coerces it correctly.
    - name: Manage keepalived service state
      systemd:
        name: keepalived
        masked: "{{ not (keepalived_start | bool) }}"
        enabled: "{{ keepalived_start | bool }}"
        state: >-
          {{ 'restarted' if (keepalived_start | bool and keepalived_conf is changed)
             else ('started' if keepalived_start | bool else 'stopped') }}

    # --- nebula-sync (config replication, primary only) ---

    - name: Download nebula-sync release tarball
      get_url:
        url: "https://github.com/lovelaze/nebula-sync/releases/download/v{{ nebula_sync_version }}/nebula-sync_{{ nebula_sync_version }}_linux_arm64.tar.gz"
        dest: "/tmp/nebula-sync_{{ nebula_sync_version }}.tar.gz"
        mode: "0644"
      when: nebula_sync_host | default(false)

    - name: Install nebula-sync binary
      unarchive:
        src: "/tmp/nebula-sync_{{ nebula_sync_version }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include:
          - nebula-sync
        mode: "0755"
      when: nebula_sync_host | default(false)
      notify: Restart nebula-sync

    - name: Ensure /etc/nebula-sync directory exists
      file:
        path: /etc/nebula-sync
        state: directory
        mode: "0700"
      when: nebula_sync_host | default(false)

    - name: Write nebula-sync environment file
      template:
        src: templates/nebula-sync.env.j2
        dest: /etc/nebula-sync/nebula-sync.env
        mode: "0600"
      no_log: true
      when: nebula_sync_host | default(false)
      notify: Restart nebula-sync

    - name: Install nebula-sync systemd unit
      copy:
        src: files/nebula-sync.service
        dest: /etc/systemd/system/nebula-sync.service
        mode: "0644"
      when: nebula_sync_host | default(false)
      notify: Restart nebula-sync

    - name: Enable and start nebula-sync
      systemd:
        name: nebula-sync
        enabled: true
        state: started
        daemon_reload: true
      when: nebula_sync_host | default(false)

  handlers:
    - name: Restart timesyncd
      systemd:
        name: systemd-timesyncd
        state: restarted

    - name: Restart unbound
      systemd:
        name: unbound
        state: restarted

    - name: Restart pihole-FTL
      systemd:
        name: pihole-FTL
        state: restarted

    - name: Restart nebula-sync
      systemd:
        name: nebula-sync
        state: restarted
        daemon_reload: true
