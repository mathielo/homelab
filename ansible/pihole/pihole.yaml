---
- name: Install Pi-hole
  hosts: pihole
  become: true
  vars:
    pihole_interface: eth0
    pihole_vip: 10.10.53.53
    pihole_vip6: "2001:2042:37b0:1c35::53"
    # Comma-separated: that is the format `nmcli -g ipv4.dns` prints back, and
    # the task below compares against it verbatim.
    pihole_resolvers: "127.0.0.1,10.10.53.53"
    nebula_sync_version: "0.11.2"
    # Hourly — config/blocklists change rarely, and each sync restarts FTL on the
    # RPi3 standby via teleporter import, so keep the cadence gentle.
    nebula_sync_cron: "0 * * * *"
    # Set false to stage keepalived (package + config) on a node WITHOUT it
    # claiming the VIP — used during cutover so a not-yet-live node never
    # fights 10.10.53.53 with the box that still holds it statically.
    keepalived_start: true
    # Per-host: pihole_ipv4_address, pihole_ipv6_address (pihole-01 only),
    # keepalived_state/priority, nebula_sync_host — see host_vars/.

  tasks:
    - name: Load Pi-hole secrets
      community.sops.load_vars:
        file: pihole.sops.yaml
      no_log: true

    - name: Disable WiFi via boot firmware config
      lineinfile:
        path: /boot/firmware/config.txt
        line: "dtoverlay=disable-wifi"
        state: present
      register: wifi_disabled

    - name: Reboot to apply WiFi disable
      reboot:
      when: wifi_disabled.changed

    - name: Ensure /etc/pihole directory exists
      file:
        path: /etc/pihole
        state: directory
        mode: "0755"

    - name: Write Pi-hole setup configuration for unattended installation
      copy:
        dest: /etc/pihole/setupVars.conf
        content: |
          PIHOLE_INTERFACE={{ pihole_interface }}
          IPV4_ADDRESS={{ pihole_ipv4_address }}
          IPV6_ADDRESS={{ pihole_ipv6_address | default('') }}
          QUERY_LOGGING=true
          BLOCKING_ENABLED=true
          DNSSEC=false
          DNS_FQDN_REQUIRED=true
          DNS_BOGUS_PRIV=true
          CACHE_SIZE=10000
          DNSMASQ_LISTENING=all
        mode: "0644"

    # The VIP fallback matters most on a fresh node: switching IPv6 to manual
    # drops the RA-supplied nameservers, leaving 127.0.0.1 as the only resolver
    # while Pi-hole does not exist yet — the installer below then resolves
    # nothing. With the VIP second, the other node covers that window (and any
    # local FTL outage); once FTL is up, 127.0.0.1 answers first as before.
    - name: Configure static IPv6 and resolvers on {{ pihole_interface }}
      when: pihole_ipv6_address is defined
      shell: |
        CONN=$(nmcli -g NAME,DEVICE con show | grep ':{{ pihole_interface }}$' | cut -d: -f1 | head -1)
        # -e no: without it nmcli backslash-escapes every colon, so the compare
        # never matches and the task bounces eth0 (and FTL) on every run.
        CURRENT=$(nmcli -g ipv6.addresses -e no con show "$CONN")
        CURRENT_DNS=$(nmcli -g ipv4.dns -e no con show "$CONN")
        if [ "$CURRENT" != "{{ pihole_ipv6_address }}" ] || [ "$CURRENT_DNS" != "{{ pihole_resolvers }}" ]; then
          nmcli con mod "$CONN" \
            ipv6.method manual \
            ipv6.addresses "{{ pihole_ipv6_address }}" \
            ipv6.gateway "{{ pihole_ipv6_gateway }}" \
            ipv4.dns "{{ pihole_resolvers }}"
          nmcli con up "$CONN"
          echo changed
        fi
      register: nmcli_ipv6
      changed_when: "'changed' in nmcli_ipv6.stdout"
      notify: Restart pihole-FTL

    # pipefail + curl -f are load-bearing: without them a failed download feeds
    # bash an empty script, which exits 0 and reports "changed" while installing
    # nothing — the rest of the play then runs against a Pi-hole that is not there.
    - name: Install Pi-hole using official install script
      shell:
        cmd: set -o pipefail && curl -fsSL https://install.pi-hole.net | bash /dev/stdin --unattended
        executable: /bin/bash
        creates: /usr/local/bin/pihole

    - name: Set Pi-hole admin password
      command: pihole setpassword {{ pihole_password }}
      no_log: true

    # --- NTP (use router as time source to avoid DNS dependency) ---

    - name: Configure NTP to use VLAN gateway instead of external servers
      copy:
        dest: /etc/systemd/timesyncd.conf
        content: |
          [Time]
          NTP=10.10.53.1
        mode: "0644"
      notify: Restart timesyncd

    # --- Unbound (recursive resolver) ---

    - name: Install Unbound
      apt:
        name:
          - unbound
          - dns-root-data
        state: present
        update_cache: true

    - name: Write Unbound config for Pi-hole
      copy:
        dest: /etc/unbound/unbound.conf.d/zzz-pi-hole.conf
        content: |
          server:
              verbosity: 0
              interface: 127.0.0.1
              port: 5335
              do-ip4: yes
              do-udp: yes
              do-tcp: yes
              do-ip6: yes
              root-hints: /usr/share/dns/root.hints
              harden-glue: yes
              harden-dnssec-stripped: yes
              use-caps-for-id: no
              edns-buffer-size: 1232
              qname-minimisation: yes
              prefetch: yes
              num-threads: 2
              access-control: 127.0.0.1/32 allow
        mode: "0644"
      notify: Restart unbound

    - name: Enable and start Unbound
      systemd:
        name: unbound
        enabled: true
        state: started

    # --- Pi-hole upstream ---

    # These pihole-FTL --config writes are idempotent in effect and v6 hot-reloads
    # pihole.toml, so they apply live without an FTL restart. changed_when: false
    # stops every converge run from bouncing FTL (and blipping the VIP).
    - name: Configure Pi-hole to use Unbound as upstream
      command: >
        pihole-FTL --config dns.upstreams '["127.0.0.1#5335"]'
      changed_when: false

    - name: Configure conditional forwarding for local hostname resolution
      command: >
        pihole-FTL --config dns.revServers
        '["true,10.10.1.0/24,10.10.1.1,localdomain",
          "true,10.10.10.0/24,10.10.10.1,localdomain",
          "true,10.10.20.0/24,10.10.20.1,localdomain",
          "true,10.10.40.0/24,10.10.40.1,localdomain",
          "true,10.10.50.0/24,10.10.50.1,localdomain",
          "true,10.10.53.0/24,10.10.53.1,localdomain",
          "true,10.10.107.0/24,10.10.107.1,localdomain",
          "true,100.64.0.0/10,100.100.100.100,qilin-goby.ts.net"]'
      changed_when: false

    - name: Enable loading of /etc/dnsmasq.d/ config files (required for wildcard DNS)
      command: pihole-FTL --config misc.etc_dnsmasq_d true
      changed_when: false

    - name: Deploy k3s wildcard DNS record for *.m6o.dev
      copy:
        src: files/20-k3s.conf
        dest: /etc/dnsmasq.d/20-k3s.conf
        mode: "0644"
      notify: Restart pihole-FTL

    - name: Deploy pihole.m6o.dev admin record (points at the VIP)
      copy:
        src: files/30-pihole.conf
        dest: /etc/dnsmasq.d/30-pihole.conf
        mode: "0644"
      notify: Restart pihole-FTL

    - name: Deploy Pi-hole upgrade script (handles Tailscale DNS conflict)
      copy:
        src: files/pihole-upgrade.sh
        dest: /usr/local/bin/pihole-upgrade
        mode: "0755"

    # --- keepalived (VRRP virtual IP for transparent DNS failover) ---

    - name: Install keepalived and dig (chk_pihole health check)
      apt:
        name:
          - keepalived
          - dnsutils
        state: present
        update_cache: true

    - name: Deploy Pi-hole health check for keepalived
      copy:
        src: files/chk_pihole.sh
        dest: /usr/local/bin/chk_pihole
        mode: "0755"

    - name: Write keepalived configuration
      template:
        src: templates/keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
        mode: "0644"
      register: keepalived_conf

    # When keepalived_start is false the unit is masked, so neither apt's
    # post-install start nor a config change can bring up the VIP while staging.
    # keepalived_start | bool — a CLI `-e keepalived_start=false` arrives as the
    # STRING "false", which is truthy in Jinja; | bool coerces it correctly.
    - name: Manage keepalived service state
      systemd:
        name: keepalived
        masked: "{{ not (keepalived_start | bool) }}"
        enabled: "{{ keepalived_start | bool }}"
        state: >-
          {{ 'restarted' if (keepalived_start | bool and keepalived_conf is changed)
             else ('started' if keepalived_start | bool else 'stopped') }}

    # --- nebula-sync (config replication, primary only) ---

    - name: Download nebula-sync release tarball
      get_url:
        url: "https://github.com/lovelaze/nebula-sync/releases/download/v{{ nebula_sync_version }}/nebula-sync_{{ nebula_sync_version }}_linux_arm64.tar.gz"
        dest: "/tmp/nebula-sync_{{ nebula_sync_version }}.tar.gz"
        mode: "0644"
      when: nebula_sync_host | default(false)

    - name: Install nebula-sync binary
      unarchive:
        src: "/tmp/nebula-sync_{{ nebula_sync_version }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include:
          - nebula-sync
        mode: "0755"
      when: nebula_sync_host | default(false)
      notify: Restart nebula-sync

    - name: Ensure /etc/nebula-sync directory exists
      file:
        path: /etc/nebula-sync
        state: directory
        mode: "0700"
      when: nebula_sync_host | default(false)

    - name: Write nebula-sync environment file
      template:
        src: templates/nebula-sync.env.j2
        dest: /etc/nebula-sync/nebula-sync.env
        mode: "0600"
      no_log: true
      when: nebula_sync_host | default(false)
      notify: Restart nebula-sync

    - name: Install nebula-sync systemd unit
      copy:
        src: files/nebula-sync.service
        dest: /etc/systemd/system/nebula-sync.service
        mode: "0644"
      when: nebula_sync_host | default(false)
      notify: Restart nebula-sync

    - name: Enable and start nebula-sync
      systemd:
        name: nebula-sync
        enabled: true
        state: started
        daemon_reload: true
      when: nebula_sync_host | default(false)

    # --- Monitoring (node_exporter + Pi-hole HA metrics for Prometheus) ---

    - name: Install Prometheus node_exporter
      apt:
        name: prometheus-node-exporter
        state: present
        update_cache: true

    - name: Point node_exporter at the textfile collector directory
      copy:
        dest: /etc/default/prometheus-node-exporter
        content: |
          ARGS="--collector.textfile.directory=/var/lib/prometheus/node-exporter"
        mode: "0644"
      notify: Restart node_exporter

    - name: Ensure textfile collector directory exists
      file:
        path: /var/lib/prometheus/node-exporter
        state: directory
        owner: prometheus
        group: prometheus
        mode: "0755"

    - name: Deploy Pi-hole HA metrics collector
      copy:
        src: files/pihole-metrics.sh
        dest: /usr/local/bin/pihole-metrics
        mode: "0755"

    - name: Install Pi-hole HA metrics service + timer
      copy:
        src: "files/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - pihole-metrics.service
        - pihole-metrics.timer

    - name: Enable and start node_exporter
      systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started

    - name: Enable and start the Pi-hole HA metrics timer
      systemd:
        name: pihole-metrics.timer
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart timesyncd
      systemd:
        name: systemd-timesyncd
        state: restarted

    - name: Restart node_exporter
      systemd:
        name: prometheus-node-exporter
        state: restarted

    - name: Restart unbound
      systemd:
        name: unbound
        state: restarted

    - name: Restart pihole-FTL
      systemd:
        name: pihole-FTL
        state: restarted

    - name: Restart nebula-sync
      systemd:
        name: nebula-sync
        state: restarted
        daemon_reload: true
