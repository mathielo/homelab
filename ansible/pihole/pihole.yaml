---
- name: Install Pi-hole
  hosts: pihole
  become: true

  vars:
    pihole_interface: eth0
    pihole_ipv4_address: "192.168.10.9/27"
    pihole_dns_1: "9.9.9.9"
    pihole_dns_2: "149.112.112.112"

  tasks:
    - name: Ensure /etc/pihole directory exists
      file:
        path: /etc/pihole
        state: directory
        mode: "0755"

    - name: Write Pi-hole setup configuration for unattended installation
      copy:
        dest: /etc/pihole/setupVars.conf
        content: |
          PIHOLE_INTERFACE={{ pihole_interface }}
          IPV4_ADDRESS={{ pihole_ipv4_address }}
          IPV6_ADDRESS=
          QUERY_LOGGING=true
          BLOCKING_ENABLED=true
          DNSSEC=false
          DNS_FQDN_REQUIRED=true
          DNS_BOGUS_PRIV=true
          CACHE_SIZE=10000
          DNSMASQ_LISTENING=local
          PIHOLE_DNS_1={{ pihole_dns_1 }}
          PIHOLE_DNS_2={{ pihole_dns_2 }}
        mode: "0644"

    - name: Install Pi-hole using official install script
      shell:
        cmd: curl -sSL https://install.pi-hole.net | bash /dev/stdin --unattended
        creates: /usr/local/bin/pihole

    - name: Set Pi-hole admin password
      command: pihole setpassword {{ pihole_password }}
      no_log: true
