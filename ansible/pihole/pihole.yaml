---
- name: Install Pi-hole
  hosts: pihole
  become: true

  vars:
    pihole_interface: eth0
    pihole_ipv4_address: "10.10.53.53/24"
    pihole_ipv6_address: "2001:2042:37b0:1c35::53/64"
    pihole_ipv6_gateway: "2001:2042:37b0:1c35::1"

  tasks:
    - name: Ensure /etc/pihole directory exists
      file:
        path: /etc/pihole
        state: directory
        mode: "0755"

    - name: Write Pi-hole setup configuration for unattended installation
      copy:
        dest: /etc/pihole/setupVars.conf
        content: |
          PIHOLE_INTERFACE={{ pihole_interface }}
          IPV4_ADDRESS={{ pihole_ipv4_address }}
          IPV6_ADDRESS={{ pihole_ipv6_address }}
          QUERY_LOGGING=true
          BLOCKING_ENABLED=true
          DNSSEC=false
          DNS_FQDN_REQUIRED=true
          DNS_BOGUS_PRIV=true
          CACHE_SIZE=10000
          DNSMASQ_LISTENING=all
        mode: "0644"

    - name: Configure static IPv6 address on {{ pihole_interface }}
      shell: |
        CONN=$(nmcli -g NAME,DEVICE con show | grep ':{{ pihole_interface }}$' | cut -d: -f1 | head -1)
        CURRENT=$(nmcli -g ipv6.addresses con show "$CONN")
        if [ "$CURRENT" != "{{ pihole_ipv6_address }}" ]; then
          nmcli con mod "$CONN" \
            ipv6.method manual \
            ipv6.addresses "{{ pihole_ipv6_address }}" \
            ipv6.gateway "{{ pihole_ipv6_gateway }}"
          nmcli con up "$CONN"
          echo changed
        fi
      register: nmcli_ipv6
      changed_when: "'changed' in nmcli_ipv6.stdout"
      notify: Restart pihole-FTL

    - name: Install Pi-hole using official install script
      shell:
        cmd: curl -sSL https://install.pi-hole.net | bash /dev/stdin --unattended
        creates: /usr/local/bin/pihole

    - name: Set Pi-hole admin password
      command: pihole setpassword {{ pihole_password }}
      no_log: true

    # --- Unbound (recursive resolver) ---

    - name: Install Unbound
      apt:
        name:
          - unbound
          - dns-root-data
        state: present
        update_cache: true

    - name: Write Unbound config for Pi-hole
      copy:
        dest: /etc/unbound/unbound.conf.d/zzz-pi-hole.conf
        content: |
          server:
              verbosity: 0
              interface: 127.0.0.1
              port: 5335
              do-ip4: yes
              do-udp: yes
              do-tcp: yes
              do-ip6: yes
              root-hints: /usr/share/dns/root.hints
              harden-glue: yes
              harden-dnssec-stripped: yes
              use-caps-for-id: no
              edns-buffer-size: 1232
              qname-minimisation: yes
              prefetch: yes
              num-threads: 2
              access-control: 127.0.0.1/32 allow
        mode: "0644"
      notify: Restart unbound

    - name: Enable and start Unbound
      systemd:
        name: unbound
        enabled: true
        state: started

    # --- Pi-hole upstream ---

    - name: Configure Pi-hole to use Unbound as upstream
      command: >
        pihole-FTL --config dns.upstreams '["127.0.0.1#5335"]'
      notify: Restart pihole-FTL

    - name: Configure conditional forwarding for local hostname resolution
      command: >
        pihole-FTL --config dns.revServers
        '["true,10.10.1.0/24,10.10.1.1,localdomain",
          "true,10.10.10.0/24,10.10.10.1,localdomain",
          "true,10.10.40.0/24,10.10.40.1,localdomain",
          "true,10.10.50.0/24,10.10.50.1,localdomain",
          "true,10.10.53.0/24,10.10.53.1,localdomain",
          "true,10.10.107.0/24,10.10.107.1,localdomain",
          "true,100.64.0.0/10,100.100.100.100,qilin-goby.ts.net"]'
      notify: Restart pihole-FTL

    - name: Enable loading of /etc/dnsmasq.d/ config files (required for wildcard DNS)
      command: pihole-FTL --config misc.etc_dnsmasq_d true
      notify: Restart pihole-FTL

  handlers:
    - name: Restart unbound
      systemd:
        name: unbound
        state: restarted

    - name: Restart pihole-FTL
      systemd:
        name: pihole-FTL
        state: restarted
