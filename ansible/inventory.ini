[all:vars]
ansible_user=m8hl

[k3s_server]
k3s-server ansible_host=10.10.50.10

[k3s_agents]
k3s-node-01 ansible_host=10.10.50.11
k3s-node-02 ansible_host=10.10.50.12

[k3s_nodes:children]
k3s_server
k3s_agents

[k3s_nodes:vars]
ansible_python_interpreter=/usr/bin/python3

; Nodes running a Gluetun/WireGuard tunnel at line rate — see nic-tuning.yaml.
; Per-NIC settings live in host_vars.
[nic_tuning]
k3s-node-01
k3s-node-02

; Drives the DeskPi 7.84" rack touchscreen (OS-level kiosk) off DP-2. References
; the host already defined in [k3s_agents], so ansible_host resolves from there.
[kiosk]
k3s-node-01

; Two-node Pi-hole. 10.10.53.53 is a keepalived VRRP virtual IP that floats
; between these boxes; the real per-host addresses are .51 / .52 (host_vars).
[pihole]
pihole-01 ansible_host=10.10.53.51
pihole-02 ansible_host=10.10.53.52

[pihole:vars]
ansible_python_interpreter=/usr/bin/python3
