[all:vars]
ansible_user=m8hl

[k3s_server]
k3s-server ansible_host=10.10.50.10

[k3s_agents]
k3s-node-01 ansible_host=10.10.50.11

[k3s_nodes:children]
k3s_server
k3s_agents

[k3s_nodes:vars]
ansible_python_interpreter=/usr/bin/python3

; k3s-node-01 also drives the DeskPi 7.84" rack touchscreen (OS-level kiosk).
; Group references the host already defined in [k3s_agents] (ansible_host
; resolves from there) so the kiosk play can target just this node.
[kiosk]
k3s-node-01

[pihole]
pihole ansible_host=10.10.53.53

[pihole:vars]
ansible_python_interpreter=/usr/bin/python3
