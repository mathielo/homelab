---
# NIC tuning for the nodes that push a WireGuard tunnel at line rate.
#
# WireGuard's outer flow is one UDP 4-tuple: it hashes to a single CPU for
# NAPI/softirq. That CPU then does the whole pipeline (NAPI poll → WireGuard
# decrypt → TCP → socket) while the rest of the cores idle. Symptoms are
# NIC-level drops under burst and, on node-01, a huge time_squeeze count on
# CPU0 (`/proc/net/softnet_stat`) — NAPI running out of budget with work still
# queued.
#
# Levers, per host (see host_vars):
#   1. RPS over the CPUs in the host's mask: moves protocol processing off the
#      IRQ-handling CPU, freeing it for the next interrupt. Won't redistribute a
#      single-tunnel flow across cores (same hash every time), but does decouple
#      IRQ from protocol processing.
#   2. RX/TX ring to the hardware maximum, where the driver allows raising it.
#      The r8169 in node-01 caps at 256 and is already there, so nic_rx_ring is
#      only set for node-02's e1000e.
#   3. net.core.netdev_max_backlog 1000 → 8192: the queue between NAPI poll and
#      the protocol stack. Headroom rather than a fix for an observed overflow —
#      the softnet drop counters are 0 on both hosts — but the default is small
#      for a link that runs at wire rate for hours.
#
# Reapplied at boot via a systemd oneshot — ethtool ring + rps_cpus don't
# persist across reboots.
- name: Tune the NIC on the WireGuard nodes
  hosts: nic_tuning
  become: true

  handlers:
    - name: Apply sysctl settings
      command: sysctl --system

    - name: Reload and restart nic-tuning
      systemd:
        name: nic-tuning
        state: restarted
        daemon_reload: true

  tasks:
    - name: Install ethtool
      apt:
        name: ethtool
        state: present

    - name: Raise netdev backlog for high-pps bursts
      copy:
        dest: /etc/sysctl.d/99-nic-tuning.conf
        content: |
          net.core.netdev_max_backlog = 8192
        mode: "0644"
      notify: Apply sysctl settings

    - name: Install nic-tuning systemd unit
      copy:
        dest: /etc/systemd/system/nic-tuning.service
        content: |
          [Unit]
          Description=Tune {{ nic_device }} ring and RPS for WireGuard burst absorption
          After=sys-subsystem-net-devices-{{ nic_device }}.device
          Wants=sys-subsystem-net-devices-{{ nic_device }}.device

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          {% if nic_rx_ring is defined %}
          ExecStart=/sbin/ethtool -G {{ nic_device }} rx {{ nic_rx_ring }} tx {{ nic_tx_ring | default(nic_rx_ring) }}
          {% endif %}
          ExecStart=/bin/sh -c 'echo {{ nic_rps_cpus }} > /sys/class/net/{{ nic_device }}/queues/rx-0/rps_cpus'

          [Install]
          WantedBy=multi-user.target
        mode: "0644"
      notify: Reload and restart nic-tuning

    - name: Enable and start nic-tuning
      systemd:
        name: nic-tuning
        enabled: true
        state: started
        daemon_reload: true
