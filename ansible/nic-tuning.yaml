---
# NIC tuning for k3s-node-02 (the VPN/torrent node).
#
# qBittorrent + Gluetun on this node push hundreds of Mbps through a single
# WireGuard tunnel. WireGuard's outer flow is one UDP 4-tuple → it hashes to
# a single CPU for NAPI/softirq, and the default 256-entry eno1 RX ring is
# too small to absorb start-of-torrent connection bursts. Result: kernel
# drops packets at the NIC → TCP retransmits → visible LAN hiccup as a new
# torrent ramps up.
#
# Two fixes here:
#   1. RX ring 256 → 4096 (hardware max): absorbs short bursts without
#      dropping while the kernel drains.
#   2. RPS on rx-0 across all 20 CPUs: moves packet processing off the
#      IRQ-handling CPU, freeing it for the next interrupt instead of doing
#      the whole pipeline itself. Won't redistribute a single-tunnel flow
#      across cores (same hash every time), but does decouple IRQ from
#      protocol processing — useful under burst.
#   3. net.core.netdev_max_backlog 1000 → 8192: the queue between NAPI poll
#      and the protocol stack. Backs up when softirq is briefly behind;
#      raising it gives the same "absorb burst" effect at the next layer.
#
# Reapplied at boot via a systemd oneshot — ethtool ring + rps_cpus don't
# persist across reboots.
- name: Tune eno1 on the VPN node
  hosts: k3s-node-02
  become: true

  handlers:
    - name: Apply sysctl settings
      command: sysctl --system

    - name: Reload and restart nic-tuning
      systemd:
        name: nic-tuning
        state: restarted
        daemon_reload: true

  tasks:
    - name: Install ethtool
      apt:
        name: ethtool
        state: present

    - name: Raise netdev backlog for high-pps bursts
      copy:
        dest: /etc/sysctl.d/99-nic-tuning.conf
        content: |
          net.core.netdev_max_backlog = 8192
        mode: "0644"
      notify: Apply sysctl settings

    - name: Install nic-tuning systemd unit
      copy:
        dest: /etc/systemd/system/nic-tuning.service
        content: |
          [Unit]
          Description=Tune eno1 RX ring and RPS for WireGuard burst absorption
          After=sys-subsystem-net-devices-eno1.device
          Wants=sys-subsystem-net-devices-eno1.device

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          # Hardware max per `ethtool -g eno1` is 4096. e1000e supports this.
          ExecStart=/sbin/ethtool -G eno1 rx 4096 tx 4096
          # 0xfffff = all 20 logical CPUs (6P+8E with HT on the P-cores).
          ExecStart=/bin/sh -c 'echo fffff > /sys/class/net/eno1/queues/rx-0/rps_cpus'

          [Install]
          WantedBy=multi-user.target
        mode: "0644"
      notify: Reload and restart nic-tuning

    - name: Enable and start nic-tuning
      systemd:
        name: nic-tuning
        enabled: true
        state: started
        daemon_reload: true
