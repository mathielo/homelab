---
# Manages the media namespace and shared storage (PVCs, StorageClass).
# Must sync before any media app — ArgoCD respects sync-wave ordering.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mathielo/homelab.git
    targetRevision: main
    path: k3s/apps/media/_infra
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
