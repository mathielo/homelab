---
# Kubernetes VolumeSnapshot CRDs, which k3s does not ship. Longhorn's
# csi-snapshotter sidecar watches these types and fails its watch without them.
# No snapshot-controller is installed, so VolumeSnapshot objects stay inert;
# Longhorn snapshots and backups use Longhorn's own CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: volume-snapshot-crds
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-csi/external-snapshotter.git
    targetRevision: v8.7.0
    path: client/config/crd
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
