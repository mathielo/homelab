---
# Prometheus + Alertmanager. Sync-wave 0 so it's up before Grafana (datasource)
# and Promtail. Release name stays `prometheus` to preserve service DNS
# (prometheus-server / prometheus-alertmanager).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:mathielo/homelab.git
    targetRevision: main
    path: k3s/apps/monitoring/prometheus
    helm:
      valueFiles:
        - values.yaml
        - secrets://values.sops.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
