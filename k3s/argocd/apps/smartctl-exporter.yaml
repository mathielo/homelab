---
# smartctl exporter (DaemonSet, k3s-node-02 only). Sync-wave 1 — feeds
# Prometheus (wave 0) the SMART health of the DAS pair behind /mnt/r0.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartctl-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:mathielo/homelab.git
    targetRevision: main
    path: k3s/apps/monitoring/smartctl-exporter
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
