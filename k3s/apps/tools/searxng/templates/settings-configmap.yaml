---
# SearXNG settings.yml. `secret_key` carries a placeholder that the
# init-settings container (see values.yaml) replaces with $SEARXNG_SECRET
# from the sops-encrypted values before the app reads the file — so no
# secret ever lands in this ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: tools
data:
  settings.yml: |
    # Merge with the image's built-in defaults (engine list, etc.); only the
    # keys below are overridden. ahmia and torch are Tor-only engines and fail
    # to register without a Tor proxy.
    use_default_settings:
      engines:
        remove:
          - ahmia
          - torch

    general:
      instance_name: "SearXNG"
      # The wikipedia, wikidata and openstreetmap engines refuse to load while this
      # is empty. It is only appended to their outgoing User-Agent.
      contact_url: "https://searxng.org/"

    server:
      base_url: "https://srx.m6o.dev/"
      secret_key: "__SECRET_KEY__"
      image_proxy: true
      # Limiter/bot-protection needs a Valkey backend and only matters for
      # public instances — disabled for this internal single-user deployment.
      limiter: false

    search:
      safe_search: 0
      formats:
        - html

    ui:
      default_theme: simple
      hotkeys: vim
