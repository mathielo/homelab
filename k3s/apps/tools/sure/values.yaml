# Sure runs as a single pod: Postgres and Valkey (Redis) are native sidecars
# (initContainers with restartPolicy: Always) so they start — and are waited
# on — before the Rails web/worker containers boot. SECRET_KEY_BASE and
# POSTGRES_PASSWORD come from the `sure` secret, populated by values.sops.yaml.
app-template:
  defaultPodOptions:
    securityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

  controllers:
    main:
      # RWO PVCs (Postgres + storage) require the old pod to fully release
      # before the new one mounts them.
      strategy: Recreate

      initContainers:
        postgres:
          # restartPolicy: Always promotes this to a native sidecar — starts
          # before the app containers and is torn down after them.
          restartPolicy: Always
          image:
            repository: postgres
            tag: "18.4-alpine"
          env:
            POSTGRES_USER: sure_user
            POSTGRES_DB: sure_production
            # PGDATA in a subdir so the Longhorn volume's lost+found doesn't
            # make initdb refuse a "non-empty" data directory.
            PGDATA: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                identifier: sure # POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi

        redis:
          restartPolicy: Always
          image:
            repository: valkey/valkey
            tag: "9.1.0-alpine"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi

        # Blocks the app containers until Postgres accepts connections.
        wait-for-db:
          dependsOn: postgres
          image:
            repository: postgres
            tag: "18.4-alpine"
          command:
            - sh
            - -c
            - until pg_isready -h localhost -p 5432 -U sure_user; do echo "waiting for postgres"; sleep 2; done

      containers:
        web:
          image:
            repository: ghcr.io/we-promise/sure
            tag: "0.7.3-alpha.3"
          env: &sureEnv
            SELF_HOSTED: "true"
            RAILS_ENV: production
            DB_HOST: localhost
            DB_PORT: "5432"
            POSTGRES_USER: sure_user
            POSTGRES_DB: sure_production
            REDIS_URL: redis://localhost:6379/1
            # nginx terminates TLS; tell Rails to treat the proxied request as
            # secure without forcing its own redirect.
            RAILS_FORCE_SSL: "false"
            RAILS_ASSUME_SSL: "true"
            TZ: Europe/Stockholm
          envFrom:
            - secretRef:
                identifier: sure # SECRET_KEY_BASE + POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1500m
              memory: 1Gi

        worker:
          image:
            repository: ghcr.io/we-promise/sure
            tag: "0.7.3-alpha.3"
          command:
            - bundle
            - exec
            - sidekiq
          env: *sureEnv
          envFrom:
            - secretRef:
                identifier: sure
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi

  secrets:
    sure:
      enabled: true
      # stringData (SECRET_KEY_BASE, POSTGRES_PASSWORD) supplied by values.sops.yaml
      stringData: {}

  service:
    main:
      controller: main
      ports:
        http:
          port: 3000

  ingress:
    main:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: sure.m6o.dev
          paths:
            - path: /
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - sure.m6o.dev
          secretName: sure-tls

  persistence:
    postgres-data:
      existingClaim: sure-postgres-lh
      advancedMounts:
        main:
          postgres:
            - path: /var/lib/postgresql/data
    redis-data:
      type: emptyDir
      advancedMounts:
        main:
          redis:
            - path: /data
    storage:
      existingClaim: sure-storage-lh
      advancedMounts:
        main:
          web:
            - path: /rails/storage
          worker:
            - path: /rails/storage
