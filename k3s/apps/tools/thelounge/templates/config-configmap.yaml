---
# The Lounge server config (config.js). Mounted read-only at
# /var/opt/thelounge/config.js (see values.yaml). Server-level only; per-user
# settings live in users/<name>.json on the data PVC. Holds no secrets —
# private mode keeps hashed credentials on the PVC, not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: thelounge-config
  namespace: tools
data:
  config.js: |
    "use strict";

    module.exports = {
      // Private mode: a bouncer that keeps IRC connections + history per user.
      public: false,
      host: undefined,
      port: 9000,
      bind: undefined,

      // nginx terminates TLS and proxies; trust its X-Forwarded-* headers.
      reverseProxy: true,
      https: { enable: false },

      theme: "default",
      prefetch: false,
      maxHistory: 10000,
      messageStorage: ["sqlite", "text"],

      fileUpload: { enable: false },
      transports: ["polling", "websocket"],
      leaveMessage: "Leaving",

      // Pre-fills the "add network" form; users can still change it.
      lockNetwork: false,
      defaults: {
        name: "Libera.Chat",
        host: "irc.libera.chat",
        port: 6697,
        password: "",
        tls: true,
        rejectUnauthorized: true,
        nick: "thelounge",
        username: "thelounge",
        realname: "The Lounge User",
        join: "",
      },
    };
