# Steam players join by Game ID over Steam's relay network. SERVER_PORT also
# enables direct connections, reachable on the LAN at 10.10.50.10:27015 (UDP
# hostPort, hence the pin to k3s-server) with PASSWORD — the Game ID works in
# both modes. GAME_ID and PASSWORD come from the `core-keeper` secret, populated
# by values.sops.yaml.
app-template:
  defaultPodOptions:
    nodeSelector:
      kubernetes.io/hostname: k3s-server
    securityContext:
      # Image user `steam` is 1000:1000. Running as it directly skips the
      # entrypoint's usermod + recursive chown; fsGroup makes the volumes writable.
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000

  controllers:
    main:
      # RWO world PVC requires the old pod to fully release before the new one
      # mounts it.
      strategy: Recreate
      pod:
        # On SIGTERM the entrypoint signals the server and waits for it to exit;
        # upstream sizes that window at 2 minutes.
        terminationGracePeriodSeconds: 120

      containers:
        app:
          image:
            repository: escaping/core-keeper-dedicated
            tag: "v2.8.1"
          env:
            WORLD_MODE: "1" # Hard
            MAX_PLAYERS: "2"
            SERVER_PORT: "27015"
            TZ: Europe/Stockholm
          envFrom:
            - secretRef:
                identifier: core-keeper # GAME_ID + PASSWORD
          ports:
            - name: game
              containerPort: 27015
              hostPort: 27015
              protocol: UDP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi

  secrets:
    core-keeper:
      enabled: true
      # stringData (GAME_ID, PASSWORD) supplied by values.sops.yaml
      stringData: {}

  persistence:
    # World saves and ServerConfig.json.
    data:
      existingClaim: core-keeper-data-lh
      globalMounts:
        - path: /home/steam/core-keeper-data
    # Server binaries. SteamCMD validates and updates them on every start, so a
    # restart is a game update and the ~180 MiB download is re-fetched each time.
    server:
      type: emptyDir
      globalMounts:
        - path: /home/steam/core-keeper-dedicated
