# The entrypoint starts as root to chown /app/data then drops to the app user via
# gosu, so we don't set runAsUser. fsGroup 1654 makes the secret-volume files
# group-owned by the app group so uid 1654 can read the key at mode 0640.
app-template:
  defaultPodOptions:
    securityContext:
      fsGroup: 1654

  controllers:
    main:
      # RWO PVC requires the old pod to release before the new one mounts it.
      strategy: Recreate

      initContainers:
        # InfluxDB 2 runs in-pod so Network Optimizer reaches it over localhost:8086.
        # restartPolicy: Always promotes it to a native sidecar: it starts
        # before the main container and is torn down after it. Pinned to 2.x —
        # NetOpt's wizard provisions buckets/tokens via the v2 management API,
        # which InfluxDB 3 drops (Renovate fences v3 out to match).
        influxdb:
          restartPolicy: Always
          image:
            repository: influxdb
            tag: "2.9.1"
          env:
            TZ: Europe/Stockholm
            DOCKER_INFLUXDB_INIT_MODE: setup
            DOCKER_INFLUXDB_INIT_USERNAME: admin
            DOCKER_INFLUXDB_INIT_ORG: homelab
            DOCKER_INFLUXDB_INIT_BUCKET: default
          envFrom:
            - secretRef:
                identifier: network-optimizer-influxdb # INIT_PASSWORD + INIT_ADMIN_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

      containers:
        main:
          image:
            repository: ghcr.io/ozark-connect/network-optimizer
            tag: "1.21.1"
          env:
            TZ: Europe/Stockholm
            # Listen on 0.0.0.0:8042 so the ClusterIP Service / ingress can
            # reach it (the ingress controller is a separate pod, not localhost).
            BIND_LOCALHOST_ONLY: "false"
            # Makes the app emit correct https:// canonical URLs behind nginx.
            REVERSE_PROXIED_HOST_NAME: netopt.m6o.dev
          envFrom:
            - secretRef:
                identifier: network-optimizer # APP_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

  secrets:
    network-optimizer:
      enabled: true
      # stringData (APP_PASSWORD) supplied by values.sops.yaml
      stringData: {}
    network-optimizer-ssh:
      enabled: true
      # stringData (id_rsa: <private key>) supplied by values.sops.yaml.
      stringData: {}
    network-optimizer-influxdb:
      enabled: true
      # stringData (DOCKER_INFLUXDB_INIT_PASSWORD, DOCKER_INFLUXDB_INIT_ADMIN_TOKEN)
      # supplied by values.sops.yaml.
      stringData: {}

  service:
    main:
      controller: main
      ports:
        http:
          port: 8042

  ingress:
    main:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: netopt.m6o.dev
          paths:
            - path: /
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - netopt.m6o.dev
          secretName: network-optimizer-tls

  persistence:
    # SQLite DB, app config, license and the stored UniFi credentials. The data
    # is re-creatable (re-enter UniFi creds, re-run audits), so an app-template
    # managed PVC is fine here — no separate _infra claim like the tools apps.
    data:
      accessMode: ReadWriteOnce
      size: 2Gi
      storageClass: longhorn
      advancedMounts:
        main:
          main:
            - path: /app/data
    # SSH private key the app uses to reach the console + UniFi devices.
    ssh-keys:
      type: secret
      identifier: network-optimizer-ssh
      defaultMode: 0640
      advancedMounts:
        main:
          main:
            - path: /app/ssh-keys
              readOnly: true
    # InfluxDB 2 time-series store (port counters, latency probes, SFP levels).
    influxdb-data:
      accessMode: ReadWriteOnce
      size: 5Gi
      storageClass: longhorn
      advancedMounts:
        main:
          influxdb:
            - path: /var/lib/influxdb2
