# Upstream grafana/grafana chart values nested under the `grafana:` key.
grafana:
  # adminUser / adminPassword come from grafana/values.sops.yaml, decrypted by
  # ArgoCD's helm-secrets plugin at sync time.

  grafana.ini:
    analytics:
      reporting_enabled: false

  service:
    type: ClusterIP

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      node-exporter-full:
        gnetId: 1860
        revision: 37
        datasource: Prometheus
      loki-log-explorer:
        gnetId: 13639
        datasource: Loki

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-server.monitoring.svc.cluster.local
          isDefault: true
          access: proxy
        - name: Loki
          type: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy

  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      cpu: 200m
      memory: 512Mi

  persistence:
    enabled: true
    storageClassName: longhorn
    size: 2Gi

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.hl.mathielo.com
    tls:
      - hosts:
          - grafana.hl.mathielo.com
        secretName: grafana-tls
