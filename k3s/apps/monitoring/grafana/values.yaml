# Upstream grafana/grafana chart values nested under the `grafana:` key.
grafana:
  # adminUser / adminPassword come from grafana/values.sops.yaml, decrypted by
  # ArgoCD's helm-secrets plugin at sync time.

  grafana.ini:
    analytics:
      reporting_enabled: false

  service:
    type: ClusterIP

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      node-exporter-full:
        gnetId: 1860
        revision: 37
        datasource: Prometheus
      loki-log-explorer:
        gnetId: 13639
        datasource: Loki
      # Custom dashboard for the dual Pi-hole HA setup (metrics from the pihole
      # scrape job: pihole_* HA textfile metrics + node_exporter host vitals).
      pihole-ha:
        datasource: Prometheus
        json: |
          {
            "uid": "pihole-ha",
            "title": "Pi-hole HA",
            "tags": ["pihole", "dns"],
            "schemaVersion": 39,
            "editable": true,
            "refresh": "30s",
            "time": { "from": "now-6h", "to": "now" },
            "templating": { "list": [] },
            "annotations": { "list": [] },
            "panels": [
              {
                "id": 1, "type": "state-timeline", "title": "IPv4 VIP holder (10.10.53.53)",
                "datasource": "Prometheus",
                "gridPos": { "h": 6, "w": 12, "x": 0, "y": 0 },
                "targets": [ { "expr": "pihole_holds_vip{family=\"ipv4\"}", "legendFormat": "{{instance}}", "refId": "A" } ],
                "options": { "showValue": "never", "mergeValues": true, "legend": { "displayMode": "list", "placement": "bottom" } },
                "fieldConfig": {
                  "defaults": {
                    "color": { "mode": "thresholds" },
                    "thresholds": { "mode": "absolute", "steps": [ { "color": "dark-red", "value": null }, { "color": "green", "value": 1 } ] },
                    "mappings": [ { "type": "value", "options": { "0": { "text": "backup" }, "1": { "text": "MASTER" } } } ]
                  }, "overrides": []
                }
              },
              {
                "id": 2, "type": "state-timeline", "title": "IPv6 VIP holder (::53)",
                "datasource": "Prometheus",
                "gridPos": { "h": 6, "w": 12, "x": 12, "y": 0 },
                "targets": [ { "expr": "pihole_holds_vip{family=\"ipv6\"}", "legendFormat": "{{instance}}", "refId": "A" } ],
                "options": { "showValue": "never", "mergeValues": true, "legend": { "displayMode": "list", "placement": "bottom" } },
                "fieldConfig": {
                  "defaults": {
                    "color": { "mode": "thresholds" },
                    "thresholds": { "mode": "absolute", "steps": [ { "color": "dark-red", "value": null }, { "color": "green", "value": 1 } ] },
                    "mappings": [ { "type": "value", "options": { "0": { "text": "backup" }, "1": { "text": "MASTER" } } } ]
                  }, "overrides": []
                }
              },
              {
                "id": 3, "type": "stat", "title": "DNS answering",
                "datasource": "Prometheus",
                "gridPos": { "h": 4, "w": 8, "x": 0, "y": 6 },
                "targets": [ { "expr": "pihole_dns_up", "legendFormat": "{{instance}}", "refId": "A", "instant": true } ],
                "options": { "colorMode": "background", "graphMode": "none", "textMode": "value_and_name", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false } },
                "fieldConfig": {
                  "defaults": {
                    "color": { "mode": "thresholds" },
                    "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] },
                    "mappings": [ { "type": "value", "options": { "0": { "text": "DOWN" }, "1": { "text": "UP" } } } ]
                  }, "overrides": []
                }
              },
              {
                "id": 4, "type": "stat", "title": "Node reachable",
                "datasource": "Prometheus",
                "gridPos": { "h": 4, "w": 8, "x": 8, "y": 6 },
                "targets": [ { "expr": "up{job=\"pihole\"}", "legendFormat": "{{instance}}", "refId": "A", "instant": true } ],
                "options": { "colorMode": "background", "graphMode": "none", "textMode": "value_and_name", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false } },
                "fieldConfig": {
                  "defaults": {
                    "color": { "mode": "thresholds" },
                    "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] },
                    "mappings": [ { "type": "value", "options": { "0": { "text": "DOWN" }, "1": { "text": "UP" } } } ]
                  }, "overrides": []
                }
              },
              {
                "id": 5, "type": "stat", "title": "keepalived",
                "datasource": "Prometheus",
                "gridPos": { "h": 4, "w": 8, "x": 16, "y": 6 },
                "targets": [ { "expr": "pihole_keepalived_up", "legendFormat": "{{instance}}", "refId": "A", "instant": true } ],
                "options": { "colorMode": "background", "graphMode": "none", "textMode": "value_and_name", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false } },
                "fieldConfig": {
                  "defaults": {
                    "color": { "mode": "thresholds" },
                    "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] },
                    "mappings": [ { "type": "value", "options": { "0": { "text": "DOWN" }, "1": { "text": "UP" } } } ]
                  }, "overrides": []
                }
              },
              {
                "id": 6, "type": "timeseries", "title": "CPU busy %",
                "datasource": "Prometheus",
                "gridPos": { "h": 7, "w": 8, "x": 0, "y": 10 },
                "targets": [ { "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{job=\"pihole\",mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{instance}}", "refId": "A" } ],
                "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
                "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] }
              },
              {
                "id": 7, "type": "timeseries", "title": "Memory used %",
                "datasource": "Prometheus",
                "gridPos": { "h": 7, "w": 8, "x": 8, "y": 10 },
                "targets": [ { "expr": "(1 - node_memory_MemAvailable_bytes{job=\"pihole\"} / node_memory_MemTotal_bytes{job=\"pihole\"}) * 100", "legendFormat": "{{instance}}", "refId": "A" } ],
                "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
                "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] }
              },
              {
                "id": 8, "type": "timeseries", "title": "Root disk used %",
                "datasource": "Prometheus",
                "gridPos": { "h": 7, "w": 8, "x": 16, "y": 10 },
                "targets": [ { "expr": "(1 - node_filesystem_avail_bytes{job=\"pihole\",mountpoint=\"/\"} / node_filesystem_size_bytes{job=\"pihole\",mountpoint=\"/\"}) * 100", "legendFormat": "{{instance}}", "refId": "A" } ],
                "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
                "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] }
              }
            ]
          }

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-server.monitoring.svc.cluster.local
          isDefault: true
          access: proxy
        - name: Loki
          type: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy

  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      cpu: 200m
      memory: 512Mi

  persistence:
    enabled: true
    storageClassName: longhorn
    size: 2Gi

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.m6o.dev
    tls:
      - hosts:
          - grafana.m6o.dev
        secretName: grafana-tls
