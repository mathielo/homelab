# Upstream grafana/grafana chart values nested under the `grafana:` key.
grafana:
  # adminUser / adminPassword come from grafana/values.sops.yaml, decrypted by
  # ArgoCD's helm-secrets plugin at sync time.

  grafana.ini:
    analytics:
      reporting_enabled: false
    # The rack panel has no keyboard, so Chromium can't complete a login. An
    # anonymous read-only role is what makes the unattended kiosk possible;
    # Grafana is reachable only via split-DNS/Tailscale, never publicly.
    # Set enabled:false to require a login again (the kiosk then goes blank).
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Viewer

  service:
    type: ClusterIP

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
        # Custom dashboards, kept as reviewable JSON files under dashboards/
        # and mounted from the ConfigMap in templates/dashboards.yaml.
        - name: homelab
          orgId: 1
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/homelab

  dashboards:
    default:
      node-exporter-full:
        gnetId: 1860
        revision: 37
        datasource: Prometheus
      loki-log-explorer:
        gnetId: 13639
        datasource: Loki

  dashboardsConfigMaps:
    homelab: grafana-homelab-dashboards

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-server.monitoring.svc.cluster.local
          isDefault: true
          access: proxy
        - name: Loki
          type: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy

  # The config PVC is ReadWriteOnce, which Longhorn attaches to one node at a
  # time. The chart's default rolling update rounds maxUnavailable down to 0 on a
  # single replica, so the old pod is held until the new one is Ready — and the
  # new one can never attach the volume while the old one holds it. That
  # deadlocks whenever the replacement is scheduled onto a different node.
  #
  # maxSurge 0 caps the deployment at one pod, so the old one is torn down (and
  # the volume detached) before the replacement is created. Same effect as
  # type:Recreate, but Recreate can't be applied over an existing RollingUpdate
  # deployment — the API server keeps the defaulted spec.strategy.rollingUpdate
  # block and then rejects it as forbidden under Recreate.
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      cpu: 200m
      memory: 512Mi

  persistence:
    enabled: true
    storageClassName: longhorn
    size: 2Gi

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.m6o.dev
    tls:
      - hosts:
          - grafana.m6o.dev
        secretName: grafana-tls
