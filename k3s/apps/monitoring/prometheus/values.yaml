# Upstream prometheus-community/prometheus chart values are nested under the
# `prometheus:` dependency key (umbrella-chart convention — see media apps).
prometheus:
  alertmanager:
    enabled: true
    persistence:
      enabled: true
      storageClass: longhorn-no-bkp # disposable alert state — not backed up
      size: 1Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    templates:
      # Notification message template
      telegram.tmpl: |
        {{ define "telegram.message" }}
        {{ if eq .Status "firing" }}🚨{{ else }}🕊{{ end }} <b>{{ .Status | toUpper }}</b>
        {{ range .Alerts.Firing }}
        <b>{{ .Labels.alertname }}</b> ({{ .Labels.severity }})
        {{ .Annotations.summary }}
        {{ end }}
        {{ range .Alerts.Resolved }}
        <b>{{ .Labels.alertname }}</b> ({{ .Labels.severity }}){{ with .Labels.device }} on {{ . }}{{ end }}{{ with .Labels.node }} on {{ . }}{{ end }} — cleared
        {{ end }}
        {{ end }}
    config:
      global:
        resolve_timeout: 5m
      templates:
        - "/etc/alertmanager/*.tmpl"
      route:
        receiver: telegram
        group_by: ["alertname", "namespace"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - receiver: telegram
            matchers:
              - alertname=~"NodeDiskPressure|NodeDiskCritical"
            repeat_interval: 6h
          # Warning-severity SMART/DAS alerts describe a physical condition that
          # stays true until the hardware is changed — re-notifying is noise, so
          # they announce once and stay quiet until they clear. Grouped per
          # device because one drive crossing its threshold must not re-notify
          # for the other drives sharing the group.
          - receiver: telegram
            matchers:
              - alertname=~"Disk.*|Nvme.*|Das.*"
              - severity=warning
            group_by: ["alertname", "device"]
            repeat_interval: 720h
          - receiver: telegram
            matchers:
              - severity=critical
            repeat_interval: 1h
      # `receivers` carries the Telegram bot_token + chat_id (the secrets) plus a
      # one-line reference to the template above; it lives in values.sops.yaml.

  # Scrape Longhorn manager metrics (longhorn_volume_*, longhorn_node_*) —
  # annotation-based discovery doesn't pick them up, so add an explicit job.
  extraScrapeConfigs: |
    - job_name: longhorn
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names:
              - longhorn-system
      relabel_configs:
        - source_labels:
            - __meta_kubernetes_service_name
            - __meta_kubernetes_endpoint_port_name
          action: keep
          regex: longhorn-backend;manager

    # The two Pi-holes are standalone RPis (not k8s nodes), so scrape their
    # node_exporter (host health + the pihole_* HA textfile metrics) statically.
    # `node` mirrors the label k8s SD attaches to the cluster nodes' exporters,
    # so one dashboard variable can span all five hosts.
    - job_name: pihole
      static_configs:
        - targets: ["10.10.53.51:9100"]
          labels:
            instance: pihole-01
            node: pihole-01
        - targets: ["10.10.53.52:9100"]
          labels:
            instance: pihole-02
            node: pihole-02

  serverFiles:
    alerting_rules.yml:
      groups:
        # --- The alerting pipeline itself: if these break, every other alert
        #     goes silent without anyone noticing. ---
        - name: monitoring-pipeline
          rules:
            - alert: PrometheusTargetDown
              expr: up == 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Scrape target {{ $labels.job }} ({{ $labels.instance }}) is down — metrics/alerts from it are blind"

            - alert: PrometheusConfigReloadFailed
              expr: prometheus_config_last_reload_successful == 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Prometheus config reload failed on {{ $labels.instance }}"

            # Prometheus's own view of Alertmanager — if it discovers none, no
            # alert can be delivered (self-scraped, so always available).
            - alert: AlertmanagerUnreachable
              expr: prometheus_notifications_alertmanagers_discovered < 1
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: "Prometheus has no Alertmanager to send to — alerts will not be delivered"

        - name: pod-health
          rules:
            - alert: PodCrashLooping
              expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is in CrashLoopBackOff"

            - alert: PodOOMKilled
              expr: increase(kube_pod_container_status_restarts_total[5m]) > 0 and on(namespace, pod, container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
              for: 0m
              labels:
                severity: critical
              annotations:
                summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} was OOM killed"

        # --- Covers Deployments, StatefulSets and DaemonSets, so the likes of
        #     Loki/Alertmanager/Promtail/node-exporter aren't blind spots. ---
        - name: workload-health
          rules:
            - alert: DeploymentNotAvailable
              expr: kube_deployment_status_replicas_available == 0 and kube_deployment_spec_replicas > 0
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has no available replicas"

            - alert: StatefulSetNotReady
              expr: kube_statefulset_status_replicas_ready < kube_statefulset_replicas
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has unready replicas"

            - alert: DaemonSetNotScheduled
              expr: kube_daemonset_status_number_unavailable > 0
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} has unavailable pods"

        - name: node-health
          rules:
            - alert: NodeNotReady
              expr: kube_node_status_condition{condition="Ready",status="true"} == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "Node {{ $labels.node }} is not ready"

            - alert: NodeHighMemory
              expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.85
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Node {{ $labels.instance }} memory usage above 85%"

            # These boxes spike on transcodes/downloads, so a short window
            # yields noisy, non-actionable alerts.
            - alert: NodeHighCPU
              expr: 1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Node {{ $labels.instance }} CPU usage above 85% (sustained 15m)"

            # /mnt/r0 (qbt store on k3s-node-02) runs near-full by design so it's excluded from alerts.
            - alert: NodeDiskPressure
              expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint!="/mnt/r0"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint!="/mnt/r0"}) > 0.85
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Node {{ $labels.instance }} disk {{ $labels.mountpoint }} usage above 85%"

            - alert: NodeDiskCritical
              expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint!="/mnt/r0"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint!="/mnt/r0"}) > 0.90
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Node {{ $labels.instance }} disk {{ $labels.mountpoint }} usage above 90%"

            # Safety net for /mnt/r0, which is excluded from the alerts above.
            - alert: QbtStoreExhausted
              expr: (1 - node_filesystem_avail_bytes{mountpoint="/mnt/r0"} / node_filesystem_size_bytes{mountpoint="/mnt/r0"}) > 0.98
              for: 30m
              labels:
                severity: critical
              annotations:
                summary: "Node {{ $labels.instance }} qbt store /mnt/r0 usage above 98% — out of headroom"

            # Fires while a slow fill is still recoverable, ahead of the static
            # NodeDiskPressure threshold.
            - alert: NodeRootDiskFillingUp
              expr: |
                predict_linear(node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}[6h], 24*3600) < 0
                and node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.30
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "Node {{ $labels.instance }} root filesystem projected to fill within 24h"

        - name: storage-health
          rules:
            - alert: PVCAlmostFull
              expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.80
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} usage above 80%"

            - alert: PVCCritical
              expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.90
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} usage above 90%"

            # longhorn_volume_robustness: 1=healthy, 2=degraded (rebuilding,
            # reduced redundancy), 3=faulted (data unavailable).
            - alert: LonghornVolumeDegraded
              expr: longhorn_volume_robustness == 2
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Longhorn volume {{ $labels.volume }} is degraded (rebuilding / reduced redundancy)"

            - alert: LonghornVolumeFaulted
              expr: longhorn_volume_robustness == 3
              for: 0m
              labels:
                severity: critical
              annotations:
                summary: "Longhorn volume {{ $labels.volume }} is FAULTED — data unavailable"

            # Backups alert on state, never on failure events.
            #
            # Longhorn keeps every failure record long after the failure is
            # repaired: an Error Backup CR lives for `failed-backup-ttl` (24h), a
            # failed Job lives until the next failure evicts it
            # (`failedJobsHistoryLimit: 1`). A rule keyed on either one therefore
            # describes a condition that has already passed and cannot resolve
            # itself. The recurring job also retries a failed volume inside the
            # same run, so an attempt failure is usually repaired minutes later
            # and the record is all that survives.
            #
            # `longhorn_volume_last_backup_at` is the volume's `status.lastBackupAt`
            # — the newest *completed* backup. A successful retry moves it, a
            # failure never touches it, and a good run clears the alert on its own.
            # It is undocumented upstream, which ships no backup rules at all.
            #
            # Why a volume is behind is diagnosis, not detection, and the error
            # text exists only on the Backup CR: docs/storage-longhorn.md.
            #
            # Dailies run 01:00 local, so 30h flags one missed run without firing
            # during the window itself, and the warning stops at the 3d handover so
            # a volume in trouble is reported at one severity rather than two.
            #
            # `> 0` drops the volumes on longhorn-no-bkp, which never back up by
            # design and report a zero timestamp. It also hides a volume that has
            # never once backed up — reachable only by labelling one out of the
            # `default` recurring-job group, which nothing in this repo does. If a
            # second opt-out mechanism ever appears, select the volumes to alert on
            # by joining `kube_persistentvolumeclaim_info` on its `storageclass`
            # label instead.
            - alert: LonghornVolumeBackupStale
              expr: (time() - longhorn_volume_last_backup_at > 30 * 3600 < 3 * 24 * 3600) and longhorn_volume_last_backup_at > 0
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has no backup for {{ $value | humanizeDuration }} — one run skipped it"

            - alert: LonghornVolumeBackupMissing
              expr: (time() - longhorn_volume_last_backup_at > 3 * 24 * 3600) and longhorn_volume_last_backup_at > 0
              for: 15m
              labels:
                severity: critical
              annotations:
                summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has no backup for {{ $value | humanizeDuration }} — backups are broken, not merely late"

        # SMART health from smartctl-exporter (k3s-node-02: the DAS pair behind
        # /mnt/r0, plus the NVMe carrying Longhorn and /local).
        - name: disk-health
          rules:
            # Current HDDs: 60 °C max operating, 10-40 °C recommended.
            # 58 °C is where the DAS pair's accepted operating band ends. The
            # enclosure sits at 50-55 °C and its airflow is already at its
            # practical limit, so a threshold inside that band flaps across the
            # line for hours while describing a condition nobody will act on;
            # only a sustained shift toward the 60 °C hardware limit is news.
            # `avg_over_time` + `for` demands that shift be real rather than a
            # single hot sample, which is why no hysteresis wrapper is needed.
            - alert: DiskTemperatureHigh
              expr: avg_over_time(smartctl_device_temperature{device=~"sd.+",temperature_type="current"}[1h]) > 58
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "Disk {{ $labels.device }} at {{ $value | printf \"%.0f\" }}°C — sustained above 58°C, approaching the 60°C limit (check DAS airflow)"

            - alert: DiskTemperatureCritical
              expr: smartctl_device_temperature{device=~"sd.+",temperature_type="current"} > 60
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: "Disk {{ $labels.device }} at {{ $value }}°C — over its 60°C maximum operating temperature"

            # NVMe runs hotter by design, it throttles around
            # 80 °C, so it needs its own threshold rather than the HDD one.
            - alert: NvmeTemperatureHigh
              expr: smartctl_device_temperature{device=~"nvme.+",temperature_type="current"} > 70
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "NVMe {{ $labels.device }} at {{ $value }}°C — approaching its thermal throttle point"

            - alert: DiskSmartFailed
              expr: smartctl_device_smart_status == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Disk {{ $labels.device }} reports SMART overall-health FAILED"

            # `smartctl_device_attribute` is ATA-only, so these three match the
            # DAS drives and never the NVMe.
            - alert: DiskReallocatedSectors
              expr: smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"} > 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Disk {{ $labels.device }} has {{ $value }} reallocated sector(s) — plan a replacement"

            - alert: DiskPendingSectors
              expr: smartctl_device_attribute{attribute_name="Current_Pending_Sector",attribute_value_type="raw"} > 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Disk {{ $labels.device }} has {{ $value }} pending sector(s) — unreadable data"

            # The DAS hangs off a USB bridge, where a failing cable or bridge
            # shows up as CRC errors before it starts dropping the array.
            - alert: DiskCrcErrors
              expr: increase(smartctl_device_attribute{attribute_name="UDMA_CRC_Error_Count",attribute_value_type="raw"}[1h]) > 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Disk {{ $labels.device }} logged new UDMA CRC errors — suspect the USB cable or bridge"

            # NVMe equivalents of the wear signals above.
            - alert: NvmeMediaErrors
              expr: smartctl_device_media_errors > 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "NVMe {{ $labels.device }} reports {{ $value }} media/data integrity error(s)"

            - alert: NvmeCriticalWarning
              expr: smartctl_device_critical_warning > 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "NVMe {{ $labels.device }} raised a critical controller warning"

            # RAID 0 runs at its slowest member: when one drive throttles or
            # degrades, /mnt/r0 collapses in speed while the other sits idle
            # visible only per-drive, never in the md0 aggregate.
            #
            # Compares the pair against each other rather than against a fixed
            # latency: a heavy sequential burst puts BOTH drives near 60 ms and
            # 100% util while the array is healthy and fast, so any absolute
            # threshold cries wolf on it. A throttling drive instead runs
            # several times slower than its twin under the same command stream.
            # The 20 ms floor keeps an idle-time ratio (1 ms vs 4 ms) quiet, and
            # the 10 reads/s floor keeps a write-dominated window quiet: a drive
            # serving ~1 read/s averages whatever those few reads cost, which is
            # noise, not throttling.
            # k3s-server also has sda/sdb, hence the node selector.
            - alert: DasDiskLatencyImbalance
              expr: |
                (
                  rate(node_disk_read_time_seconds_total{node="k3s-node-02",device=~"sda|sdb"}[15m])
                  / rate(node_disk_reads_completed_total{node="k3s-node-02",device=~"sda|sdb"}[15m])
                )
                / on(node) group_left()
                min by(node) (
                  rate(node_disk_read_time_seconds_total{node="k3s-node-02",device=~"sda|sdb"}[15m])
                  / rate(node_disk_reads_completed_total{node="k3s-node-02",device=~"sda|sdb"}[15m])
                )
                > 3
                and
                (
                  rate(node_disk_read_time_seconds_total{node="k3s-node-02",device=~"sda|sdb"}[15m])
                  / rate(node_disk_reads_completed_total{node="k3s-node-02",device=~"sda|sdb"}[15m])
                ) > 0.02
                and
                rate(node_disk_reads_completed_total{node="k3s-node-02",device=~"sda|sdb"}[15m]) > 10
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: "DAS drive {{ $labels.device }} is {{ $value | printf \"%.1f\" }}x slower per read than its RAID 0 twin — throttling or degrading; /mnt/r0 runs at its slowest drive"

        - name: cluster-health
          rules:
            # ingress-nginx runs in the kube-extra namespace, not monitoring.
            - alert: IngressDown
              expr: kube_deployment_status_replicas_available{namespace="kube-extra",deployment="ingress-nginx-controller"} < 1
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "No ingress-nginx replicas available"

            - alert: CertExpiringSoon
              expr: certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 7 days"

            # Catches renewal FAILURES early (e.g. DNS-01 broken) instead of
            # waiting until the 7-day expiry window.
            - alert: CertificateNotReady
              expr: certmanager_certificate_ready_status{condition="True"} == 0
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready (renewal may be failing)"

        # qui's Prometheus exporter is the only view of a qBittorrent WebUI that
        # is up but not serving the API — the pod stays Ready through that, so
        # none of the pod/deployment rules above see it.
        - name: media-health
          rules:
            # A gluetun VPN restart (the vpn-port-healer path) takes the WebUI
            # with it for a minute or two, so a short window would page on
            # routine port-forward recovery.
            - alert: QbtInstanceUnreachable
              expr: qbittorrent_instance_connection_status == 0
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "qui cannot reach qBittorrent instance {{ $labels.instance_name }} — WebUI wedged, credentials rejected, or the instance is disabled in qui"

        # Pi-hole HA (two standalone RPis sharing keepalived VIPs 10.10.53.53 / ::53).
        # Host CPU/mem/disk are already covered by the generic node-health group
        # above (the Pis now expose node_exporter); these are the HA-specific signals.
        - name: pihole-ha
          rules:
            # No node holds a VIP → the whole network has no resolver. (A normal
            # failover flips the holder within seconds, so 1m avoids flapping.)
            - alert: PiholeNoActiveVIP
              expr: sum by (family) (pihole_holds_vip) == 0
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "No Pi-hole holds the {{ $labels.family }} DNS VIP — network DNS is down"

            - alert: PiholeSplitBrain
              expr: sum by (family) (pihole_holds_vip) > 1
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "Both Pi-holes claim the {{ $labels.family }} VIP (split-brain / IP conflict)"

            # node_exporter unreachable: host down or off the network.
            - alert: PiholeNodeDown
              expr: up{job="pihole"} == 0
              for: 3m
              labels:
                severity: warning
              annotations:
                summary: "Pi-hole node {{ $labels.instance }} is unreachable (node_exporter down)"

            # FTL process up but not answering — the bound-but-wedged failure mode.
            - alert: PiholeResolverWedged
              expr: pihole_dns_up == 0
              for: 2m
              labels:
                severity: warning
              annotations:
                summary: "Pi-hole {{ $labels.instance }} is not answering DNS (FTL wedged?) — restart pihole-FTL"

            # Standby is serving and hasn't handed back — primary is down or not preempting.
            - alert: PiholeFailoverActive
              expr: pihole_holds_vip{instance="pihole-02", family="ipv4"} == 1
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Pi-hole standby (pihole-02) is serving — pihole-01 is down or not preempting"

            - alert: PiholeKeepalivedDown
              expr: pihole_keepalived_up == 0
              for: 3m
              labels:
                severity: warning
              annotations:
                summary: "keepalived is not running on {{ $labels.instance }} — that node can't fail over"

  prometheus-pushgateway:
    enabled: false

  configmapReload:
    prometheus:
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi

  server:
    retention: 15d
    # Hard guardrail so the TSDB self-prunes before the 10Gi PVC fills, even if
    # ingestion grows — whichever of time/size limits hits first wins.
    retentionSize: "7GB"
    resources:
      requests:
        cpu: 100m
        memory: 1280Mi
      limits:
        cpu: 500m
        memory: 3Gi
    persistentVolume:
      enabled: true
      storageClass: longhorn-no-bkp # disposable metrics TSDB — not backed up
      size: 10Gi

  prometheus-node-exporter:
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 1
        memory: 64Mi

  kube-state-metrics:
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 100m
        memory: 192Mi
