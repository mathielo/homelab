---
# Recurring snapshot + backup jobs for all Longhorn volumes.
# Every volume is auto-enrolled via the `default` group label Longhorn
# assigns on creation. Backups land on the UNAS-4 NFS target.
# Exception: volumes provisioned from the `longhorn-no-bkp` StorageClass
# are pinned to the `none` group and so are excluded from every job
# below — used for disposable monitoring metrics/logs.
#
# Retention is tiered (GFS) so silent corruption discovered late is still
# recoverable: daily (2 weeks) + weekly (2 months) + monthly (6 months).
# Snapshots are on-cluster, fast, same-disk — for quick logical rollback.
#
# Cron is evaluated in the k3s-server node's local time (Europe/Stockholm):
# Longhorn renders each job into a k8s CronJob with no `timeZone`, so it
# inherits the controller-manager's clock, not UTC.
#
# The three backup jobs sit an hour apart because `concurrency` is per-job,
# not global — jobs that overlap each open their own serialized NFS stream,
# and together they outrun the soft mount's timeout budget and fail with EIO.
# 01:00-03:00 is the quietest stretch on the NAS: SAB resumes at 22:00 and
# drains its queue through roughly 00:30, and 03:00 onward starts climbing
# again toward the 09:00-10:00 daytime peak.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-6h
  namespace: longhorn-system
spec:
  task: snapshot
  cron: "0 */6 * * *"
  retain: 8 # ~2 days of 6-hourly points
  concurrency: 2
  groups:
    - default
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  task: backup
  cron: "0 1 * * *"
  retain: 14 # 2 weeks
  concurrency: 1 # serialize NFS writes — 1 GbE + low-RAM NAS chokes on parallel backup streams
  groups:
    - default
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-backup
  namespace: longhorn-system
spec:
  task: backup
  cron: "0 2 * * 0" # Sundays
  retain: 8 # ~2 months
  concurrency: 1
  groups:
    - default
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: monthly-backup
  namespace: longhorn-system
spec:
  task: backup
  cron: "0 3 1 * *" # 1st of month
  retain: 6 # 6 months
  concurrency: 1
  groups:
    - default
