app-template:
  controllers:
    bazarr:
      containers:
        bazarr:
          image:
            repository: ghcr.io/hotio/bazarr
            tag: release-1.6.0
          env:
            PUID: "1000"
            PGID: "1000"
            TZ: Europe/Stockholm
          resources:
            requests:
              cpu: 10m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi

  service:
    bazarr:
      controller: bazarr
      ports:
        http:
          port: 6767

  ingress:
    bazarr:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: bazarr.m6o.dev
          paths:
            - path: /
              service:
                identifier: bazarr
                port: http
      tls:
        - hosts:
            - bazarr.m6o.dev
          secretName: bazarr-tls

  persistence:
    config:
      existingClaim: bazarr-config-lh
      globalMounts:
        - path: /config
    media:
      type: persistentVolumeClaim
      existingClaim: media-data
      globalMounts:
        - path: /media
