app-template:
  # Pinned to k3s-node-02 so the disk-guard check can read the DAS (/r0) free
  # space directly via df — same node the qbt-* instances and the DAS live on.
  defaultPodOptions:
    nodeSelector:
      kubernetes.io/hostname: k3s-node-02

  controllers:
    autobrr:
      containers:
        autobrr:
          image:
            repository: ghcr.io/autobrr/autobrr
            tag: v1.80.0
          env:
            TZ: Europe/Stockholm
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
        # Inspects each grabbed .torrent for .rar files so a filter's External
        # check can reject packed releases (announce data can't reveal this).
        # Reached in-pod at http://localhost:8080 — no Service/ingress needed.
        no-rars:
          image:
            repository: ghcr.io/unhelpful7417/autobrr-no-rars
            tag: api@sha256:1f498516018b28fced48663f8281f59fcb439b6a74561119598ef7420893083d
          env:
            TZ: Europe/Stockholm
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
  service:
    autobrr:
      controller: autobrr
      ports:
        http:
          port: 7474

  ingress:
    autobrr:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: autobrr.m6o.dev
          paths:
            - path: /
              service:
                identifier: autobrr
                port: http
      tls:
        - hosts:
            - autobrr.m6o.dev
          secretName: autobrr-tls

  persistence:
    config:
      existingClaim: autobrr-config-lh
      globalMounts:
        - path: /config
    disk-guard:
      type: configMap
      identifier: disk-guard
      # Whole-volume mount + defaultMode so the script is executable (subPath
      # mounts ignore mode bits), letting autobrr exec /scripts/disk-guard.sh
      # directly.
      defaultMode: 0755
      advancedMounts:
        autobrr:
          autobrr:
            - path: /scripts
    # DAS (/r0) mounted read-only so disk-guard.sh can df it directly — no
    # Prometheus/qBt dependency. If the DAS detaches, df falls back to node-02's
    # root fs (well under the threshold) → grabs auto-skip, which is correct.
    r0:
      type: hostPath
      hostPath: /mnt/r0
      hostPathType: Directory
      advancedMounts:
        autobrr:
          autobrr:
            - path: /r0
              readOnly: true

  configMaps:
    disk-guard:
      data:
        # Disk-space gate, exec'd by autobrr as an External "Exec" check
        # (/scripts/disk-guard.sh): exit 0 lets the grab through, non-zero skips
        # it. Reads /r0 (the DAS) free space directly via df — no qBt creds, no
        # Prometheus — so autobrr stops grabbing before the DAS fills and qBt's
        # move-on-complete starts failing. Threshold defaults to 500 GiB (covers
        # in-flight downloads still staged on NVMe), overridable per filter via
        # the first exec argument. Fail-open if df returns nothing.
        disk-guard.sh: |
          #!/bin/sh
          MIN_FREE_GIB=${1:-500}
          free_kb=$(df -P /r0 | awk 'NR==2{print $4}')
          [ -z "$free_kb" ] && exit 0
          [ "$free_kb" -ge "$((MIN_FREE_GIB * 1048576))" ]
