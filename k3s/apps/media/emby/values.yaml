# Emby Server with Intel Quick Sync (VA-API) hardware transcoding.
#
# Pinned to k3s-node-02 (M70q Gen 5) for its Intel UHD Graphics 770 iGPU.
# The Intel device plugin exposes gpu.intel.com/i915 so the pod can request a
# GPU slot the same way Plex requests amd.com/gpu; no manual /dev/dri
# hostPath or supplementalGroups handling needed.
#
# Post-deploy:
#   1. Open https://emby.hl.mathielo.com and complete the setup wizard
#   2. Add libraries: Movies → /media/lib/movies, Shows → /media/lib/shows
#   3. Settings → Transcoding → Hardware acceleration: VAAPI, device /dev/dri/renderD128
#   4. Settings → Server → Network — required for iOS/AndroidTV apps to connect.
#      Without these, Emby advertises the in-pod IP (10.42.x.x) and the public
#      WAN IP to clients, neither of which is reachable from LAN devices.
#      The Public https port = 443 override is critical: Emby's clients default
#      to port 8920 (Emby's internal HTTPS port) which is NOT exposed by the
#      ingress — the TCP connection times out before any HTTP request is sent,
#      so nothing shows up in nginx-ingress logs.
#        - LAN networks:           10.10.0.0/16, 10.42.0.0/16
#        - External domain:        https://emby.hl.mathielo.com
#        - Public http port number:  80
#        - Public https port number: 443
#        - Read proxy headers:     Yes
#        - Secure connection mode: Handled by reverse proxy
#        - Enable automatic port mapping (UPnP): off
app-template:
  defaultPodOptions:
    nodeSelector:
      kubernetes.io/hostname: k3s-node-02

  controllers:
    emby:
      containers:
        emby:
          image:
            repository: lscr.io/linuxserver/emby
            tag: 4.9.5.0-ls281
          env:
            PUID: "1000"
            PGID: "1000"
            TZ: Europe/Stockholm
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 6Gi
              gpu.intel.com/i915: "1"

  service:
    emby:
      controller: emby
      ports:
        http:
          port: 8096

  ingress:
    emby:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-buffering: "off"
      hosts:
        - host: emby.hl.mathielo.com
          paths:
            - path: /
              service:
                identifier: emby
                port: http
      tls:
        - hosts:
            - emby.hl.mathielo.com
          secretName: emby-hl-tls

  persistence:
    config:
      existingClaim: emby-config-lh
      globalMounts:
        - path: /config
    transcode:
      type: hostPath
      hostPath: /mnt/nvme/local/emby
      hostPathType: DirectoryOrCreate
      globalMounts:
        - path: /transcode
    media:
      type: persistentVolumeClaim
      existingClaim: media-data
      globalMounts:
        - path: /media
          readOnly: true
