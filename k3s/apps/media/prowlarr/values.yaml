app-template:
  controllers:
    prowlarr:
      containers:
        prowlarr:
          image:
            repository: ghcr.io/hotio/prowlarr
            tag: latest
          env:
            PUID: "1000"
            PGID: "1000"
            TZ: Europe/Amsterdam
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

  service:
    prowlarr:
      controller: prowlarr
      ports:
        http:
          port: 9696

  ingress:
    prowlarr:
      className: nginx
      hosts:
        - host: prowlarr.hl
          paths:
            - path: /
              service:
                identifier: prowlarr
                port: http

  persistence:
    config:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 1Gi
      storageClass: local-path
      globalMounts:
        - path: /config
