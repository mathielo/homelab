app-template:
  controllers:
    radarr:
      containers:
        radarr:
          image:
            repository: ghcr.io/hotio/radarr
            tag: release-6.2.1.10461
          env:
            PUID: "1000"
            PGID: "1000"
            TZ: Europe/Stockholm
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi

  service:
    radarr:
      controller: radarr
      ports:
        http:
          port: 7878

  ingress:
    radarr:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: radarr.m6o.dev
          paths:
            - path: /
              service:
                identifier: radarr
                port: http
      tls:
        - hosts:
            - radarr.m6o.dev
          secretName: radarr-tls

  persistence:
    config:
      existingClaim: radarr-config-lh
      globalMounts:
        - path: /config
    media:
      type: persistentVolumeClaim
      existingClaim: media-data
      globalMounts:
        - path: /media
