# Plex Media Server with AMD VA-API hardware transcoding.
#
# Pinned to k3s-server (M75q-1) for its Ryzen 5 PRO 3400GE + Radeon Vega 10.
# Hardware transcoding requires Plex Pass — enable in Settings → Transcoder
# after initial setup.
#
# Post-deploy:
#   1. Open https://plex.m6o.dev and complete the setup wizard
#   2. Add libraries: Movies → /media/library/movies, Shows → /media/library/shows
#   3. Enable hardware transcoding in Settings → Transcoder
app-template:
  defaultPodOptions:
    nodeSelector:
      kubernetes.io/hostname: k3s-server

  controllers:
    plex:
      containers:
        plex:
          image:
            repository: ghcr.io/hotio/plex
            tag: release-1.43.2.10687-563d026ea
          env:
            PUID: "1000"
            PGID: "1000"
            TZ: Europe/Stockholm
            PLEX_ADVERTISE_URL: "https://plex.m6o.dev:443"
            # PLEX_CLAIM_TOKEN injected via values.sops.yaml
            # Generate at https://plex.tv/claim — expires in ~4 minutes!
            # Only needed for initial server claim; can be removed after first boot.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 6Gi
              # AMD VA-API hardware transcoding (Radeon Vega 10 on k3s-server).
              # Requires Plex Pass + enabling "Use hardware acceleration" in
              # Settings → Transcoder after initial setup.
              amd.com/gpu: "1"

  service:
    plex:
      controller: plex
      ports:
        http:
          port: 32400

  ingress:
    plex:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-buffering: "off"
      hosts:
        - host: plex.m6o.dev
          paths:
            - path: /
              service:
                identifier: plex
                port: http
      tls:
        - hosts:
            - plex.m6o.dev
          secretName: plex-tls

  persistence:
    config:
      existingClaim: plex-config-lh
      globalMounts:
        - path: /config
    transcode:
      type: hostPath
      hostPath: /mnt/ssd/local/plex
      hostPathType: DirectoryOrCreate
      globalMounts:
        - path: /transcode
    media:
      type: persistentVolumeClaim
      existingClaim: media-data
      globalMounts:
        - path: /media
          readOnly: true
