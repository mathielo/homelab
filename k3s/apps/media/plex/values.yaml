# Plex Media Server with Intel Quick Sync hardware transcoding.
#
# Pinned to k3s-node-02 (M70q Gen 5) for its Intel i5-14500T iGPU (i915).
# Hardware transcoding requires Plex Pass — enable in Settings → Transcoder
# after initial setup.
#
# Post-deploy:
#   1. Open https://plex.m6o.dev and complete the setup wizard
#   2. Add libraries: Movies → /media/library/movies, Shows → /media/library/shows
#   3. Enable hardware transcoding in Settings → Transcoder
app-template:
  defaultPodOptions:
    nodeSelector:
      kubernetes.io/hostname: k3s-node-02

  controllers:
    plex:
      initContainers:
        init-transcode:
          image:
            repository: busybox
            tag: "1.38.0"
          command:
            - sh
            - -c
            - chown 1000:1000 /transcode
          securityContext:
            runAsUser: 0

      containers:
        plex:
          image:
            repository: ghcr.io/hotio/plex
            tag: release-1.43.3.10896-cb3ebc72d
          env:
            PUID: "1000"
            PGID: "1000"
            TZ: Europe/Stockholm
            PLEX_ADVERTISE_URL: "https://plex.m6o.dev:443"
            # PLEX_CLAIM_TOKEN injected via values.sops.yaml
            # Generate at https://plex.tv/claim — expires in ~4 minutes!
            # Only needed for initial server claim; can be removed after first boot.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 6Gi
              # Intel Quick Sync hardware transcoding (i5-14500T on k3s-node-02).
              # Requires Plex Pass + enabling "Use hardware acceleration" in
              # Settings → Transcoder after initial setup.
              gpu.intel.com/i915: "1"

  service:
    plex:
      controller: plex
      ports:
        http:
          port: 32400

  ingress:
    plex:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-buffering: "off"
      hosts:
        - host: plex.m6o.dev
          paths:
            - path: /
              service:
                identifier: plex
                port: http
      tls:
        - hosts:
            - plex.m6o.dev
          secretName: plex-tls

  persistence:
    config:
      existingClaim: plex-config-lh
      globalMounts:
        - path: /config
    transcode:
      type: hostPath
      hostPath: /mnt/nvme/local/plex
      hostPathType: DirectoryOrCreate
      globalMounts:
        - path: /transcode
    media:
      type: persistentVolumeClaim
      existingClaim: media-data
      globalMounts:
        - path: /media
          readOnly: true
