# qbt-br: Brazil ProtonVPN exit.
# Stacked on top of values-common.yaml + values-br.sops.yaml.
app-template:
  controllers:
    main:
      initContainers:
        gluetun:
          env:
            SERVER_COUNTRIES: Brazil

      containers:
        main:
          # Overrides the request in values-common.yaml
          resources:
            requests:
              memory: 1280Mi

  ingress:
    main:
      hosts:
        - host: br.qbt.m6o.dev
          paths:
            - path: /
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - br.qbt.m6o.dev
          secretName: qbt-br-tls

  persistence:
    config:
      existingClaim: qbt-br-config-lh
    local:
      hostPath: /mnt/nvme/local/qbt-br
