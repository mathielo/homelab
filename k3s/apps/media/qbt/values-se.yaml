# qbt-se: Sweden ProtonVPN exit (separate WG profile from the legacy qbittorrent instance).
# Stacked on top of values-common.yaml + values-se.sops.yaml.
app-template:
  controllers:
    main:
      initContainers:
        gluetun:
          env:
            SERVER_COUNTRIES: Sweden
            SERVER_NAMES: "SE#178,SE#221,SE#274,SE#321,SE#378"

      containers:
        main:
          # Overrides the request in values-common.yaml
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi

  ingress:
    main:
      hosts:
        - host: se.qbt.m6o.dev
          paths:
            - path: /
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - se.qbt.m6o.dev
          secretName: qbt-se-tls

  persistence:
    config:
      existingClaim: qbt-se-config-lh
    local:
      hostPath: /mnt/nvme/local/qbt-se
