# qbt-mam: dedicated MyAnonaMouse instance (on values-common.yaml + values-mam.sops.yaml).
#
# Pinned to a fixed set of Stockholm ProtonVPN servers to keep the egress ASN
# predictable for MAM's ASN-locked seedbox session. Proton's egress ASN differs from
# the WireGuard endpoint ASN and varies across the set (SE#274 -> AS212238 Datacamp,
# SE#321 -> AS208172 Proton AG), so the MAM session is ASN-locked to BOTH; a new
# egress ASN would show as an ASN mismatch in the mam sidecar logs.
# Names must match Gluetun's embedded list (v3.41.1), not the ProtonVPN app's; all are
# WireGuard + port-forward (chart sets PORT_FORWARD_ONLY=on).
app-template:
  controllers:
    main:
      initContainers:
        gluetun:
          env:
            SERVER_COUNTRIES: Sweden
            SERVER_NAMES: "SE#178,SE#221,SE#274,SE#321,SE#378"

      containers:
        main:
          # Overrides the defaults in values-common.yaml.
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 2Gi

        # Keeps MAM's seedbox IP current via dynamicSeedbox.php from inside the VPN
        # netns. MAM rotates the mam_id on every accepted call and invalidates the
        # previous one, so the cookie jar on the config PVC — not MAM_ID — is the live
        # credential; MAM_ID only bootstraps a jar that does not exist yet, and is spent
        # the moment it works. Losing the jar to anything short of a real session
        # rejection is therefore unrecoverable without a new mam_id, which is why the
        # jar is written to a scratch file and promoted only on success, and why the
        # 1/hour rate limit and the IP/ASN lock mismatches get their own cases instead
        # of falling into the reject branch. Only an accepted call spends a credential,
        # so a rejected seed leaves MAM_ID reusable and is safe to retry.
        # https://www.myanonamouse.net/api/endpoint.php/3/json/dynamicSeedbox.php
        mam:
          image:
            repository: curlimages/curl
            tag: "8.22.0"
          command:
            - /bin/sh
            - -c
            - |
              set -u
              JAR=/config/mam/cookies.txt
              URL=https://t.myanonamouse.net/json/dynamicSeedbox.php
              mkdir -p /config/mam
              seeded=0
              while true; do
                if [ -s "$JAR" ]; then
                  resp=$(curl -sS -c "$JAR.new" -b "$JAR" "$URL")
                else
                  resp=$(curl -sS -c "$JAR.new" -b "mam_id=$MAM_ID" "$URL")
                  seeded=1
                fi
                echo "[mam] $(date -u +%FT%TZ) ${resp:-<no response>}"
                case "$(printf %s "$resp" | tr -d ' ')" in
                  *'"Success":true'*)
                    mv "$JAR.new" "$JAR"; seeded=0; sleep 3900 ;;   # ok — keep rotated jar, hold 1/hr limit
                  *Lastchangetoorecent*)
                    rm -f "$JAR.new"; sleep 900 ;;                  # 429 — jar still valid, wait out the window
                  *mismatch*)
                    rm -f "$JAR.new"
                    echo "[mam] session locked to another IP/ASN — widen the lock on MAM or move the exit into it"
                    sleep 900 ;;                                    # credential is fine, the exit is wrong
                  *'"Success":false'*)
                    rm -f "$JAR.new" "$JAR"
                    if [ "$seeded" = 1 ]; then
                      echo "[mam] MAM_ID rejected — put a fresh mam_id in values-mam.sops.yaml"
                      sleep 3600
                    else
                      sleep 60
                    fi ;;
                  *)
                    rm -f "$JAR.new"; sleep 30 ;;                   # no response (startup/DNS/blip) — retry soon
                esac
              done
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi

  ingress:
    main:
      hosts:
        - host: mam.qbt.m6o.dev
          paths:
            - path: /
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - mam.qbt.m6o.dev
          secretName: qbt-mam-tls

  persistence:
    config:
      existingClaim: qbt-mam-config-lh
    local:
      hostPath: /mnt/nvme/local/qbt-mam
