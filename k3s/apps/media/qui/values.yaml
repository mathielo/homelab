app-template:
  defaultPodOptions:
    nodeSelector:
      kubernetes.io/hostname: k3s-node-02

  controllers:
    qui:
      containers:
        qui:
          image:
            repository: ghcr.io/autobrr/qui
            tag: v1.19.0
          env:
            TZ: Europe/Stockholm
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

  service:
    qui:
      controller: qui
      ports:
        http:
          port: 7476

  ingress:
    qui:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: qui.hl.mathielo.com
          paths:
            - path: /
              service:
                identifier: qui
                port: http
      tls:
        - hosts:
            - qui.hl.mathielo.com
          secretName: qui-hl-tls

  persistence:
    config:
      existingClaim: qui-config-lh
      globalMounts:
        - path: /config
    media:
      type: persistentVolumeClaim
      existingClaim: media-data
      globalMounts:
        - path: /media
          readOnly: true
    r0:
      type: hostPath
      hostPath: /mnt/r0
      hostPathType: DirectoryOrCreate
      globalMounts:
        - path: /r0
