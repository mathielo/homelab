app-template:
  defaultPodOptions:
    nodeSelector:
      kubernetes.io/hostname: k3s-node-02
    # Run as the same uid/gid as the qbt-* instances (hotio PUID/PGID 1000) so
    # cross-seed hardlinks/dirs qui creates under /r0/cross-seed are owned by
    # the same PUID
    # OnRootMismatch skips the recursive chown when /config's root already has the
    # right ownership — without it kubelet walks every file on each start, which
    # holds the pod in ContainerCreating for minutes.
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

  controllers:
    qui:
      containers:
        qui:
          image:
            repository: ghcr.io/autobrr/qui
            tag: v1.27.0
          env:
            TZ: Europe/Stockholm
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi

  service:
    qui:
      controller: qui
      ports:
        http:
          port: 7476

  ingress:
    qui:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/proxy-body-size: 8m
        # Increase nginx timeout to allow for bulky operations
        nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      hosts:
        - host: qui.m6o.dev
          paths:
            - path: /
              service:
                identifier: qui
                port: http
      tls:
        - hosts:
            - qui.m6o.dev
          secretName: qui-tls

  persistence:
    config:
      existingClaim: qui-config-lh
      globalMounts:
        - path: /config
    media:
      type: persistentVolumeClaim
      existingClaim: media-data
      globalMounts:
        - path: /media
          readOnly: true
    r0:
      type: hostPath
      hostPath: /mnt/r0
      hostPathType: DirectoryOrCreate
      globalMounts:
        - path: /r0
