# SABnzbd with Gluetun VPN kill-switch sidecar (ProtonVPN / WireGuard).
#
# Network architecture:
#   - Gluetun runs as a native k8s sidecar (initContainer with restartPolicy: Always).
#     Starts and becomes Ready before SABnzbd, guaranteeing VPN+DNS are healthy first.
#   - SABnzbd shares Gluetun's network namespace automatically (same pod).
#   - All SABnzbd traffic exits through the ProtonVPN WireGuard tunnel.
#   - FIREWALL_OUTBOUND_SUBNETS allows cluster-internal traffic (DNS, APIs)
#     to bypass the VPN so in-cluster service discovery keeps working.
app-template:
  defaultPodOptions:
    nodeSelector:
      kubernetes.io/hostname: k3s-node-01

  controllers:
    sabnzbd:
      strategy: Recreate
      pod:
        # The chart sorts containers by name, which would put article-check first
        # and make it kubectl's default.
        annotations:
          kubectl.kubernetes.io/default-container: sabnzbd
        # Override k8s DNS to fix resolution inside Gluetun VPN.
        # Default dnsPolicy (ClusterFirst) injects ndots:5 + search domains,
        # which causes musl's resolver to exhaust search suffixes through
        # Gluetun's DoT DNS before trying the bare hostname — failing with
        # "Name has no usable address". Using dnsPolicy=None with a manual
        # config pointing to Gluetun's local DNS avoids this entirely.
        dnsPolicy: None
        dnsConfig:
          nameservers:
            - 127.0.0.1
          options:
            - name: ndots
              value: "0"
        # Shelfarr hands SABnzbd Prowlarr download URLs (addurl) to fetch itself.
        # prowlarr.m6o.dev only exists in the Pi-hole split-DNS, which Gluetun's
        # public upstream can't see, so it is pinned to the ingress VIP here.
        hostAliases:
          - ip: 10.10.50.3
            hostnames:
              - prowlarr.m6o.dev
      initContainers:
        # Runs once before gluetun/sabnzbd start. Seeds sabnzbd.ini with the
        # host whitelist so the UI is accessible via the ingress hostname on
        # first boot. Skipped on subsequent starts (file already exists).
        # The article-check subPath is created here because kubelet would create
        # it root-owned, which that container's uid 1000 cannot write to.
        config-init:
          image:
            repository: busybox
            tag: "1.38.0"
          command:
            - sh
            - -c
            - |
              if [ ! -f /config/sabnzbd.ini ]; then
                printf '[misc]\nhost_whitelist = sabnzbd.m6o.dev\n' > /config/sabnzbd.ini
              fi
              mkdir -p /config/article-check
              chown 1000:1000 /config/article-check

        # Gluetun VPN kill-switch as a native k8s sidecar (k8s >= 1.29).
        # restartPolicy: Always promotes this initContainer to a sidecar:
        #   - Starts before main containers (SABnzbd waits on its startup probe)
        #   - Restarts independently on liveness failure
        #   - Terminates AFTER main containers on pod shutdown
        #
        # The startup probe ensures SABnzbd doesn't start until gluetun's
        # VPN tunnel and DNS forwarder are both confirmed healthy. Without this
        # ordering guarantee, SABnzbd fires DNS queries while gluetun's DoT
        # resolver is still initialising — causing the forwarder to fall back to
        # 127.0.0.1:53 (itself), which creates a self-sustaining DNS loop that
        # pegs gluetun's CPU at its limit.
        #
        # The postStart hook cleans up stale WireGuard IP rules left by previous
        # pods — fixes "adding IPv6 rule: file exists" on Kubernetes.
        # See: https://github.com/qdm12/gluetun/issues/2471
        gluetun:
          image:
            repository: ghcr.io/qdm12/gluetun
            tag: v3.41.3
          restartPolicy: Always
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          probes:
            # The startup probe is what holds SABnzbd back — for a native
            # sidecar, kubelet gates the next container on startupProbe, not
            # readinessProbe. Readiness alone only affects pod-level Ready, so
            # without this both start in the same second.
            startup:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /gluetun-entrypoint
                    - healthcheck
                initialDelaySeconds: 5
                periodSeconds: 5
                failureThreshold: 12
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /gluetun-entrypoint
                    - healthcheck
                initialDelaySeconds: 5
                periodSeconds: 5
                failureThreshold: 12
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /gluetun-entrypoint
                    - healthcheck
                initialDelaySeconds: 30
                periodSeconds: 30
                failureThreshold: 3
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Clean up stale WireGuard IP rules left by previous pods.
                    # See: https://github.com/qdm12/gluetun/issues/2471
                    (ip rule del table 51820; ip -6 rule del table 51820) 2>/dev/null || true
          env:
            VPN_SERVICE_PROVIDER: protonvpn
            VPN_TYPE: wireguard
            # WIREGUARD_PRIVATE_KEY and WIREGUARD_ADDRESSES injected via values.sops.yaml
            SERVER_COUNTRIES: Sweden
            # Allow traffic to k3s pod CIDR + service CIDR to bypass the VPN tunnel.
            # This keeps in-cluster calls (SABnzbd → Sonarr, DNS, etc.) working.
            # The ingress VIP is for the prowlarr.m6o.dev hostAliases entry.
            FIREWALL_OUTBOUND_SUBNETS: "10.42.0.0/16,10.43.0.0/16,10.10.50.3/32"
            DNS_UPSTREAM_RESOLVERS: "cloudflare,quad9"
            # DoT off makes gluetun skip its local DNS proxy and point
            # /etc/resolv.conf straight at the upstream resolver. With the proxy
            # running, its own forwarder resolves via the system resolver, which
            # the pod's dnsConfig sets to 127.0.0.1 — the proxy itself. Any name
            # it cannot answer then recurses until a 2s timeout; a repeated
            # "[::]" lookup at ~130/s held ~8k sockets open and pinned CPU at the
            # limit. Queries still leave through the tunnel, so they stay private.
            DOT: "off"
          resources:
            requests:
              cpu: 250m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 1Gi

      containers:
        sabnzbd:
          image:
            repository: ghcr.io/hotio/sabnzbd
            tag: release-5.1.3
          env:
            PUID: "1000"
            PGID: "1000"
            TZ: Europe/Stockholm
          resources:
            # k3s-node-01 has 4 cores, so the CPU request is kept modest to leave
            # schedulable capacity; the unset CPU limit is what covers the spikes.
            requests:
              cpu: 500m
              memory: 320Mi
            # Sabnzbd can spike CPU and RAM usage in post-processing and verification/repair jobs.
            limits:
              memory: 6Gi

        # Shares Gluetun's network namespace, so NNTP and API traffic stay in the
        # tunnel. Same image as SABnzbd because it already carries bash, curl, jq
        # and unzip, and is musl-based, hence the musl penne build.
        article-check:
          image:
            repository: ghcr.io/hotio/sabnzbd
            tag: release-5.1.3
          command:
            - /bin/bash
            - /scripts/article-check.sh
          env:
            HOME: /tmp
            # The image points these at /config, which this container can't write to.
            XDG_CONFIG_HOME: /tmp/.config
            XDG_CACHE_HOME: /tmp/.cache
            # Renovate bumps the version only: update PENNE_SHA256 in the same PR.
            PENNE_VERSION: "0.7.0"
            PENNE_SHA256: 463a6bc1acf7b9d17962eb068136b3ef660478154d5fd9a6574f86ba5bc106be
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 1Gi

  secrets:
    article-check:
      enabled: true
      # Out of the pod checksum so a sops edit doesn't restart SABnzbd.
      includeInChecksum: false
      # stringData (script-url, script-sha256, api-key, config.toml) supplied by
      # values.sops.yaml
      stringData: {}

  configMaps:
    article-check:
      data:
        article-check.sh: |
          #!/bin/bash
          # Runs one cycle every 10 min while /state/enabled exists. The sleep sits
          # between whole cycles so disabling never abandons one in flight. A cycle's
          # failure is not fatal here: a dead container takes the pod out of Ready,
          # and SABnzbd's Service with it. Secret values are read as files on every
          # cycle so a sops edit applies without a restart. The client script is only
          # downloaded when the local copy doesn't match the pinned hash.
          export PATH="/tmp/bin:$PATH"
          umask 077
          trap 'exit 0' TERM
          mkdir -p /tmp/bin "$HOME/.config/penne"
          ln -sf /secret/config.toml "$HOME/.config/penne/config.toml"

          while true; do
            if [ -f /state/enabled ]; then
              if [ ! -x /tmp/bin/penne ]; then
                curl -fsSL --max-time 300 -o /tmp/penne.download \
                  "https://github.com/franzopl/pesto/releases/download/penne-v${PENNE_VERSION}/penne-linux-x86_64-musl" \
                  && echo "${PENNE_SHA256}  /tmp/penne.download" | sha256sum -c - \
                  && chmod +x /tmp/penne.download \
                  && mv /tmp/penne.download /tmp/bin/penne
              fi
              pin="$(cat /secret/script-sha256)  /tmp/remote-check.download"
              echo "$pin" | sha256sum -c --status - 2>/dev/null \
                || curl -fsSL --max-time 60 -o /tmp/remote-check.download "$(cat /secret/script-url)"
              if echo "$pin" | sha256sum -c - \
                && sed -E "s|^([A-Z_]+_API_KEY)=\"YOUR_API_KEY\"\$|\1=\"$(cat /secret/api-key)\"|" \
                  /tmp/remote-check.download > /tmp/remote-check.sh; then
                bash /tmp/remote-check.sh &
                wait $!
              fi
            fi
            sleep 600 &
            wait $!
          done

  service:
    sabnzbd:
      controller: sabnzbd
      ports:
        http:
          port: 8080

  ingress:
    sabnzbd:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: sabnzbd.m6o.dev
          paths:
            - path: /
              service:
                identifier: sabnzbd
                port: http
      tls:
        - hosts:
            - sabnzbd.m6o.dev
          secretName: sabnzbd-tls

  # advancedMounts rather than globalMounts, which reach every container: only
  # SABnzbd gets sabnzbd.ini and the library, and article-check gets only its own
  # subPath of the config volume.
  persistence:
    config:
      existingClaim: sabnzbd-config-lh
      advancedMounts:
        sabnzbd:
          config-init:
            - path: /config
          sabnzbd:
            - path: /config
          article-check:
            - path: /state
              subPath: article-check
    # Local SSD storage for in-progress downloads. SABnzbd writes here at full
    # speed, then moves completed files to the NFS-backed /media mount.
    incomplete:
      type: hostPath
      hostPath: /mnt/ssd/local/sab
      hostPathType: DirectoryOrCreate
      advancedMounts:
        sabnzbd:
          sabnzbd:
            - path: /incomplete
    media:
      type: persistentVolumeClaim
      existingClaim: media-data
      advancedMounts:
        sabnzbd:
          sabnzbd:
            - path: /media
    article-check-script:
      type: configMap
      identifier: article-check
      defaultMode: 0555
      advancedMounts:
        sabnzbd:
          article-check:
            - path: /scripts
              readOnly: true
    # Mounted as a directory because subPath mounts don't receive Secret updates.
    article-check-secret:
      type: secret
      identifier: article-check
      defaultMode: 0444
      advancedMounts:
        sabnzbd:
          article-check:
            - path: /secret
              readOnly: true
