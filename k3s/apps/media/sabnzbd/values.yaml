# SABnzbd with Gluetun VPN kill-switch sidecar (ProtonVPN / WireGuard).
#
# Network architecture:
#   - Gluetun runs as a regular container alongside SABnzbd (same pod).
#   - SABnzbd shares Gluetun's network namespace automatically (same pod).
#   - All SABnzbd traffic exits through the ProtonVPN WireGuard tunnel.
#   - FIREWALL_OUTBOUND_SUBNETS allows cluster-internal traffic (DNS, APIs)
#     to bypass the VPN so in-cluster service discovery keeps working.
app-template:
  defaultPodOptions:
    nodeSelector:
      kubernetes.io/hostname: k3s-node-01

  controllers:
    sabnzbd:
      strategy: Recreate
      pod:
        # Override k8s DNS to fix resolution inside Gluetun VPN.
        # Default dnsPolicy (ClusterFirst) injects ndots:5 + search domains,
        # which causes musl's resolver to exhaust search suffixes through
        # Gluetun's DoT DNS before trying the bare hostname — failing with
        # "Name has no usable address". Using dnsPolicy=None with a manual
        # config pointing to Gluetun's local DNS avoids this entirely.
        dnsPolicy: None
        dnsConfig:
          nameservers:
            - 127.0.0.1
          options:
            - name: ndots
              value: "0"
      initContainers:
        # Runs once before gluetun/sabnzbd start. Seeds sabnzbd.ini with the
        # host whitelist so the UI is accessible via the ingress hostname on
        # first boot. Skipped on subsequent starts (file already exists).
        config-init:
          image:
            repository: busybox
            tag: "1.37.0"
          command:
            - sh
            - -c
            - |
              if [ ! -f /config/sabnzbd.ini ]; then
                printf '[misc]\nhost_whitelist = sabnzbd.hl.mathielo.com,\n' > /config/sabnzbd.ini
              fi

      containers:
        # Gluetun VPN kill-switch. Runs as a regular container with a postStart
        # lifecycle hook that cleans up stale WireGuard IP rules left by previous
        # pods — fixes "adding IPv6 rule: file exists" on Kubernetes.
        # See: https://github.com/qdm12/gluetun/issues/2471
        gluetun:
          image:
            repository: ghcr.io/qdm12/gluetun
            tag: v3.41.1
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /gluetun-entrypoint
                    - healthcheck
                initialDelaySeconds: 30
                periodSeconds: 30
                failureThreshold: 3
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Clean up stale WireGuard IP rules left by previous pods.
                    # See: https://github.com/qdm12/gluetun/issues/2471
                    (ip rule del table 51820; ip -6 rule del table 51820) 2>/dev/null || true
          env:
            VPN_SERVICE_PROVIDER: protonvpn
            VPN_TYPE: wireguard
            # WIREGUARD_PRIVATE_KEY and WIREGUARD_ADDRESSES injected via values.sops.yaml
            SERVER_COUNTRIES: Sweden
            # Allow traffic to k3s pod CIDR + service CIDR to bypass the VPN tunnel.
            # This keeps in-cluster calls (SABnzbd → Sonarr, DNS, etc.) working.
            FIREWALL_OUTBOUND_SUBNETS: "10.42.0.0/16,10.43.0.0/16"
            # Two DoT upstreams so a Cloudflare blip falls back to Quad9 instead of
            # hitting gluetun's loopback fallback (127.0.0.1:53 = itself → CPU spin).
            DNS_UPSTREAM_RESOLVERS: "cloudflare,quad9"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 1Gi

        sabnzbd:
          image:
            repository: ghcr.io/hotio/sabnzbd
            tag: release-5.0.1
          env:
            PUID: "1000"
            PGID: "1000"
            TZ: Europe/Stockholm
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            # Sabnzbd can spike CPU and RAM usage in post-processing and verification/repair jobs.
            limits:
              memory: 4Gi

  service:
    sabnzbd:
      controller: sabnzbd
      ports:
        http:
          port: 8080

  ingress:
    sabnzbd:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: sabnzbd.hl.mathielo.com
          paths:
            - path: /
              service:
                identifier: sabnzbd
                port: http
      tls:
        - hosts:
            - sabnzbd.hl.mathielo.com
          secretName: sabnzbd-hl-tls

  persistence:
    config:
      existingClaim: sabnzbd-config-lh
      globalMounts:
        - path: /config
    # Local SSD storage for in-progress downloads. SABnzbd writes here at full
    # speed, then moves completed files to the NFS-backed /media mount.
    local-ssd:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 140Gi
      storageClass: local-path
      globalMounts:
        - path: /local-ssd/downloads/
    media:
      type: persistentVolumeClaim
      existingClaim: media-data
      globalMounts:
        - path: /media
