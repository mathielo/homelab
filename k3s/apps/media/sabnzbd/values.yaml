# SABnzbd with Gluetun VPN kill-switch sidecar (ProtonVPN / WireGuard).
#
# Network architecture:
#   - Gluetun runs as a native k8s sidecar (initContainer with restartPolicy: Always).
#     Starts and becomes Ready before SABnzbd, guaranteeing VPN+DNS are healthy first.
#   - SABnzbd shares Gluetun's network namespace automatically (same pod).
#   - All SABnzbd traffic exits through the ProtonVPN WireGuard tunnel.
#   - FIREWALL_OUTBOUND_SUBNETS allows cluster-internal traffic (DNS, APIs)
#     to bypass the VPN so in-cluster service discovery keeps working.
app-template:
  defaultPodOptions:
    nodeSelector:
      kubernetes.io/hostname: k3s-node-01

  controllers:
    sabnzbd:
      strategy: Recreate
      pod:
        # Override k8s DNS to fix resolution inside Gluetun VPN.
        # Default dnsPolicy (ClusterFirst) injects ndots:5 + search domains,
        # which causes musl's resolver to exhaust search suffixes through
        # Gluetun's DoT DNS before trying the bare hostname — failing with
        # "Name has no usable address". Using dnsPolicy=None with a manual
        # config pointing to Gluetun's local DNS avoids this entirely.
        dnsPolicy: None
        dnsConfig:
          nameservers:
            - 127.0.0.1
          options:
            - name: ndots
              value: "0"
      initContainers:
        # Runs once before gluetun/sabnzbd start. Seeds sabnzbd.ini with the
        # host whitelist so the UI is accessible via the ingress hostname on
        # first boot. Skipped on subsequent starts (file already exists).
        config-init:
          image:
            repository: busybox
            tag: "1.38.0"
          command:
            - sh
            - -c
            - |
              if [ ! -f /config/sabnzbd.ini ]; then
                printf '[misc]\nhost_whitelist = sabnzbd.m6o.dev,\n' > /config/sabnzbd.ini
              fi

        # Gluetun VPN kill-switch as a native k8s sidecar (k8s >= 1.29).
        # restartPolicy: Always promotes this initContainer to a sidecar:
        #   - Starts before main containers (SABnzbd waits for it to be Ready)
        #   - Restarts independently on liveness failure
        #   - Terminates AFTER main containers on pod shutdown
        #
        # The readiness probe ensures SABnzbd doesn't start until gluetun's
        # VPN tunnel and DNS forwarder are both confirmed healthy. Without this
        # ordering guarantee, SABnzbd fires DNS queries while gluetun's DoT
        # resolver is still initialising — causing the forwarder to fall back to
        # 127.0.0.1:53 (itself), which creates a self-sustaining DNS loop that
        # pegs gluetun's CPU at its limit.
        #
        # The postStart hook cleans up stale WireGuard IP rules left by previous
        # pods — fixes "adding IPv6 rule: file exists" on Kubernetes.
        # See: https://github.com/qdm12/gluetun/issues/2471
        gluetun:
          image:
            repository: ghcr.io/qdm12/gluetun
            tag: v3.41.3
          restartPolicy: Always
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          probes:
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /gluetun-entrypoint
                    - healthcheck
                initialDelaySeconds: 5
                periodSeconds: 5
                failureThreshold: 12
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /gluetun-entrypoint
                    - healthcheck
                initialDelaySeconds: 30
                periodSeconds: 30
                failureThreshold: 3
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Clean up stale WireGuard IP rules left by previous pods.
                    # See: https://github.com/qdm12/gluetun/issues/2471
                    (ip rule del table 51820; ip -6 rule del table 51820) 2>/dev/null || true
          env:
            VPN_SERVICE_PROVIDER: protonvpn
            VPN_TYPE: wireguard
            # WIREGUARD_PRIVATE_KEY and WIREGUARD_ADDRESSES injected via values.sops.yaml
            SERVER_COUNTRIES: Sweden
            # Allow traffic to k3s pod CIDR + service CIDR to bypass the VPN tunnel.
            # This keeps in-cluster calls (SABnzbd → Sonarr, DNS, etc.) working.
            FIREWALL_OUTBOUND_SUBNETS: "10.42.0.0/16,10.43.0.0/16"
            DNS_UPSTREAM_RESOLVERS: "cloudflare,quad9"
          resources:
            requests:
              cpu: 250m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 1Gi

      containers:
        sabnzbd:
          image:
            repository: ghcr.io/hotio/sabnzbd
            tag: release-5.1.0
          env:
            PUID: "1000"
            PGID: "1000"
            TZ: Europe/Stockholm
          resources:
            requests:
              cpu: 1500m
              memory: 256Mi
            # Sabnzbd can spike CPU and RAM usage in post-processing and verification/repair jobs.
            limits:
              memory: 6Gi

  service:
    sabnzbd:
      controller: sabnzbd
      ports:
        http:
          port: 8080

  ingress:
    sabnzbd:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: sabnzbd.m6o.dev
          paths:
            - path: /
              service:
                identifier: sabnzbd
                port: http
      tls:
        - hosts:
            - sabnzbd.m6o.dev
          secretName: sabnzbd-tls

  persistence:
    config:
      existingClaim: sabnzbd-config-lh
      globalMounts:
        - path: /config
    # Local SSD storage for in-progress downloads. SABnzbd writes here at full
    # speed, then moves completed files to the NFS-backed /media mount.
    incomplete:
      type: hostPath
      hostPath: /mnt/ssd/local/sab
      hostPathType: DirectoryOrCreate
      globalMounts:
        - path: /incomplete
    media:
      type: persistentVolumeClaim
      existingClaim: media-data
      globalMounts:
        - path: /media
