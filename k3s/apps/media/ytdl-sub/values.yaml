# ytdl-sub — declarative, config-as-code YouTube downloader (yt-dlp) feeding Plex.
#
# Runs as a CronJob on k3s-node-02 once nightly: each run reads the subscriptions
# from the ytdl-sub-config ConfigMap, downloads any new channel/playlist videos to
# local NVMe (/working), re-encodes them to H.264 on the node's Intel iGPU
# (VA-API), then moves the finished file to its target folder under /media/lib on
# the NAS. A wrapper (notify-run.sh) posts a Telegram summary on new files/errors.
app-template:
  defaultPodOptions:
    nodeSelector:
      kubernetes.io/hostname: k3s-node-02
    securityContext:
      # Write to the NAS as 1000:1000 to match the rest of the media stack.
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      # render group (GID 993 on k3s-node-02) — grants access to
      # /dev/dri/renderD128 for VA-API hardware H.264 encoding.
      supplementalGroups:
        - 993

  controllers:
    ytdl-sub:
      type: cronjob
      cronjob:
        # Once nightly at 23:00. ytdl-sub is incremental (download-archive), so a
        # missed/failed night is just picked up at the next run — no intra-night
        # retries: a per-video error is logged and skipped, not worth re-running.
        schedule: "0 23 * * *"
        # k8s interprets the schedule in UTC unless told otherwise (the container
        # TZ env only sets the clock, not the trigger). Pin local time so 23:00
        # means 23:00 here, not 01:00.
        timeZone: Europe/Stockholm
        suspend: false
        # Forbid: never overlap runs — a long transcode could outlast midnight.
        concurrencyPolicy: Forbid
        backoffLimit: 0
        successfulJobsHistory: 3
        failedJobsHistory: 3
        ttlSecondsAfterFinished: 86400

      initContainers:
        # /mnt/nvme/local is root-owned, so a DirectoryOrCreate working dir lands
        # as root. Chown it so the uid-1000 main container can write its scratch.
        init-workdir:
          image:
            repository: busybox
            tag: "1.38.0"
          command:
            - sh
            - -c
            - mkdir -p /working && chown 1000:1000 /working
          securityContext:
            runAsUser: 0

      containers:
        ytdl-sub:
          image:
            # Custom image = upstream ytdl-sub (Alpine) + Intel VA-API driver;
            # see Dockerfile. Tag matches the base ytdl-sub version.
            repository: ghcr.io/mathielo/ytdl-sub-vaapi
            tag: "2026.06.12"
          # Wrapper runs ytdl-sub, then posts a Telegram summary when new files
          # landed or the run failed; see notify-run.sh in the ConfigMap.
          command:
            - /bin/sh
          args:
            - "/config/notify-run.sh"
          env:
            TZ: Europe/Stockholm
            # HOME defaults to the read-only /config mount, so yt-dlp can't
            # persist its signature/JS-challenge cache (~/.cache). Point it at
            # the writable NVMe scratch so the cache survives between runs.
            HOME: "/working"
            # YTDLSUB_TG_BOT_TOKEN + YTDLSUB_TG_CHAT_ID are injected from
            # values.sops.yaml (reuses the *arr/searcharr Telegram bot + chat).
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # H.264 encode is on the iGPU now; CPU is only for AV1/VP9 software
              # decode. Keep a 8-core cap so a decode burst can't starve qbt.
              cpu: "8"
              memory: 4Gi
              # One Intel iGPU slot (shared-dev-num=1, otherwise unused on this
              # node) — the device plugin injects /dev/dri for VA-API.
              gpu.intel.com/i915: "1"

  persistence:
    # config.yaml + subscriptions.yaml from the ConfigMap above.
    config:
      type: configMap
      name: ytdl-sub-config
      globalMounts:
        - path: /config
          readOnly: true
    # Local NVMe scratch on k3s-node-02: incomplete downloads + transcode.
    working:
      type: hostPath
      hostPath: /mnt/nvme/local/ytdl-sub
      hostPathType: DirectoryOrCreate
      globalMounts:
        - path: /working
    # Shared NAS volume — finished HEVC files land in /media/lib/yt.
    media:
      type: persistentVolumeClaim
      existingClaim: media-data
      globalMounts:
        - path: /media
