---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ytdl-sub-config
  namespace: media
data:
  config.yaml: |
    configuration:
      # Local NVMe scratch: incomplete downloads + the ffmpeg transcode stay
      # here and only the final .mkv is moved to the target folder on completion.
      working_directory: "/working"
      # The lock defaults to a path relative to cwd (/config, a read-only
      # ConfigMap mount) — point it at the writable scratch instead.
      lock_directory: "/working"
      umask: "002"

    presets:
      # Shared H.264 re-encode + cleanup, layered onto a player preset below.
      # Hardware encode on the Intel iGPU (h264_vaapi). H.264/AAC in mp4 is the
      # universal direct-play target — every Plex client (browsers included)
      # plays it with no server-side transcode. ytdl-sub builds the command as
      # `ffmpeg -i <in> <args> <out>`, so the source is decoded in software (HW
      # decode would need flags before -i) then uploaded to the GPU for encoding.
      # -qp 23 ≈ high quality; lower qp = higher quality + bigger.
      _h264_encode:
        output_options:
          # yt-dlp's raw metadata dump — Plex never reads it, so skip the sidecar
          # (empty string disables the write). The .jpg sidecar stays: it's the
          # Plex poster (see embed_thumbnail note below).
          info_json_name: ""
        ytdl_options:
          # Cap at 4K: the iGPU h264_vaapi encoder rejects frames over 4096x4096,
          # so an 8K source (e.g. 7680x4320 AV1) would fail to encode. Prefer the
          # best video+audio ≤2160p, then fall back to best available ≤2160p.
          format: "bv*[height<=2160]+ba/b[height<=2160]/bv*+ba/b"
        file_convert:
          convert_to: "mp4"
          convert_with: "ffmpeg"
          ffmpeg_post_process_args: >-
            -vaapi_device /dev/dri/renderD128
            -vf format=nv12,hwupload
            -c:v h264_vaapi -qp 23
            -c:a aac -b:a 192k
            -movflags +faststart
        # No embedded thumbnail — the sidecar .jpg next to the file is all Plex
        # needs for the poster. (Embedded into an mkv it became an MJPEG video
        # track that Plex selected as the primary video instead of the encode.)
        embed_thumbnail: False
        chapters:
          embed_chapters: True
          sponsorblock_categories:
            - "sponsor"
            - "selfpromo"
            - "interaction"
          remove_sponsorblock_categories:
            - "sponsor"
            - "selfpromo"

      # The "Music Videos" presets are flat (no Season/episode nesting) and let
      # us override both the folder and the file name. "Band - Song"/"Band -
      # Concert" comes from the YouTube video title as-is; year is the release
      # year when the source has it, otherwise the upload year.
      musicvids:
        preset:
          - "Plex Music Videos"
          - "_h264_encode"
        overrides:
          music_video_directory: "/media/lib/musicvids"
          music_video_file_name: "{title_sanitized} - {music_video_year}"
          music_video_album: "Music Videos"

      concerts:
        preset:
          - "Plex Music Videos"
          - "_h264_encode"
        overrides:
          music_video_directory: "/media/lib/concerts"
          music_video_file_name: "{title_sanitized} - {music_video_year}"

      # General YouTube: nested one folder per playlist, file name = video title.
      youtube:
        preset:
          - "Plex Music Videos"
          - "_h264_encode"
        overrides:
          music_video_directory: "/media/lib/yt"
          music_video_file_name: "{subscription_name_sanitized}/{title_sanitized}"

  subscriptions.yaml: |
    # Each top-level key is a preset that already targets its output folder, so
    # entries are just "Name: url". "= Genre:" sets the genre tag in the NFO.
    # Every entry here lands in /media/lib/musicvids and is tagged album="Music
    # Videos" → one Plex "Music Videos" collection. Add playlists as more
    # "Name: url" lines under "= Music:" (Name becomes the per-video artist tag).
    musicvids:
      = Music:
        "Music Videos": "https://www.youtube.com/playlist?list=PL4ytre2boUiLdi5l28JREv3LiGVKuG-5t"
        "2000-2010 Rock Music Videos": "https://www.youtube.com/playlist?list=PLJGccvC-yhA269oq16Dh3q0uAUYgdJug8"
        # No "/" in the name: it becomes the download-archive filename, and a
        # slash there is read as a path separator (FileNotFoundError on write).
        "80s Heavy Metal & Hard Rock Top 1000": "https://www.youtube.com/playlist?list=PL5fRL6A4m-DFddDPJU5Ugr3NRhxrm5GtR"

    concerts:
      = Concert:
        "Concerts": "https://www.youtube.com/playlist?list=PL4ytre2boUiJz8AB9txijKYGTGYaZZ0uP"

    # youtube:
    #   = Cats:
    #     "Cat TV": "https://www.youtube.com/playlist?list=PL4ytre2boUiKcBwDq1bkQ7fR3nF87LiY-"

  notify-run.sh: |
    #!/bin/sh
    # Run ytdl-sub, then notify Telegram only when new files were downloaded or
    # the run failed — quiet on successful no-op nights. The message is just the
    # new video titles plus ytdl-sub's Download Summary. Bot token/chat ID come
    # from the pod env (injected from values.sops.yaml), so this stays secret-free.
    set -o pipefail
    txn=/working/transaction.log
    out=/working/run.log

    # tee keeps the run streaming to the pod logs while capturing stdout for the
    # Download Summary (printed to stdout, not the transaction log). pipefail
    # makes rc reflect ytdl-sub's exit rather than tee's.
    ytdl-sub --config /config/config.yaml --transaction-log "$txn" sub /config/subscriptions.yaml 2>&1 | tee "$out"
    rc=$?

    # New videos are the .mp4 entries in the transaction log; strip the indent
    # and extension to get one clean title per line.
    videos=$(grep -E '\.mp4$' "$txn" | sed 's/^[[:space:]]*//; s/\.mp4$//')

    if [ "$rc" -ne 0 ]; then
      export TG_TEXT="🚨 ytdl-sub run FAILED (exit $rc)

    $(tail -n 20 "$out")"
    elif [ -n "$videos" ]; then
      export TG_TEXT="✅ ytdl-sub — new downloads

    $videos

    $(sed -n '/Download Summary:/,$p' "$out" | sed 's/^\[ytdl-sub\] //')"
    else
      exit 0
    fi

    python3 /config/telegram-send.py

    # Propagate ytdl-sub's exit so the Job (and failedJobsHistory) reflects a
    # failed run — the notify step above already exited 0 on its own success.
    exit "$rc"

  telegram-send.py: |
    # Posts $TG_TEXT to Telegram. Bot token/chat ID come from the pod env
    # (injected from values.sops.yaml), so this file carries no secrets.
    import os, re, sys, urllib.parse, urllib.request, urllib.error

    # ytdl-sub colorizes its Download Summary; strip the ANSI codes for Telegram.
    text = re.sub(r"\x1b\[[0-9;]*m", "", os.environ["TG_TEXT"])[:4000]
    token = os.environ["YTDLSUB_TG_BOT_TOKEN"]
    body = urllib.parse.urlencode(
        {
            "chat_id": os.environ["YTDLSUB_TG_CHAT_ID"],
            "text": text,
            "disable_web_page_preview": "true",
        }
    ).encode()
    try:
        urllib.request.urlopen(
            f"https://api.telegram.org/bot{token}/sendMessage", data=body, timeout=30
        )
    except urllib.error.HTTPError as e:
        # Surface Telegram's reason (e.g. "chat not found") instead of a traceback.
        sys.exit(f"Telegram API {e.code}: {e.read().decode(errors='replace')}")
