# Seerr — media request portal (successor to Jellyseerr + Overseerr, merged Feb 2026).
# Post-deploy: connect to Jellyfin via http://jellyfin.media.svc.cluster.local:8096
#              then add Sonarr (http://sonarr.media.svc.cluster.local:8989)
#              and Radarr (http://radarr.media.svc.cluster.local:7878).
app-template:
  controllers:
    seerr:
      containers:
        seerr:
          image:
            repository: ghcr.io/seerr-team/seerr
            tag: v3.2.0@sha256:c4cbd5121236ac2f70a843a0b920b68a27976be57917555f1c45b08a1e6b2aad
          env:
            TZ: Europe/Stockholm
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

  service:
    seerr:
      controller: seerr
      ports:
        http:
          port: 5055

  ingress:
    seerr:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: seerr.hl.mathielo.com
          paths:
            - path: /
              service:
                identifier: seerr
                port: http
      tls:
        - hosts:
            - seerr.hl.mathielo.com
          secretName: seerr-hl-tls

  persistence:
    config:
      existingClaim: seerr-config-lh
      globalMounts:
        - path: /app/config
