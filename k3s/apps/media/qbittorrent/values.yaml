# qBittorrent with Gluetun VPN kill-switch sidecar (ProtonVPN / WireGuard).
#
# Network architecture:
#   - Gluetun runs as a regular container alongside qBittorrent (same pod).
#   - qBittorrent shares Gluetun's network namespace automatically (same pod).
#   - All qBittorrent traffic exits through the ProtonVPN WireGuard tunnel.
#   - FIREWALL_OUTBOUND_SUBNETS allows cluster-internal traffic (DNS, APIs)
#     to bypass the VPN so in-cluster service discovery keeps working.
app-template:
  controllers:
    qbittorrent:
      strategy: Recreate
      pod:
        # Override k8s DNS to fix resolution inside Gluetun VPN.
        # Default dnsPolicy (ClusterFirst) injects ndots:5 + search domains,
        # which causes musl's resolver to exhaust search suffixes through
        # Gluetun's DoT DNS before trying the bare hostname — failing with
        # "Name has no usable address". Using dnsPolicy=None with a manual
        # config pointing to Gluetun's local DNS avoids this entirely.
        dnsPolicy: None
        dnsConfig:
          nameservers:
            - 127.0.0.1
          options:
            - name: ndots
              value: "0"

      containers:
        # Gluetun VPN kill-switch. Runs as a regular container with a postStart
        # lifecycle hook that cleans up stale WireGuard IP rules left by previous
        # pods — fixes "adding IPv6 rule: file exists" on Kubernetes.
        # See: https://github.com/qdm12/gluetun/issues/2471
        gluetun:
          image:
            repository: ghcr.io/qdm12/gluetun
            tag: v3.41.1
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - /gluetun-entrypoint
                    - healthcheck
                initialDelaySeconds: 30
                periodSeconds: 30
                failureThreshold: 3
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Clean up stale WireGuard IP rules left by previous pods.
                    # See: https://github.com/qdm12/gluetun/issues/2471
                    (ip rule del table 51820; ip -6 rule del table 51820) 2>/dev/null || true
          env:
            VPN_SERVICE_PROVIDER: protonvpn
            VPN_TYPE: wireguard
            # WIREGUARD_PRIVATE_KEY and WIREGUARD_ADDRESSES injected via values.sops.yaml
            SERVER_COUNTRIES: Sweden
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 2000m
              memory: 1Gi

        qbittorrent:
          image:
            repository: ghcr.io/hotio/qbittorrent
            tag: release-5.1.4
          env:
            PUID: "1000"
            PGID: "1000"
            UMASK: "002"
            TZ: Europe/Stockholm
            WEBUI_PORTS: "8080/tcp"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

  service:
    qbittorrent:
      controller: qbittorrent
      ports:
        http:
          port: 8080

  ingress:
    qbittorrent:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: qbt.hl.mathielo.com
          paths:
            - path: /
              service:
                identifier: qbittorrent
                port: http
      tls:
        - hosts:
            - qbt.hl.mathielo.com
          secretName: qbittorrent-hl-tls

  persistence:
    config:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 1Gi
      storageClass: local-path
      globalMounts:
        - path: /config
    media:
      type: persistentVolumeClaim
      existingClaim: media-data
      globalMounts:
        - path: /media
