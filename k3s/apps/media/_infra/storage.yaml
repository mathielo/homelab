---
# ---------------------------------------------------------------------------
# Static NFS PersistentVolume — UNAS-4
# NAS specs: 4 × 24Tb 7200RPM HDD (RAID 5, ~72 TB usable) + 2x 500 GB M.2 SSD read-write cache
# NFS access is restricted to k3s nodes (10.10.50.10, 10.10.50.11) on the NAS side.
# No CSI driver or provisioner needed — k3s uses kernel NFS via nfs-common.
#
# PersistentVolume to the "Media" share on the UniFi NAS (10.10.1.4, VLAN 1).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-data
spec:
  capacity:
    storage: 52Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nconnect=4
  nfs:
    server: 10.10.1.4
    path: /var/nfs/shared/Media

---
# ---------------------------------------------------------------------------
# Shared media PVC
#
# All ARR apps, download clients, and media servers mount this single volume.
# Keeping dl/ and lib/ under the same NFS mount enables hardlinks — ARR apps
# can "move" completed downloads into the library instantly with no data copy.
#
# Directory layout inside the volume:
#
#   /
#   ├── dl/                  ← download clients write here
#   │   ├── books/
#   │   ├── movies/
#   │   ├── music/
#   │   └── shows/
#   └── lib/                 ← ARR apps hardlink here; media servers read here
#       ├── books/
#       ├── movies/
#       ├── music/
#       └── shows/
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: media
spec:
  storageClassName: ""
  volumeName: media-data
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 52Ti
