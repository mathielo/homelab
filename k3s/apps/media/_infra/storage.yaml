---
# ---------------------------------------------------------------------------
# Static NFS PersistentVolume — UNAS-4
# NAS specs: 4 × 24Tb 7200RPM HDD (RAID 5, ~72 TB usable) + 2x 500 GB M.2 SSD read-write cache
# NFS access is restricted to k3s nodes (10.10.50.10, 10.10.50.11, 10.10.50.12) on the NAS side.
# No CSI driver or provisioner needed — k3s uses kernel NFS via nfs-common.
#
# PersistentVolume to the "Media" share on the UniFi NAS (10.10.50.4, VLAN 50).
# NAS shares the Servers VLAN with the k3s nodes, so NFS stays intra-VLAN (no
# inter-VLAN gateway hop).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-data
spec:
  capacity:
    storage: 52Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nconnect=4
  nfs:
    server: 10.10.50.4
    path: /var/nfs/shared/Media

---
# ---------------------------------------------------------------------------
# Shared media PVC
#
# All ARR apps, download clients, and media servers mount this single volume.
# Keeping dl/ and lib/ under the same NFS mount enables hardlinks — ARR apps
# can "move" completed downloads into the library instantly with no data copy.
#
# Directory layout inside the volume:
#
#   /
#   ├── dl/                  ← download clients write here
#   │   ├── books/
#   │   ├── movies/
#   │   ├── music/
#   │   └── shows/
#   └── lib/                 ← ARR apps hardlink here; media servers read here
#       ├── books/
#       ├── movies/
#       ├── music/
#       └── shows/
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: media
spec:
  storageClassName: ""
  volumeName: media-data
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 52Ti

---
# ---------------------------------------------------------------------------
# PersistentVolume to the "ROMs" share on the UniFi NAS (10.10.50.4, VLAN 50).
#
# Separate from the Media share so the ROM library has its own quota and its
# own NFS export, and so a Syncthing rescan never walks 50 TB of video.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: roms-data
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nconnect=4
  nfs:
    server: 10.10.50.4
    path: /var/nfs/shared/ROMs

---
# ---------------------------------------------------------------------------
# Shared ROM PVC
#
# RomM scans library/; Syncthing pushes library/roms to the Steam Deck and
# receives the Deck's emulator saves into deck/saves. deck/ deliberately sits
# outside library/ so RomM's scanner never sees it.
#
# Directory layout inside the volume:
#
#   /
#   ├── library/            ← RomM scan root
#   │   ├── roms/           ← one dir per platform, named with RomM's slug
#   │   └── bios/           ← same slugs
#   └── deck/
#       └── saves/          ← EmuDeck saves/states, synced back from the Deck
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: roms-data
  namespace: media
spec:
  storageClassName: ""
  volumeName: roms-data
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Ti
