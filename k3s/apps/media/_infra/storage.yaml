---
# ---------------------------------------------------------------------------
# Static NFS PersistentVolume — UNAS-4
#
# Points to the "Media" share on the UniFi NAS (10.10.1.4, VLAN 1).
# NFS access is restricted to k3s nodes (10.10.50.10, 10.10.50.11) on the NAS side.
# No CSI driver or provisioner needed — k3s uses kernel NFS via nfs-common.
#
# NAS specs: 4×4 TB HDD (RAID 5, ~12 TB usable) + 500 GB M.2 SSD cache
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-data
spec:
  capacity:
    storage: 8Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # Increase NFS mount options for better performance.
  mountOptions:
    - nconnect=4
    - rsize=1048576
    - wsize=1048576
  nfs:
    server: 10.10.1.4
    path: /var/nfs/shared/Media

---
# ---------------------------------------------------------------------------
# Shared media PVC
#
# All ARR apps and media servers mount this single volume.
# Directory layout inside the volume (mirrors TRaSH Guide):
#
#   /media/
#   ├── downloads/usenet/
#   │   ├── incomplete/
#   │   └── complete/
#   │       ├── movies/
#   │       ├── tv/
#   │       └── music/
#   └── library/
#       ├── movies/
#       ├── tv/
#       └── music/
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: media
spec:
  storageClassName: ""
  volumeName: media-data
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 8Ti
