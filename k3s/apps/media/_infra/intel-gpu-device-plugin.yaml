---
# ---------------------------------------------------------------------------
# Intel GPU Device Plugin
#
# Exposes gpu.intel.com/i915 resources to Kubernetes so pods can request GPU
# access for hardware transcoding on k3s-node-02's Intel UHD Graphics 770.
#
# Upstream: https://github.com/intel/intel-device-plugins-for-kubernetes
# Manifest derived from deployments/gpu_plugin/base/intel-gpu-plugin.yaml @ v0.35.0
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin
  labels:
    app: intel-gpu-plugin
spec:
  selector:
    matchLabels:
      app: intel-gpu-plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: intel-gpu-plugin
    spec:
      nodeSelector:
        gpu.intel.com/i915: "true"
      priorityClassName: system-node-critical
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
      containers:
        - name: intel-gpu-plugin
          image: intel/intel-gpu-plugin:0.36.0
          imagePullPolicy: IfNotPresent
          # -shared-dev-num lets one physical iGPU advertise N allocatable
          # resources. Set to 2 so Plex (holds a slot 24/7) and the nightly
          # ytdl-sub CronJob can each schedule against the same iGPU — Quick
          # Sync multiplexes concurrent VA-API contexts at the hardware level.
          args:
            - -shared-dev-num=2
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            seLinuxOptions:
              type: container_device_plugin_t
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 40m
              memory: 45Mi
            limits:
              cpu: 100m
              memory: 90Mi
          volumeMounts:
            - name: devfs
              mountPath: /dev/dri
              readOnly: true
            - name: sysfsdrm
              mountPath: /sys/class/drm
              readOnly: true
            - name: kubeletsockets
              mountPath: /var/lib/kubelet/device-plugins
            - name: cdipath
              mountPath: /var/run/cdi
      volumes:
        - name: devfs
          hostPath:
            path: /dev/dri
        - name: sysfsdrm
          hostPath:
            path: /sys/class/drm
        - name: kubeletsockets
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: cdipath
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
