app-template:
  defaultPodOptions:
    automountServiceAccountToken: true

  serviceAccount:
    homepage: {}

  controllers:
    homepage:
      containers:
        homepage:
          image:
            repository: ghcr.io/gethomepage/homepage
            tag: v2.0.0
          env:
            TZ: Europe/Stockholm
            HOMEPAGE_ALLOWED_HOSTS: hl.m6o.dev
            HOMEPAGE_SKIP_TLS_VERIFY: "true"
            # * env vars injected via values.sops.yaml
          resources:
            requests:
              cpu: 10m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi

  service:
    homepage:
      controller: homepage
      ports:
        http:
          port: 3000

  ingress:
    homepage:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: hl.m6o.dev
          paths:
            - path: /
              service:
                identifier: homepage
                port: http
      tls:
        - hosts:
            - hl.m6o.dev
          secretName: homepage-tls

  persistence:
    config:
      type: configMap
      name: homepage
      globalMounts:
        - path: /app/config/settings.yaml
          subPath: settings.yaml
        - path: /app/config/services.yaml
          subPath: services.yaml
        - path: /app/config/widgets.yaml
          subPath: widgets.yaml
        - path: /app/config/bookmarks.yaml
          subPath: bookmarks.yaml
        - path: /app/config/kubernetes.yaml
          subPath: kubernetes.yaml
    favicon:
      type: configMap
      name: homepage-favicon
      globalMounts:
        - path: /app/public/icons/homelab.ico
          subPath: homelab.ico

  configMaps:
    config:
      data:
        # ─────────────────────────────────────────────────────────────────────
        # Homepage is the desktop+mobile control center: every service one tap
        # away, with live status widgets — self-sufficient when away from home.
        # It deliberately does NOT duplicate the rack kiosk's per-node graphs;
        # the kiosk (Prometheus-driven) owns deep metrics + reversible actions.
        # Homepage is read-only by design.
        #
        # Widget `url:` uses in-cluster service DNS (the pod can't resolve the
        # m6o.dev service names — that's Pi-hole split-DNS, browser-only).
        # `href:` uses the ingress URL since the browser, not the pod, opens it.
        # Secrets are `{{HOMEPAGE_VAR_*}}` injected from values.sops.yaml; the
        # outer `{{ "…" }}` is Helm-escaping so the literal token reaches the
        # ConfigMap for Homepage to substitute at runtime.
        # ─────────────────────────────────────────────────────────────────────
        settings.yaml: |
          base: https://hl.m6o.dev
          title: Homelab
          favicon: /icons/homelab.ico
          theme: dark
          color: slate
          background:
            image: https://r2.m6o.dev/bg/neon-lasers-4k.jpg
            opacity: 30
            blur: xl
          headerStyle: boxedWidgets
          cardBlur: md
          pwa:
            icons:
              - src: https://r2.m6o.dev/8matchii/1024x1024.jpg
                type: image/jpeg
                sizes: 1024x1024
          layout:
            Quick links:
              iconsOnly: true
              initiallyCollapsed: false
              style: row
              columns: 5
            Downloads:
              style: row
              columns: 2
              useEqualHeights: true
            Media:
              style: row
              columns: 3
              useEqualHeights: true
            Network & Platform:
              style: row
              columns: 3
              useEqualHeights: true
            Hosts:
              style: row
              columns: 2
              useEqualHeights: true

        kubernetes.yaml: |
          mode: cluster

        widgets.yaml: |
          - kubernetes:
              cluster:
                show: true
                cpu: true
                memory: true
                showLabel: true
                label: k3s cluster
              nodes:
                show: true
          - openmeteo:
              label: Stockholm
              latitude: 59.3293
              longitude: 18.0686
              timezone: Europe/Stockholm
              units: metric
              cache: 5
          - datetime:
              text_size: xl
              format:
                dateStyle: medium
                timeStyle: short
                hourCycle: h23

        services.yaml: |
          - Quick links:
              - qui:
                  icon: qui.png
                  href: https://qui.m6o.dev
                  siteMonitor: http://qui.media.svc.cluster.local:7476
              - Pulsarr:
                  icon: pulsarr.png
                  href: https://pulsarr.m6o.dev
                  siteMonitor: http://pulsarr.media.svc.cluster.local:3003/health
              - Prismarr:
                  icon: mdi-movie-search
                  href: https://prismarr.m6o.dev
                  siteMonitor: http://prismarr.media.svc.cluster.local:7070
              - Longhorn:
                  icon: longhorn.png
                  href: https://lh.m6o.dev
                  siteMonitor: http://longhorn-frontend.longhorn-system.svc.cluster.local
              - Rack kiosk:
                  icon: mdi-monitor-dashboard
                  href: https://kiosk.m6o.dev
                  siteMonitor: http://kiosk.dashboard.svc.cluster.local:8080/healthz

          - Downloads:
              - Autobrr:
                  href: https://autobrr.m6o.dev
                  description: Release automation
                  icon: autobrr.png
                  widget:
                    type: autobrr
                    url: http://autobrr.media.svc.cluster.local:7474
                    key: "{{ "{{HOMEPAGE_VAR_AUTOBRR_KEY}}" }}"
              - qBt SE:
                  href: https://se.qbt.m6o.dev
                  description: Torrents · SE exit
                  icon: qbittorrent.png
                  widget:
                    type: qbittorrent
                    url: http://qbt-se.media.svc.cluster.local:8080
              - qBt BR:
                  href: https://br.qbt.m6o.dev
                  description: Torrents · BR exit
                  icon: qbittorrent.png
                  widget:
                    type: qbittorrent
                    url: http://qbt-br.media.svc.cluster.local:8080
              - SABnzbd:
                  href: https://sabnzbd.m6o.dev
                  description: Usenet downloader
                  icon: sabnzbd.png
                  widget:
                    type: sabnzbd
                    url: http://sabnzbd.media.svc.cluster.local:8080
                    key: "{{ "{{HOMEPAGE_VAR_SABNZBD_KEY}}" }}"

          - Media:
              - Prowlarr:
                  href: https://prowlarr.m6o.dev
                  description: Indexer manager
                  icon: prowlarr.png
                  widget:
                    type: prowlarr
                    url: http://prowlarr.media.svc.cluster.local:9696
                    key: "{{ "{{HOMEPAGE_VAR_PROWLARR_KEY}}" }}"
              - Sonarr:
                  href: https://sonarr.m6o.dev
                  description: TV automation
                  icon: sonarr.png
                  widget:
                    type: sonarr
                    url: http://sonarr.media.svc.cluster.local:8989
                    key: "{{ "{{HOMEPAGE_VAR_SONARR_KEY}}" }}"
              - Radarr:
                  href: https://radarr.m6o.dev
                  description: Movie automation
                  icon: radarr.png
                  widget:
                    type: radarr
                    url: http://radarr.media.svc.cluster.local:7878
                    key: "{{ "{{HOMEPAGE_VAR_RADARR_KEY}}" }}"
              - Bazarr:
                  href: https://bazarr.m6o.dev
                  description: Subtitles
                  icon: bazarr.png
                  widget:
                    type: bazarr
                    url: http://bazarr.media.svc.cluster.local:6767
                    key: "{{ "{{HOMEPAGE_VAR_BAZARR_KEY}}" }}"
              - Profilarr:
                  href: https://profilarr.m6o.dev
                  description: Quality profiles & custom formats
                  icon: profilarr.png
              - Plex:
                  href: https://plex.m6o.dev
                  description: Media server
                  icon: plex.png
                  widget:
                    type: plex
                    url: http://plex.media.svc.cluster.local:32400
                    key: "{{ "{{HOMEPAGE_VAR_PLEX_TOKEN}}" }}"

          - Network & Platform:
              - Pi-hole:
                  href: http://10.10.53.53/admin
                  description: DNS ad-blocking
                  icon: pi-hole.png
                  widget:
                    type: pihole
                    url: http://10.10.53.53
                    version: 6
                    key: "{{ "{{HOMEPAGE_VAR_PIHOLE_KEY}}" }}"
              - UniFi:
                  href: https://10.10.1.1
                  description: Network controller
                  icon: unifi.png
                  widget:
                    type: unifi
                    url: https://10.10.1.1
                    username: "{{ "{{HOMEPAGE_VAR_UNIFI_USER}}" }}"
                    password: "{{ "{{HOMEPAGE_VAR_UNIFI_PASS}}" }}"
              - Gluetun:
                  href: https://se.qbt.m6o.dev
                  description: Download VPN · kill-switch
                  icon: proton-vpn.png
                  # qbt-se's tunnel (the privacy-critical one). Its
                  # Service already exposes gluetun's control server on :8000;
                  # auth defaults to none for in-cluster reads (public IP is
                  # non-sensitive). qbt-br and SABnzbd have their own identical
                  # tunnels — add more widgets here later if you want them too.
                  widget:
                    type: gluetun
                    url: http://qbt-se.media.svc.cluster.local:8000
              - ArgoCD:
                  href: https://argo.m6o.dev
                  description: GitOps deployments
                  icon: argo-cd.png
                  widget:
                    type: argocd
                    url: http://argocd-server.argocd.svc.cluster.local
                    key: "{{ "{{HOMEPAGE_VAR_ARGOCD_KEY}}" }}"
              - Grafana:
                  href: https://grafana.m6o.dev
                  description: Metrics & alerts
                  icon: grafana.png
                  widget:
                    type: grafana
                    version: 2
                    url: http://grafana.monitoring.svc.cluster.local
                    alerts: alertmanager
                    alertmanagerUrl: http://prometheus-alertmanager.monitoring.svc.cluster.local:9093
                    username: "{{ "{{HOMEPAGE_VAR_GRAFANA_USERNAME}}" }}"
                    password: "{{ "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}" }}"
              - Uptime Kuma:
                  href: https://status.m6o.dev
                  description: Service monitoring
                  icon: uptime-kuma.png
                  widget:
                    type: uptimekuma
                    url: http://uptime-kuma.dashboard.svc.cluster.local:3001
                    slug: homelab
                    key: "{{ "{{HOMEPAGE_VAR_UPTIMEKUMA_KEY}}" }}"

          - Hosts:
              - k3s-server:
                  icon: ubuntu.png
                  href: http://10.10.50.10:61208
                  widgets:
                    - type: glances
                      url: http://10.10.50.10:61208
                      version: 4
                      metric: info
                    - type: glances
                      url: http://10.10.50.10:61208
                      version: 4
                      metric: fs:/
              - pi-hole:
                  icon: pi-hole.png
                  href: http://10.10.53.53:61208
                  widgets:
                    - type: glances
                      url: http://10.10.53.53:61208
                      version: 4
                      metric: info
                    - type: glances
                      url: http://10.10.53.53:61208
                      version: 4
                      metric: fs:/
              - k3s-node-01:
                  icon: ubuntu.png
                  href: http://10.10.50.11:61208
                  widgets:
                    - type: glances
                      url: http://10.10.50.11:61208
                      version: 4
                      metric: info
                    - type: glances
                      url: http://10.10.50.11:61208
                      version: 4
                      metric: fs:/
              - k3s-node-02:
                  icon: ubuntu.png
                  href: http://10.10.50.12:61208
                  widgets:
                    - type: glances
                      url: http://10.10.50.12:61208
                      version: 4
                      metric: info
                    - type: glances
                      url: http://10.10.50.12:61208
                      version: 4
                      metric: fs:/

        bookmarks.yaml: |
          - Homelab:
              - GitHub:
                  - icon: github.png
                    href: https://github.com/mathielo/homelab
              - CPU benchmarks:
                  - abbr: CPU
                    href: https://www.cpubenchmark.net/compare/5889vs3565vs3301/Intel-i5-14500T-vs-AMD-Ryzen-5-PRO-3400GE-vs-AMD-Ryzen-3-2200GE
          - Resources:
               - Servers@Home:
                  - abbr: S@H
                    href: https://wiki.serversatho.me/
