app-template:
  serviceAccount:
    homepage: {}

  controllers:
    homepage:
      containers:
        homepage:
          image:
            repository: ghcr.io/gethomepage/homepage
            tag: v1.12.3
          env:
            TZ: Europe/Stockholm
            HOMEPAGE_ALLOWED_HOSTS: hl.mathielo.com
            HOMEPAGE_SKIP_TLS_VERIFY: "true"
            # * env vars injected via values.sops.yaml
          resources:
            requests:
              cpu: 10m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi

  service:
    homepage:
      controller: homepage
      ports:
        http:
          port: 3000

  ingress:
    homepage:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: hl.mathielo.com
          paths:
            - path: /
              service:
                identifier: homepage
                port: http
      tls:
        - hosts:
            - hl.mathielo.com
          secretName: homepage-hl-tls

  persistence:
    config:
      type: configMap
      name: homepage
      globalMounts:
        - path: /app/config/settings.yaml
          subPath: settings.yaml
        - path: /app/config/services.yaml
          subPath: services.yaml
        - path: /app/config/widgets.yaml
          subPath: widgets.yaml
        - path: /app/config/bookmarks.yaml
          subPath: bookmarks.yaml
        - path: /app/config/kubernetes.yaml
          subPath: kubernetes.yaml
    favicon:
      type: configMap
      name: homepage-favicon
      globalMounts:
        - path: /app/public/icons/homelab.ico
          subPath: homelab.ico

  configMaps:
    config:
      data:
        settings.yaml: |
          base: https://hl.mathielo.com
          title: Homelab
          favicon: /icons/homelab.ico
          theme: dark
          color: slate
          background:
            image: https://r2.m6o.dev/bg/neon-lasers-4k.jpg
            opacity: 40
            blur: md
          headerStyle: boxedWidgets
          cardBlur: md
          pwa:
            icons:
              - src: https://r2.m6o.dev/8matchii/1024x1024.jpg
                type: image/jpeg
                sizes: 1024x1024
          layout:
            Infrastructure:
              useEqualHeights: true
              style: row
              columns: 2
            Kubernetes Nodes:
              style: row
              columns: 1
              k3s-server:
                style: row
                columns: 4
                useEqualHeights: true
              k3s-node-01:
                style: row
                columns: 4
                useEqualHeights: true
            Media:
              initiallyCollapsed: true
              useEqualHeights: true
              style: row
              columns: 4

        kubernetes.yaml: |
          mode: cluster

        widgets.yaml: |
          - glances:
              url: http://10.10.53.53:61208
              version: 4
              cpu: true
              mem: true
              cputemp: true
              uptime: true
              disk: fs:/
              expanded: true
              label: pi-hole
          - kubernetes:
              cluster:
                show: true
                cpu: true
                memory: true
              nodes:
                show: true
                cpu: true
                memory: true
        services.yaml: |
          - Infrastructure:
              - UniFi:
                  href: https://10.10.1.1
                  description: Network controller
                  icon: unifi.png
                  widget:
                    type: unifi
                    url: https://10.10.1.1
                    username: "{{ "{{HOMEPAGE_VAR_UNIFI_USER}}" }}"
                    password: "{{ "{{HOMEPAGE_VAR_UNIFI_PASS}}" }}"
              - Pi-hole:
                  href: http://10.10.53.53/admin
                  description: DNS ad-blocking
                  icon: pi-hole.png
                  widget:
                    type: pihole
                    url: http://10.10.53.53
                    version: 6
                    key: "{{ "{{HOMEPAGE_VAR_PIHOLE_KEY}}" }}"
              - ArgoCD:
                  href: https://argocd.hl.mathielo.com
                  description: GitOps deployments
                  icon: argo-cd.png
                  widget:
                    type: argocd
                    url: http://argocd-server.argocd.svc.cluster.local
                    key: "{{ "{{HOMEPAGE_VAR_ARGOCD_KEY}}" }}"
              - Uptime Kuma:
                  href: https://status.hl.mathielo.com
                  description: Service monitoring
                  icon: uptime-kuma.png
                  widget:
                    type: uptimekuma
                    url: http://uptime-kuma.dashboard.svc.cluster.local:3001
                    slug: homelab
                    key: "{{ "{{HOMEPAGE_VAR_UPTIMEKUMA_KEY}}" }}"
              - Grafana:
                  href: https://grafana.hl.mathielo.com/d/rYdddlPWk/node-exporter-full
                  icon: grafana.png
                  description: System & services monitoring
                  widget:
                    type: grafana
                    version: 2
                    url: http://grafana.kube-extra.svc.cluster.local
                    alerts: alertmanager
                    alertmanagerUrl: http://prometheus-alertmanager.kube-extra.svc.cluster.local:9093
                    username: "{{ "{{HOMEPAGE_VAR_GRAFANA_USERNAME}}" }}"
                    password: "{{ "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}" }}"
              - Grafana:
                  href: https://grafana.hl.mathielo.com/d/liz0yRCZz/logs-app
                  description: App logs
                  icon: grafana.png
          - Kubernetes Nodes:
              - k3s-server:
                  icon: k8s
                  href: http://10.10.50.10:61208
                  widgets:
                    - type: glances
                      url: http://10.10.50.10:61208
                      version: 4
                      metric: info
                      refreshInterval: 10000
                    - type: glances
                      url: http://10.10.50.10:61208
                      version: 4
                      metric: cpu
                      cputemp: true
                      chart: false
                      refreshInterval: 10000
                    - type: glances
                      url: http://10.10.50.10:61208
                      version: 4
                      metric: memory
                      chart: false
                      refreshInterval: 10000
                    - type: glances
                      url: http://10.10.50.10:61208
                      version: 4
                      metric: network:enp2s0f0
                      refreshInterval: 10000
                    - type: glances
                      url: http://10.10.50.10:61208
                      version: 4
                      metric: process
                      refreshInterval: 10000
                    - type: glances
                      url: http://10.10.50.10:61208
                      version: 4
                      metric: sensor
                      chart: false
                      refreshInterval: 10000
                    - type: glances
                      url: http://10.10.50.10:61208
                      version: 4
                      metric: fs:/
                      chart: false
                      refreshInterval: 10000
                    - type: glances
                      url: http://10.10.50.10:61208
                      version: 4
                      metric: disk
                      refreshInterval: 10000
              - k3s-node-01:
                  - Info:
                      icon: mdi-chassi
                      widget:
                        type: glances
                        url: http://10.10.50.11:61208
                        version: 4
                        metric: info
                        refreshInterval: 10000
                  - CPU:
                      icon: mdi-chip
                      widget:
                        type: glances
                        url: http://10.10.50.11:61208
                        version: 4
                        metric: cpu
                        cputemp: true
                        chart: true
                        refreshInterval: 10000
                  - Memory:
                      icon: mdi-memory
                      widget:
                        type: glances
                        url: http://10.10.50.11:61208
                        version: 4
                        metric: memory
                        chart: true
                        refreshInterval: 10000
                  - Network:
                      icon: mdi-network
                      widget:
                        type: glances
                        url: http://10.10.50.11:61208
                        version: 4
                        metric: network:enp2s0f0
                        refreshInterval: 10000
                  - Processes:
                      widget:
                        type: glances
                        url: http://10.10.50.11:61208
                        version: 4
                        metric: process
                        refreshInterval: 10000
                  - CPU Temp:
                      icon: mdi-temperature
                      widget:
                        type: glances
                        url: http://10.10.50.11:61208
                        version: 4
                        metric: sensor
                        chart: true
                        refreshInterval: 10000
                  - Disk usage:
                      icon: mdi-harddisk
                      widget:
                        type: glances
                        url: http://10.10.50.11:61208
                        version: 4
                        metric: fs:/
                        chart: true
                        refreshInterval: 10000
                  - Disk I/O:
                      icon: mdi-harddisk
                      widget:
                        type: glances
                        url: http://10.10.50.11:61208
                        version: 4
                        metric: disk
                        refreshInterval: 10000
          - Media:
              - SABnzbd:
                  href: https://sabnzbd.hl.mathielo.com
                  description: Usenet downloader
                  icon: sabnzbd.png
                  widget:
                    type: sabnzbd
                    url: http://sabnzbd.media.svc.cluster.local:8080
                    key: "{{ "{{HOMEPAGE_VAR_SABNZBD_KEY}}" }}"
              - Prowlarr:
                  href: https://prowlarr.hl.mathielo.com
                  description: Indexer manager
                  icon: prowlarr.png
                  widget:
                    type: prowlarr
                    url: http://prowlarr.media.svc.cluster.local:9696
                    key: "{{ "{{HOMEPAGE_VAR_PROWLARR_KEY}}" }}"
              - Radarr:
                  href: https://radarr.hl.mathielo.com
                  description: Movies
                  icon: radarr.png
                  widget:
                    type: radarr
                    url: http://radarr.media.svc.cluster.local:7878
                    key: "{{ "{{HOMEPAGE_VAR_RADARR_KEY}}" }}"
              - Sonarr:
                  href: https://sonarr.hl.mathielo.com
                  description: TV series
                  icon: sonarr.png
                  widget:
                    type: sonarr
                    url: http://sonarr.media.svc.cluster.local:8989
                    key: "{{ "{{HOMEPAGE_VAR_SONARR_KEY}}" }}"
              - Bazarr:
                  href: https://bazarr.hl.mathielo.com
                  description: Subtitles
                  icon: bazarr.png
                  widget:
                    type: bazarr
                    url: http://bazarr.media.svc.cluster.local:6767
                    key: "{{ "{{HOMEPAGE_VAR_BAZARR_KEY}}" }}"
              - Plex:
                  href: https://plex.hl.mathielo.com
                  description: Media server
                  icon: plex.png
                  widget:
                    type: plex
                    url: http://plex.media.svc.cluster.local:32400
                    key: "{{ "{{HOMEPAGE_VAR_PLEX_TOKEN}}" }}"

        bookmarks.yaml: |
          - Developer:
              - GitHub:
                  - abbr: GH
                    href: https://github.com/mathielo/homelab
