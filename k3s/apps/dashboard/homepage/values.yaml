app-template:
  defaultPodOptions:
    automountServiceAccountToken: true

  serviceAccount:
    homepage: {}

  controllers:
    homepage:
      containers:
        homepage:
          image:
            repository: ghcr.io/gethomepage/homepage
            tag: v2.2.0
          env:
            TZ: Europe/Stockholm
            # Homepage rejects Host headers it wasn't told about (DNS-rebinding
            # guard), matching on host *and* port. The cluster entry carries the
            # :3000 the Service sends because Uptime Kuma's monitor reaches the
            # Service directly; hl.m6o.dev needs no port because the ingress
            # terminates on 443 and the browser omits it.
            HOMEPAGE_ALLOWED_HOSTS: hl.m6o.dev,homepage.dashboard.svc.cluster.local:3000
            HOMEPAGE_SKIP_TLS_VERIFY: "true"
            # * env vars injected via values.sops.yaml
          resources:
            requests:
              cpu: 10m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi

  service:
    homepage:
      controller: homepage
      ports:
        http:
          port: 3000

  ingress:
    homepage:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: hl.m6o.dev
          paths:
            - path: /
              service:
                identifier: homepage
                port: http
      tls:
        - hosts:
            - hl.m6o.dev
          secretName: homepage-tls

  persistence:
    config:
      type: configMap
      name: homepage
      globalMounts:
        - path: /app/config/settings.yaml
          subPath: settings.yaml
        - path: /app/config/services.yaml
          subPath: services.yaml
        - path: /app/config/widgets.yaml
          subPath: widgets.yaml
        - path: /app/config/bookmarks.yaml
          subPath: bookmarks.yaml
        - path: /app/config/kubernetes.yaml
          subPath: kubernetes.yaml
    favicon:
      type: configMap
      name: homepage-favicon
      globalMounts:
        - path: /app/public/icons/homelab.ico
          subPath: homelab.ico

  configMaps:
    config:
      data:
        # ─────────────────────────────────────────────────────────────────────
        # Homepage is the desktop+mobile control center: every service one tap
        # away, with live status widgets — self-sufficient when away from home.
        # It deliberately does NOT duplicate the rack kiosk's or Grafana's
        # per-node graphs; those own deep metrics and per-host history. Homepage
        # answers "is anything broken, and where do I click" and is read-only.
        #
        # Widget `url:` uses in-cluster service DNS so the poll stays inside the
        # cluster instead of hairpinning out through the ingress and back.
        # `href:` uses the ingress URL since the browser, not the pod, opens it.
        # Secrets are `{{HOMEPAGE_VAR_*}}` injected from values.sops.yaml; the
        # outer `{{ "…" }}` is Helm-escaping so the literal token reaches the
        # ConfigMap for Homepage to substitute at runtime.
        # ─────────────────────────────────────────────────────────────────────
        settings.yaml: |
          base: https://hl.m6o.dev
          title: Homelab
          favicon: /icons/homelab.ico
          theme: dark
          color: slate
          background:
            image: https://r2.m6o.dev/bg/neon-lasers-4k.jpg
            opacity: 30
            blur: xl
          headerStyle: boxedWidgets
          cardBlur: md
          statusStyle: dot
          useEqualHeights: true
          # Renovate owns image tags; an in-app update banner has nothing to act on.
          hideVersion: true
          disableUpdateCheck: true

          providers:
            # Longhorn's in-cluster API is unauthenticated, so the header widget
            # needs the URL only.
            longhorn:
              url: http://longhorn-frontend.longhorn-system.svc.cluster.local

          quicklaunch:
            provider: custom
            url: https://srx.m6o.dev/search?q=
            suggestionUrl: https://srx.m6o.dev/autocompleter?q=
            showSearchSuggestions: true
            searchDescriptions: true
            hideVisitURL: true

          pwa:
            icons:
              - src: https://r2.m6o.dev/8matchii/1024x1024.jpg
                type: image/jpeg
                sizes: 1024x1024
            shortcuts:
              - name: Media
                url: /#media
              - name: Downloads
                url: /#downloads
              - name: Infra
                url: /#infra

          layout:
            Quick links:
              tab: Home
              style: row
              columns: 6
              iconsOnly: true
            Health:
              tab: Home
              style: row
              columns: 2
            Homelab:
              tab: Home
            Resources:
              tab: Home

            Library:
              tab: Media
              style: row
              columns: 4
            Automation:
              tab: Media
              style: row
              columns: 4
            Games:
              tab: Media
              style: row
              columns: 2

            Torrents:
              tab: Downloads
              style: row
              columns: 3
            Grabbers:
              tab: Downloads
              style: row
              columns: 4

            Platform:
              tab: Infra
              style: row
              columns: 2
            Network:
              tab: Infra
              style: row
              columns: 4
            Tools:
              tab: Infra
              style: row
              columns: 2
            Hosts:
              tab: Infra
              style: row
              columns: 4
              initiallyCollapsed: true

        kubernetes.yaml: |
          mode: cluster

        widgets.yaml: |
          # Cluster totals only — per-node CPU/memory lives in the Grafana
          # homelab-overview dashboard and on the rack kiosk.
          - kubernetes:
              cluster:
                show: true
                cpu: true
                memory: true
                showLabel: true
                label: k3s cluster
              nodes:
                show: false
          - longhorn:
              total: true
              labels: false
              nodes: false
              expanded: false
          - openmeteo:
              label: Stockholm
              latitude: 59.3293
              longitude: 18.0686
              timezone: Europe/Stockholm
              units: metric
              cache: 5
          - datetime:
              text_size: xl
              format:
                dateStyle: medium
                timeStyle: short
                hourCycle: h23

        services.yaml: |
          # Icons-only launchers for the daily-driver apps. Each also has a full
          # card on its own tab; these entries carry no widget or siteMonitor so
          # they add no extra polling.
          - Quick links:
              - Rack kiosk:
                  icon: mdi-monitor-dashboard
                  href: https://kiosk.m6o.dev
              - Plex:
                  icon: plex.png
                  href: https://plex.m6o.dev
              - qui:
                  icon: qui.png
                  href: https://qui.m6o.dev
              - Yata:
                  icon: mdi-chart-box
                  href: https://yata.m6o.dev
              - SearXNG:
                  icon: searxng.png
                  href: https://srx.m6o.dev
              - Miniflux:
                  icon: miniflux.png
                  href: https://miniflux.m6o.dev

          - Health:
              - Grafana:
                  href: https://grafana.m6o.dev
                  description: Metrics & alerts
                  icon: grafana.png
                  widget:
                    type: grafana
                    version: 2
                    url: http://grafana.monitoring.svc.cluster.local
                    alerts: alertmanager
                    alertmanagerUrl: http://prometheus-alertmanager.monitoring.svc.cluster.local:9093
                    username: "{{ "{{HOMEPAGE_VAR_GRAFANA_USERNAME}}" }}"
                    password: "{{ "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}" }}"
              - Uptime Kuma:
                  href: https://status.m6o.dev
                  description: Service monitoring
                  icon: uptime-kuma.png
                  widget:
                    type: uptimekuma
                    url: http://uptime-kuma.dashboard.svc.cluster.local:3001
                    slug: homelab
                    key: "{{ "{{HOMEPAGE_VAR_UPTIMEKUMA_KEY}}" }}"

          - Library:
              - Plex:
                  href: https://plex.m6o.dev
                  description: Media server
                  icon: plex.png
                  widget:
                    type: plex
                    url: http://plex.media.svc.cluster.local:32400
                    key: "{{ "{{HOMEPAGE_VAR_PLEX_TOKEN}}" }}"
              - Sonarr:
                  href: https://sonarr.m6o.dev
                  description: TV automation
                  icon: sonarr.png
                  widget:
                    type: sonarr
                    url: http://sonarr.media.svc.cluster.local:8989
                    key: "{{ "{{HOMEPAGE_VAR_SONARR_KEY}}" }}"
              - Radarr:
                  href: https://radarr.m6o.dev
                  description: Movie automation
                  icon: radarr.png
                  widget:
                    type: radarr
                    url: http://radarr.media.svc.cluster.local:7878
                    key: "{{ "{{HOMEPAGE_VAR_RADARR_KEY}}" }}"
              - Bazarr:
                  href: https://bazarr.m6o.dev
                  description: Subtitles
                  icon: bazarr.png
                  widget:
                    type: bazarr
                    url: http://bazarr.media.svc.cluster.local:6767
                    key: "{{ "{{HOMEPAGE_VAR_BAZARR_KEY}}" }}"

          - Automation:
              - Prowlarr:
                  href: https://prowlarr.m6o.dev
                  description: Indexer manager
                  icon: prowlarr.png
                  widget:
                    type: prowlarr
                    url: http://prowlarr.media.svc.cluster.local:9696
                    key: "{{ "{{HOMEPAGE_VAR_PROWLARR_KEY}}" }}"
              - Profilarr:
                  href: https://profilarr.m6o.dev
                  description: Quality profiles & custom formats
                  icon: profilarr.png
                  siteMonitor: http://profilarr.media.svc.cluster.local:6868
              - Pulsarr:
                  href: https://pulsarr.m6o.dev
                  description: Watchlist sync
                  icon: pulsarr.png
                  siteMonitor: http://pulsarr.media.svc.cluster.local:3003/health
              - Prismarr:
                  href: https://prismarr.m6o.dev
                  description: Library insights
                  icon: mdi-movie-search
                  siteMonitor: http://prismarr.media.svc.cluster.local:7070

          - Games:
              - RomM:
                  href: https://romm.m6o.dev
                  description: ROM library
                  icon: romm.png
                  widget:
                    type: romm
                    url: http://romm.media.svc.cluster.local:8080
              - Syncthing:
                  href: https://syncthing.m6o.dev
                  description: ROM & save sync · Steam Deck
                  icon: syncthing.png
                  siteMonitor: http://syncthing.media.svc.cluster.local:8384

          - Torrents:
              - qBt SE:
                  href: https://se.qbt.m6o.dev
                  description: Torrents · SE exit
                  icon: qbittorrent.png
                  widget:
                    type: qbittorrent
                    url: http://qbt-se.media.svc.cluster.local:8080
              - qBt BR:
                  href: https://br.qbt.m6o.dev
                  description: Torrents · BR exit
                  icon: qbittorrent.png
                  widget:
                    type: qbittorrent
                    url: http://qbt-br.media.svc.cluster.local:8080
              - qBt MAM:
                  href: https://mam.qbt.m6o.dev
                  description: Torrents · MAM
                  icon: qbittorrent.png
                  widget:
                    type: qbittorrent
                    url: http://qbt-mam.media.svc.cluster.local:8080

          - Grabbers:
              - SABnzbd:
                  href: https://sabnzbd.m6o.dev
                  description: Usenet downloader
                  icon: sabnzbd.png
                  widget:
                    type: sabnzbd
                    url: http://sabnzbd.media.svc.cluster.local:8080
                    key: "{{ "{{HOMEPAGE_VAR_SABNZBD_KEY}}" }}"
              - Autobrr:
                  href: https://autobrr.m6o.dev
                  description: Release automation
                  icon: autobrr.png
                  widget:
                    type: autobrr
                    url: http://autobrr.media.svc.cluster.local:7474
                    key: "{{ "{{HOMEPAGE_VAR_AUTOBRR_KEY}}" }}"
              - qui:
                  href: https://qui.m6o.dev
                  description: qBittorrent manager
                  icon: qui.png
                  siteMonitor: http://qui.media.svc.cluster.local:7476
              - Yata:
                  href: https://yata.m6o.dev
                  description: Tracker stats & ratio
                  icon: mdi-chart-box
                  siteMonitor: http://yata.dashboard.svc.cluster.local:8420

          - Platform:
              - ArgoCD:
                  href: https://argo.m6o.dev
                  description: GitOps deployments
                  icon: argo-cd.png
                  widget:
                    type: argocd
                    url: http://argocd-server.argocd.svc.cluster.local
                    key: "{{ "{{HOMEPAGE_VAR_ARGOCD_KEY}}" }}"
              - Longhorn:
                  href: https://lh.m6o.dev
                  description: Block storage
                  icon: longhorn.png
                  siteMonitor: http://longhorn-frontend.longhorn-system.svc.cluster.local

          - Network:
              - Pi-hole:
                  href: http://10.10.53.53/admin
                  description: DNS ad-blocking
                  icon: pi-hole.png
                  widget:
                    type: pihole
                    url: http://10.10.53.53
                    version: 6
                    key: "{{ "{{HOMEPAGE_VAR_PIHOLE_KEY}}" }}"
              - UniFi:
                  href: https://10.10.1.1
                  description: Network controller
                  icon: unifi.png
                  widget:
                    type: unifi
                    url: https://10.10.1.1
                    username: "{{ "{{HOMEPAGE_VAR_UNIFI_USER}}" }}"
                    password: "{{ "{{HOMEPAGE_VAR_UNIFI_PASS}}" }}"
              - Gluetun:
                  href: https://se.qbt.m6o.dev
                  description: Download VPN · kill-switch
                  icon: proton-vpn.png
                  # qbt-se's tunnel (the privacy-critical one). Its
                  # Service already exposes gluetun's control server on :8000;
                  # auth defaults to none for in-cluster reads (public IP is
                  # non-sensitive). qbt-br, qbt-mam and SABnzbd have their own
                  # identical tunnels — add more widgets here if you want them.
                  widget:
                    type: gluetun
                    url: http://qbt-se.media.svc.cluster.local:8000
              - Tailscale:
                  href: https://login.tailscale.com/admin/machines
                  description: Overlay network
                  icon: tailscale.png
                  # Per-device widget: this is the k3s-server node, which is the
                  # subnet router for 10.10.50.0/24 — if its key expires, remote
                  # access to the whole LAN goes with it.
                  widget:
                    type: tailscale
                    deviceid: "{{ "{{HOMEPAGE_VAR_TAILSCALE_DEVICEID}}" }}"
                    key: "{{ "{{HOMEPAGE_VAR_TAILSCALE_KEY}}" }}"
                    fields: ["address", "last_seen", "expires"]

          - Tools:
              - SearXNG:
                  href: https://srx.m6o.dev
                  description: Metasearch · dashboard search bar
                  icon: searxng.png
                  siteMonitor: http://searxng.tools.svc.cluster.local:8080
              - Miniflux:
                  href: https://miniflux.m6o.dev
                  description: RSS reader
                  icon: miniflux.png
                  widget:
                    type: miniflux
                    url: http://miniflux.tools.svc.cluster.local:8080
                    key: "{{ "{{HOMEPAGE_VAR_MINIFLUX_KEY}}" }}"

          # Root-filesystem headroom only. Everything else glances can report
          # (CPU, memory, load, sensors) is in the Grafana homelab-overview
          # dashboard with history; a disk filling up is the one thing worth a
          # number on the dashboard itself.
          - Hosts:
              - k3s-server:
                  icon: ubuntu.png
                  href: http://10.10.50.10:61208
                  widget:
                    type: glances
                    url: http://10.10.50.10:61208
                    version: 4
                    metric: fs:/
              - k3s-node-01:
                  icon: ubuntu.png
                  href: http://10.10.50.11:61208
                  widget:
                    type: glances
                    url: http://10.10.50.11:61208
                    version: 4
                    metric: fs:/
              - k3s-node-02:
                  icon: ubuntu.png
                  href: http://10.10.50.12:61208
                  widget:
                    type: glances
                    url: http://10.10.50.12:61208
                    version: 4
                    metric: fs:/
              - pi-hole:
                  icon: pi-hole.png
                  href: http://10.10.53.53:61208
                  widget:
                    type: glances
                    url: http://10.10.53.53:61208
                    version: 4
                    metric: fs:/

        bookmarks.yaml: |
          - Homelab:
              - GitHub:
                  - icon: github.png
                    href: https://github.com/mathielo/homelab
              - CPU benchmarks:
                  - abbr: CPU
                    href: https://www.cpubenchmark.net/compare/5889vs3565vs3301/Intel-i5-14500T-vs-AMD-Ryzen-5-PRO-3400GE-vs-AMD-Ryzen-3-2200GE
          - Resources:
              - Servers@Home:
                  - abbr: S@H
                    href: https://wiki.serversatho.me/
