---
apiVersion: v1
kind: ConfigMap
metadata:
  name: autokuma-monitors
  namespace: dashboard
data:
  # --- Groups ---
  dashboard.json: |
    {
      "type": "group",
      "name": "Dashboard"
    }
  infrastructure.json: |
    {
      "type": "group",
      "name": "Infrastructure"
    }
  media.json: |
    {
      "type": "group",
      "name": "Media"
    }
  downloads.json: |
    {
      "type": "group",
      "name": "Downloads"
    }
  tools.json: |
    {
      "type": "group",
      "name": "Tools"
    }
  # --- Dashboard ---
  homepage.json: |
    {
      "type": "http",
      "name": "Homepage",
      "url": "http://homepage.dashboard.svc.cluster.local:3000",
      "parent_name": "dashboard"
    }
  uptime-kuma-monitor.json: |
    {
      "type": "http",
      "name": "Uptime Kuma",
      "url": "http://uptime-kuma.dashboard.svc.cluster.local:3001",
      "parent_name": "dashboard"
    }

  # --- Infrastructure ---
  grafana.json: |
    {
      "type": "http",
      "name": "Grafana",
      "url": "http://grafana.monitoring.svc.cluster.local",
      "parent_name": "infrastructure"
    }
  prometheus.json: |
    {
      "type": "http",
      "name": "Prometheus",
      "url": "http://prometheus-server.monitoring.svc.cluster.local",
      "parent_name": "infrastructure"
    }
  pihole-dns.json: |
    {
      "type": "dns",
      "name": "Pi-hole DNS",
      "hostname": "google.com",
      "dns_resolve_server": "10.10.53.53",
      "port": 53,
      "parent_name": "infrastructure"
    }

  # --- Media ---
  sonarr.json: |
    {
      "type": "http",
      "name": "Sonarr",
      "url": "http://sonarr.media.svc.cluster.local:8989",
      "parent_name": "media"
    }
  radarr.json: |
    {
      "type": "http",
      "name": "Radarr",
      "url": "http://radarr.media.svc.cluster.local:7878",
      "parent_name": "media"
    }
  prowlarr.json: |
    {
      "type": "http",
      "name": "Prowlarr",
      "url": "http://prowlarr.media.svc.cluster.local:9696",
      "parent_name": "media"
    }
  bazarr.json: |
    {
      "type": "http",
      "name": "Bazarr",
      "url": "http://bazarr.media.svc.cluster.local:6767",
      "parent_name": "media"
    }
  plex.json: |
    {
      "type": "http",
      "name": "Plex",
      "url": "http://plex.media.svc.cluster.local:32400/web",
      "parent_name": "media"
    }

  # --- Downloads ---
  sabnzbd.json: |
    {
      "type": "http",
      "name": "SABnzbd",
      "url": "http://sabnzbd.media.svc.cluster.local:8080",
      "parent_name": "downloads"
    }

  # --- Tools ---
  searxng.json: |
    {
      "type": "http",
      "name": "SearXNG",
      "url": "http://searxng.tools.svc.cluster.local:8080",
      "parent_name": "tools"
    }
  # Sure enforces SSL, so pinging the in-cluster HTTP URL returns a 302
  # redirect. This service must be watched from the ingress URL instead.
  sure.json: |
    {
      "type": "http",
      "name": "Sure",
      "url": "https://sure.m6o.dev",
      "parent_name": "tools"
    }
  miniflux.json: |
    {
      "type": "http",
      "name": "Miniflux",
      "url": "http://miniflux.tools.svc.cluster.local:8080/healthcheck",
      "parent_name": "tools"
    }
