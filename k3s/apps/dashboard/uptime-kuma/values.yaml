app-template:
  controllers:
    uptime-kuma:
      containers:
        uptime-kuma:
          image:
            repository: louislam/uptime-kuma
            tag: "2.4.0"
          env:
            TZ: Europe/Stockholm
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

        autokuma:
          image:
            repository: ghcr.io/bigboot/autokuma
            tag: "2.0.0"
          env:
            AUTOKUMA__KUMA__URL: http://localhost:3001
            AUTOKUMA__KUMA__USERNAME: admin
            # AUTOKUMA__KUMA__PASSWORD injected via values.sops.yaml
            AUTOKUMA__DOCKER__ENABLED: "false"
            AUTOKUMA__FILES__ENABLED: "true"
            AUTOKUMA__FILES__FOLLOW_SYMLINKS: "true"
            AUTOKUMA__STATIC_MONITORS: /monitors
            AUTOKUMA__KUMA__CONNECT_TIMEOUT: "30"
            AUTOKUMA__KUMA__CALL_TIMEOUT: "30"
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

  service:
    uptime-kuma:
      controller: uptime-kuma
      ports:
        http:
          port: 3001

  ingress:
    uptime-kuma:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: status.m6o.dev
          paths:
            - path: /
              service:
                identifier: uptime-kuma
                port: http
      tls:
        - hosts:
            - status.m6o.dev
          secretName: uptime-kuma-tls

  persistence:
    data:
      existingClaim: uptime-kuma-data-lh
      advancedMounts:
        uptime-kuma:
          uptime-kuma:
            - path: /app/data
          autokuma:
            - path: /data
    monitors:
      type: configMap
      name: autokuma-monitors
      advancedMounts:
        uptime-kuma:
          autokuma:
            - path: /monitors
