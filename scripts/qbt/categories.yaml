# qBittorrent categories pushed via /api/v2/torrents/createCategory.
# Save paths are inside the container — /local is the per-instance NVMe
# hostPath on k3s-node-02; /media/dl/* is the shared UNAS-4 NFS share.
# Apply with: scripts/qbt/apply-categories.sh <instance>

### Local
# NVMe
free: { save_path: /local/free } # Local (transient, often deleted)
# DAS
r0: { save_path: /r0 } # DAS-backed scratch on k3s-node-02
uploader: { save_path: /r0/uploader } # For own uploads to trackers

### Remote
# NAS
movies: { save_path: /media/dl/movies } # NAS (Radarr/Sonarr fetches from here)
shows: { save_path: /media/dl/shows } # NAS (Radarr/Sonarr fetches from here)
parrked: { save_path: /media/dl/parrked } # NAS parked for eventual use in *Arr stack
