# qBittorrent preferences pushed via /api/v2/app/setPreferences.
# Tuned for power-seeder profile on k3s-node-02 (i5-14500T, 16 GB RAM, Samsung 990 Pro NVMe),
# two instances per node. Apply with: scripts/qbt/apply-prefs.sh <instance>

# === Downloads / Save Management ===
save_path: /r0 # Default save path (DAS RAID0)
temp_path: /local/_incomplete # Keep incomplete torrents in
temp_path_enabled: true # Use a separate path for incomplete torrents
preallocate_all: false # Pre-allocate disk space for all files
incomplete_files_ext: false # Append .!qB extension to incomplete files
auto_tmm_enabled: true # Default to Automatic Torrent Management
torrent_changed_tmm_enabled: true # Relocate torrent when its category changes
save_path_changed_tmm_enabled: true # Relocate torrents when default save path changes
category_changed_tmm_enabled: true # Relocate torrents when category save path changes
delete_torrent_content_files: true # When removing a torrent, default to "delete content"

# === Disk I/O & Memory ===
disk_cache: 384 # Disk cache size (MiB) — capped to keep peak RSS clear of the 4Gi container limit (libtorrent spikes OOM-killed qbt-se at 768)
disk_cache_ttl: 60 # Disk cache expiry (seconds)
async_io_threads: 8 # Async I/O threads
file_pool_size: 400 # Max open file handles
checking_memory_use: 128 # Memory used for hash-checking (MiB)
enable_coalesce_read_write: true # Coalesce adjacent reads/writes
enable_piece_extent_affinity: true # Piece extent affinity (better disk locality)
hashing_threads: 2 # Threads for piece hash verification
max_active_checking_torrents: 2 # Torrents that can verify in parallel
disk_queue_size: 16777216 # Disk I/O queue size (bytes — 16 MiB)

# === Speed limits ===
dl_limit: 104857600 # Global download limit (bytes/s — 100 MiB/s, leaves headroom for the rest of the LAN)
up_limit: 104857600 # Global upload limit (bytes/s — 100 MiB/s)
alt_dl_limit: 41943040 # Alt-mode download limit (bytes/s — 40 MiB/s)
alt_up_limit: 41943040 # Alt-mode upload limit (bytes/s — 40 MiB/s)
scheduler_enabled: false # Time-of-day alt-speed scheduler

# === BitTorrent / Queueing ===
queueing_enabled: true # Torrent queueing
max_active_downloads: 12 # Max simultaneously downloading torrents
max_active_uploads: -1 # Max simultaneously uploading (seeding) torrents (-1 = unlimited)
max_active_torrents: -1 # Max active torrents overall (-1 = unlimited, downloads still capped by max_active_downloads)
max_connec: 200 # Global maximum connections
max_connec_per_torrent: 40 # Per-torrent maximum connections
max_uploads: 50 # Global upload slots
max_uploads_per_torrent: 6 # Per-torrent upload slots
enable_multi_connections_from_same_ip: true # Allow multiple connections from the same IP
dont_count_slow_torrents: true # Slow torrents do not consume active slots
slow_torrent_dl_rate_threshold: 100 # Slow-classify download threshold (KiB/s)
slow_torrent_ul_rate_threshold: 100 # Slow-classify upload threshold (KiB/s)
slow_torrent_inactive_timer: 120 # Slow-classify inactivity timer (seconds)

# === Network interface binding (VPN) ===
current_network_interface: tun0 # Bind to the WireGuard tunnel, not eth0 — by name so libtorrent re-binds across VPN reconnects (incoming forwarded-port connections land on tun0)
current_interface_address: "" # All addresses on tun0

# === Privacy / Trackers ===
dht: false # DHT (off — private trackers)
pex: false # PEX peer exchange (off — private trackers)
lsd: false # Local Service Discovery (off — private trackers)
upnp: false # UPnP/NAT-PMP (gluetun owns port forwarding)
reannounce_when_address_changed: true # Re-announce when IP/port changes (VPN reconnect)
connection_speed: 10 # Connection attempts per second
socket_backlog_size: 256 # TCP listen() backlog

# === Torrent .torrent file export (for cross-seed) ===
export_dir: "" # Export active .torrent files here
export_dir_fin: "" # Export completed .torrent files here
